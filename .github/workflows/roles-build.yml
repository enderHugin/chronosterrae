name: Papeles de personas (Wikidata)

# Papel de cada persona de los sucesos (rey, papa, escritor, compositor...) para su icono, desde Wikidata via QLever (scripts/build-roles.js):
# clases verificadas por su etiqueta, ocupacion (P106) o cargo (P39) y, si hay varios, el que antes nombra la descripcion. Deja el resultado
# en la rama `roles-build` para revisarlo; con mode=publish ademas lo copia a data/people/.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'run | publish'
        default: 'run'

permissions:
  contents: write

concurrency:
  group: roles-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MODE: ${{ github.event.inputs.mode }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Construir
        run: node scripts/build-roles.js --out /tmp/roles-out 2> /tmp/build.log

      - name: Resumen en el log
        if: always()
        run: |
          tail -n 40 /tmp/build.log || true
          ls -la /tmp/roles-out 2>/dev/null || true

      - name: Publicar en main (data/people)
        if: env.MODE == 'publish'
        run: |
          set -euo pipefail
          git config user.name "ChronosTerrae-Build"
          git config user.email "bot@chronosterrae.local"
          mkdir -p data/people
          cp /tmp/roles-out/roles.json /tmp/roles-out/manifest.json data/people/
          git add data/people
          if git diff --staged --quiet; then echo "Sin cambios."; else
            git commit -m "Datos: papel de cada persona desde Wikidata (CC0)"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Informe en la rama roles-build
        if: always()
        run: |
          set -euo pipefail
          git config user.name "ChronosTerrae-Build"
          git config user.email "bot@chronosterrae.local"
          git switch --orphan roles-build
          cp /tmp/build.log build.log || true
          if [ -d /tmp/roles-out ]; then cp -r /tmp/roles-out out; git add out; fi
          git add build.log
          git commit -m "Papeles $(date -u +%Y-%m-%dT%H:%MZ)"
          git push --force origin roles-build
