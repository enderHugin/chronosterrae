name: AI Harvester Swarm

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

# Nunca dos ingesta solapadas: si llegan a la vez, la segunda espera.
concurrency:
  group: harvest-swarm
  cancel-in-progress: false

jobs:
  ingest-data:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar repositorio fundacional
        uses: actions/checkout@v4

      - name: ⚙️ Configurar entorno Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: 📡 Ejecutar Sismógrafo (AI Harvester)
        # stdout del script = SOLO JSON. Los logs van a stderr.
        run: node scripts/harvester.js > /tmp/harvest.json

      - name: 🧪 Validar y archivar (nunca commitear JSON roto)
        id: validate
        run: |
          node scripts/archive-harvest.js /tmp/harvest.json
          echo "has_features=$([ "$(jq -r '.metadata.total_anomalies_detected' /tmp/harvest.json)" -gt 0 ] && echo 1 || echo 0)" >> "$GITHUB_OUTPUT"

      - name: 💾 Inyectar y confirmar
        if: steps.validate.outputs.has_features == '1'
        run: |
          set -euo pipefail
          git config user.name "ChronosTerrae-Swarm"
          git config user.email "bot@chronosterrae.local"
          git add latest_harvest.json data/harvests
          if git diff --staged --quiet; then
            echo "Sin cambios nuevos."
          else
            git commit -m "🤖 [CRDT] Ingesta automatizada de anomalías temporales"
          fi
          git pull --rebase origin HEAD
          git push

      - name: 🗃️ Archivar ciclo sin vectores
        if: steps.validate.outputs.has_features == '0'
        run: |
          set -euo pipefail
          git config user.name "ChronosTerrae-Swarm"
          git config user.email "bot@chronosterrae.local"
          git add data/harvests
          if git diff --staged --quiet; then
            echo "Ciclo vacío: nada que archivar."
          else
            git commit -m "🗃️ Ciclo de ingesta sin vectores (latest_harvest.json intacto)"
          fi
          git pull --rebase origin HEAD
          git push
