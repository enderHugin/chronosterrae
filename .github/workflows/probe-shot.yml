name: Sonda de captura (render real)

# Fotografia la web publicada en una vista dada, con variantes que apagan capas. El resultado va a la rama `probe-shot`, nunca a `main`.
on:
  workflow_dispatch:
    inputs:
      lng: { description: 'longitud (vacio = serie fija)', default: '' }
      lat: { description: 'latitud', default: '' }
      zoom: { description: 'zoom', default: '' }
      nombres: { description: "si = solo las vistas de nombres geograficos; iconos = solo las vistas de iconos de sucesos; diseno = solo epocas y maquetacion (movil, tableta); buscar = el buscador (lista, vuelo, ficha, imagenes)", default: '' }
  # Revision rutinaria: cada vez que se publica la web, se fotografia la serie fija de vistas (ver SUITE en scripts/probe-shot.js).
  workflow_run:
    workflows: ['Publicar web (Pages)']
    types: [completed]

permissions:
  contents: write

concurrency:
  group: probe-shot
  cancel-in-progress: false

jobs:
  shot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar Playwright (sin guardar en el repo)
        run: |
          npm install --no-save --no-package-lock playwright@1.49.1
          # Los paquetes del sistema llegan por apt y a veces el DNS del ejecutor falla un rato (paso el 2026-11-11): hasta 3 intentos.
          for i in 1 2 3; do
            if npx playwright install --with-deps chromium; then exit 0; fi
            echo "Intento $i fallido; reintento en $((i * 45)) s"; sleep $((i * 45)); sudo apt-get update || true
          done
          exit 1
      - name: Fotografiar la demo publicada
        env:
          LNG: ${{ github.event.inputs.lng }}
          LAT: ${{ github.event.inputs.lat }}
          ZOOM: ${{ github.event.inputs.zoom }}
          NOMBRES: ${{ github.event.inputs.nombres }}
        run: |
          if [ "$NOMBRES" = "buscar" ]; then
            node scripts/probe-search.js https://enderhugin.github.io/chronosterrae/ /tmp/shots > /tmp/shot.log 2>&1 || true
          elif [ "$NOMBRES" = "iconos" ]; then
            node scripts/probe-shot.js https://enderhugin.github.io/chronosterrae/ /tmp/shots iconos > /tmp/shot.log 2>&1 || true
          elif [ "$NOMBRES" = "diseno" ]; then
            node scripts/probe-shot.js https://enderhugin.github.io/chronosterrae/ /tmp/shots diseno > /tmp/shot.log 2>&1 || true
          elif [ -n "$NOMBRES" ]; then
            node scripts/probe-shot.js https://enderhugin.github.io/chronosterrae/ /tmp/shots nombres > /tmp/shot.log 2>&1 || true
          elif [ -n "$LNG" ] && [ -n "$LAT" ] && [ -n "$ZOOM" ]; then
            node scripts/probe-shot.js https://enderhugin.github.io/chronosterrae/ /tmp/shots "$LNG" "$LAT" "$ZOOM" > /tmp/shot.log 2>&1 || true
          else
            node scripts/probe-shot.js https://enderhugin.github.io/chronosterrae/ /tmp/shots > /tmp/shot.log 2>&1 || true
          fi
      - name: Publicar en la rama probe-shot
        if: always()
        run: |
          set -euo pipefail
          mkdir -p /tmp/shots
          git config user.name "ChronosTerrae-Probe"
          git config user.email "bot@chronosterrae.local"
          git switch --orphan probe-shot
          cp -r /tmp/shots/. . || true
          cp /tmp/shot.log shot.log || true
          git add -A -- . ':!node_modules'
          git commit -m "Sonda captura $(date -u +%Y-%m-%dT%H:%MZ)"
          git push --force origin probe-shot
