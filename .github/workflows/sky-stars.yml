name: Cielo (catálogo de estrellas)

# Construye el catálogo estelar propio (Hipparcos vía VizieR + nombres/figuras de d3-celestial).
# Modos: inspect | convert | publish. El informe va siempre a la rama huérfana `sky-build`;
# solo `publish` escribe data/sky/ en main.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'inspect | convert | publish'
        default: 'inspect'

permissions:
  contents: write

concurrency:
  group: sky-stars
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MODE: ${{ github.event.inputs.mode }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Instalar d3-celestial (solo para nombres y figuras; no se guarda en el repo)
        run: npm install --no-save d3-celestial@0.7.35

      - name: Ejecutar
        run: |
          if [ "$MODE" = inspect ]; then
            node scripts/build-stars.js inspect > /tmp/report.json 2> /tmp/report.log
          else
            node scripts/build-stars.js convert /tmp/sky-out > /tmp/report.json 2> /tmp/report.log
          fi

      - name: Resumen en el log
        if: always()
        run: |
          tail -n 30 /tmp/report.log || true
          head -c 600 /tmp/report.json || true

      - name: Publicar en main (data/sky)
        if: env.MODE == 'publish'
        run: |
          set -euo pipefail
          test -f /tmp/sky-out/manifest.json
          git config user.name "ChronosTerrae-Build"
          git config user.email "bot@chronosterrae.local"
          rm -rf data/sky
          mkdir -p data
          cp -r /tmp/sky-out data/sky
          git add data/sky
          if git diff --staged --quiet; then
            echo "Sin cambios."
          else
            git commit -m "Datos: catalogo estelar (Hipparcos/VizieR; nombres y figuras d3-celestial BSD-3)"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Informe en la rama sky-build
        if: always()
        run: |
          set -euo pipefail
          test -s /tmp/report.json || echo '{"error":"sin salida"}' > /tmp/report.json
          git config user.name "ChronosTerrae-Build"
          git config user.email "bot@chronosterrae.local"
          git switch --orphan sky-build
          cp /tmp/report.json report.json
          cp /tmp/report.log report.log || true
          if [ -d /tmp/sky-out ]; then cp -r /tmp/sky-out sky; fi
          git add report.json report.log
          if [ -d sky ]; then git add sky; fi
          git commit -m "Informe de construccion del cielo $(date -u +%Y-%m-%dT%H:%MZ)"
          git push --force origin sky-build
