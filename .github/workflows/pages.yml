name: Publicar web (Pages)

# Despliegue propio de la web (Settings > Pages > Source = "GitHub Actions").
# Se publica en cada push que toque la web o sus datos, tras cada ejecucion de los workflows del bot
# (sus commits usan GITHUB_TOKEN y no disparan "push") y a mano.
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'latest_harvest.json'
      - 'data/paleocoastlines/**'
      - 'data/sky/**'
      - 'sky/**'
      - 'vendor/**'
      - '.github/workflows/pages.yml'
  workflow_run:
    workflows: ['AI Harvester Swarm', 'Paleocostas (construcción)', 'Cielo (catálogo de estrellas)', 'Cielo (validación contra Horizons)']
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # tras un workflow del bot solo si terminó bien
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Preparar el sitio (solo lo que la web usa)
        run: |
          set -euo pipefail
          mkdir -p _site/data
          cp index.html latest_harvest.json _site/
          cp -r data/paleocoastlines _site/data/paleocoastlines
          cp -r sky vendor _site/
          if [ -d data/sky ]; then cp -r data/sky _site/data/sky; fi
          touch _site/.nojekyll
          du -sh _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
