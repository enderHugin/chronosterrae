name: Publicar web (Pages)

# Despliegue propio de la web (Settings > Pages > Source = "GitHub Actions").
# Se publica en cada push que toque la web o sus datos, tras cada ejecucion de los workflows del bot
# (sus commits usan GITHUB_TOKEN y no disparan "push") y a mano.
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'latest_harvest.json'
      - 'data/paleocoastlines/**'
      - 'data/sky/**'
      - 'data/textures/**'
      - 'data/events/**'
      - 'data/borders/**'
      - 'data/built/**'
      - 'data/images/**'
      - 'data/people/**'
      - 'data/corroboration/**'
      - 'sky/**'
      - 'map/**'
      - 'solar/**'
      - 'vendor/**'
      - '.github/workflows/pages.yml'
  workflow_run:
    workflows: ['AI Harvester Swarm', 'Paleocostas (construcción)', 'Cielo (validación contra Horizons)', 'Sucesos (Wikidata)', 'Construcciones (Wikidata)', 'Imagenes (nombres de archivo P18)', 'Papeles de personas (Wikidata)', 'Contraste automatico (medallas de fiabilidad)']
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # tras un workflow del bot solo si terminó bien
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Preparar el sitio (solo lo que la web usa)
        run: |
          set -euo pipefail
          mkdir -p _site/data
          cp index.html latest_harvest.json _site/
          cp -r data/paleocoastlines _site/data/paleocoastlines
          cp -r sky map vendor solar _site/
          if [ -d data/borders ]; then cp -r data/borders _site/data/borders; fi
          if [ -d data/sky ]; then cp -r data/sky _site/data/sky; fi
          # texturas de planetas y lunas, perfil de los anillos y Via Lactea (las pide solar-view.js y el fondo del globo)
          if [ -d data/textures ]; then cp -r data/textures _site/data/textures; fi
          # capa de sucesos (seed.json, index.json y los fragmentos c<siglo>.json que pide index.html)
          if [ -d data/events ]; then cp -r data/events _site/data/events; fi
          # capa de construcciones (built.json y su manifiesto, desde Wikidata)
          if [ -d data/built ]; then cp -r data/built _site/data/built; fi
          # papel de cada persona para su icono (corona, mitra, pluma...; scripts/build-roles.js)
          if [ -d data/people ]; then cp -r data/people _site/data/people; fi
          # contrastes automaticos (medallas de fiabilidad; corroborate.yml)
          if [ -d data/corroboration ]; then cp -r data/corroboration _site/data/corroboration; fi
          # indice del buscador (personas, sucesos, construcciones y nombre del archivo de su imagen en Commons): se genera aqui, no se guarda
          node scripts/build-search.js _site/data/search
          touch _site/.nojekyll
          du -sh _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
