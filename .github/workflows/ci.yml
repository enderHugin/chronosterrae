name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'data/harvests/**'
      - 'latest_harvest.json'
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar
        uses: actions/checkout@v4

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Regresiones del front y del harvester
        run: npm run check

      - name: Validar registros contra el esquema
        run: npm run validate
