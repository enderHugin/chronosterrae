name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'data/harvests/**'
      - 'latest_harvest.json'
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar
        uses: actions/checkout@v4

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Pruebas completas (npm test)
        # Antes solo se ejecutaban check, check:sky, check:events y validate: las pruebas de datos, textos, vista solar, texturas,
        # renderizador y Via Lactea no corrian en CI. npm test las encadena todas (y valida los registros al final).
        run: npm test

      - name: Python 3 con pillow y numpy (comprobaciones de las imagenes reales)
        run: python3 -m pip install --quiet pillow numpy

      - name: Via Lactea - orientacion de la textura real (Nubes de Magallanes y plano galactico)
        run: python3 scripts/check-milkyway-data.py
