name: Sonda de teselas OpenFreeMap (esquema)

# Mira como llegan en las teselas los espigones y puertos. El resultado va a la rama `probe-ofm`, nunca a `main`.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/probe-ofm-tile.js'
      - '.github/workflows/probe-ofm.yml'

permissions:
  contents: write

concurrency:
  group: probe-ofm
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar decodificador de teselas (sin guardar en el repo)
        run: npm install --no-save --no-package-lock @mapbox/vector-tile@2.0.3 pbf@4.0.1
      - name: Ejecutar sonda
        run: node scripts/probe-ofm-tile.js > /tmp/ofm.json 2> /tmp/ofm.log || true
      - name: Publicar en la rama probe-ofm
        if: always()
        run: |
          set -euo pipefail
          test -s /tmp/ofm.json || echo '{"error":"sin salida"}' > /tmp/ofm.json
          git config user.name "ChronosTerrae-Probe"
          git config user.email "bot@chronosterrae.local"
          git switch --orphan probe-ofm
          cp /tmp/ofm.json ofm.json; cp /tmp/ofm.log ofm.log || true
          git add ofm.json ofm.log
          git commit -m "Sonda OFM $(date -u +%Y-%m-%dT%H:%MZ)"
          git push --force origin probe-ofm
