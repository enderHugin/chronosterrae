        if (pre.state !== 'ready') { note.textContent = t(pre.state === 'missing' ? 'sky.pre.missing' : 'sky.pre.loading'); return; }
        note.textContent = t('sky.pre.banner');
    }
    const frame = starsOnly ? { gast: preFrame(jd).era, bodies: [] } : spaceFrame(jd);
    const cat = starsOnly ? pre.view : sky.catalog;
    const label = (text, x, y, alpha) => { ctx.fillStyle = 'rgba(214,224,248,' + alpha + ')'; ctx.font = '11px system-ui, sans-serif'; ctx.fillText(text, x, y); };

    // Via Lactea (textura derivada de catalogos, NASA SVS 4851) debajo de las estrellas: cada pixel -> direccion del marco del globo -> J2000 (con la precesion de la fecha) -> textura
    if (window.ChronosMilkyWay) {
        ChronosMilkyWay.ensure('./data/textures/milkyway_icrs_4k.jpg', onMilkyWayReady);
        const m = [0, 0, 0]; const v = [0, 0, 0]; let conv; let tag;
        if (starsOnly) { const fr = pre.inst.frame.frame(pre.res.epj); const era = frame.gast; conv = () => ChronosSpace.j2000FromModelCio(m[0], m[1], m[2], era, fr, v); tag = Math.round(era * 5000) + '|' + Math.round(pre.res.epj / 20); }
        else { const rot = frame.rot; const gast = frame.gast; conv = () => ChronosSpace.j2000FromModel(m[0], m[1], m[2], gast, rot, v); tag = Math.round(gast * 5000) + '|' + Math.round(jd / 30); }
        const dir = (px, py, d) => { pr.unproject(px, py, m); conv(); d[0] = v[0]; d[1] = v[1]; d[2] = v[2]; return true; };
        const key = ['globe', c.lng, c.lat, map.getBearing(), map.getPitch(), map.getRoll ? map.getRoll() : 0, tr && tr.worldSize, tr && tr.fov, tag].map((q) => (typeof q === 'number' ? Math.round(q * 2000) : q)).join(',');
        ChronosMilkyWay.paint(ctx, { width: w, height: h, direction: dir, key, step: 4 });
    }

    if (cat) {
        if (starsOnly) { if (space.eqCat !== cat || space.eqJD !== pre.fullJD) { space.eq = { ra: pre.res.ra, dec: pre.res.dec }; space.eqJD = pre.fullJD; space.eqCat = cat; space.dirsJD = NaN; } }
        else if (space.eqCat !== cat || Math.abs(jd - space.eqJD) > 1) { space.eq = ChronosSpace.starsOfDate(cat, frame.time); space.eqJD = jd; space.eqCat = cat; space.dirsJD = NaN; }
        if (!space.dirs || space.dirs.length !== cat.n * 3) space.dirs = new Float64Array(cat.n * 3);
        if (space.dirsJD !== jd) { for (let i = 0; i < cat.n; i++) ChronosSpace.modelDirection(space.eq.ra[i], space.eq.dec[i], frame.gast, space.dirs, 3 * i); space.dirsJD = jd; }
        if (!space.colors || space.colorsCat !== cat) { space.colors = Array.from(cat.bv, (bv) => ChronosSkyView.starColor(bv)); space.colorsCat = cat; }
        const px = new Float32Array(cat.n); const py = new Float32Array(cat.n);
        for (let i = 0; i < cat.n; i++) {
            const s = pr.infinity(space.dirs[3 * i], space.dirs[3 * i + 1], space.dirs[3 * i + 2]);
            if (s) { px[i] = s[0]; py[i] = s[1]; } else px[i] = NaN;
        }
        space.stars = { cat, px, py };
        if (cat.constellations.length) {
            ctx.strokeStyle = 'rgba(150,175,235,0.16)'; ctx.lineWidth = 1; ctx.beginPath();
            cat.constellations.forEach((cn) => cn.lines.forEach(([a, b]) => {
                if (Number.isNaN(px[a]) || Number.isNaN(px[b])) return;
                ctx.moveTo(px[a], py[a]); ctx.lineTo(px[b], py[b]);
            }));
            ctx.stroke();
        }
        for (let i = 0; i < cat.n; i++) {
            const x = px[i]; const y = py[i];
            if (Number.isNaN(x) || x < -4 || y < -4 || x > w + 4 || y > h + 4) continue;
            const mag = cat.mag[i];
            const sty = ChronosSkyView.starStyle(mag); const r = sty.r;
            ctx.globalAlpha = sty.alpha;
            ctx.fillStyle = space.colors[i];
            if (r < 1.1) ctx.fillRect(x - r, y - r, 2 * r, 2 * r);
            else { ctx.beginPath(); ctx.arc(x, y, r, 0, 2 * Math.PI); ctx.fill(); }
        }
        ctx.globalAlpha = 1;
        for (let i = 0; i < cat.n; i++) {
            if (cat.mag[i] >= 1.0) continue;
            const nm = cat.names[cat.hip[i]];
            if (nm && !Number.isNaN(px[i]) && px[i] > 0 && py[i] > 0 && px[i] < w && py[i] < h) label((lang === 'es' && nm[1]) || nm[0], px[i] + 6, py[i] - 5, 0.7);
        }
    }

    if (!frame.bodies.length) return;     // prehistoria: solo estrellas
    // Sol, planetas y Luna. Los que no quedan detras del globo se pueden tocar: llevan hasta el cuerpo (space.hits).
    const earthC = pr.near(0, 0, 0); const earthR = pr.cameraDistancePx / Math.sqrt(Math.pow((pr.cameraDistancePx + pr.globeRadiusPx) / pr.globeRadiusPx, 2) - 1);
    const hit = (id, x, y, r) => { if (x < 0 || y < 0 || x > w || y > h || (earthC && Math.hypot(x - earthC.x, y - earthC.y) < earthR)) return; space.hits.push({ id, x, y, r: Math.max(r, 9) }); };
    const dirOf = (b) => { const v = new Float64Array(3); ChronosSpace.modelDirection(b.ra, b.dec, frame.gast, v, 0); return v; };
    const sunB = frame.bodies[0];
    const sunV = dirOf(sunB); const sunS = pr.infinity(sunV[0], sunV[1], sunV[2]);
    frame.bodies.forEach((b) => {
        if (b.id === 'Sun') return;
        const v = dirOf(b);
        if (b.id === 'Moon') {
            const m = pr.near(v[0] * b.distER, v[1] * b.distER, v[2] * b.distER);
            if (!m) return;
            const r = Math.max(6, Math.min(40, 0.2725 * m.pxPerER));
            const theta = sunS ? Math.atan2(sunS[1] - m.y, sunS[0] - m.x) : 0;
            ChronosSkyView.drawMoon(ctx, m.x, m.y, r, theta, b.phaseFraction);
            label(t('sky.body.Moon'), m.x + r + 4, m.y + 4, 0.85);
            hit('Moon', m.x, m.y, r);
            return;
        }
        const s = pr.infinity(v[0], v[1], v[2]);
        if (!s) return;
        const r = Math.max(2.4, Math.min(5, 4.6 - 0.4 * b.mag));
        ctx.beginPath(); ctx.arc(s[0], s[1], r, 0, 2 * Math.PI); ctx.fillStyle = ChronosSkyView.PLANET_COLOR[b.id]; ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,0.6)'; ctx.lineWidth = 1; ctx.stroke();
        label(t('sky.body.' + b.id), s[0] + r + 4, s[1] + 4, 0.85);
        hit(b.id, s[0], s[1], r);
    });
    if (sunS) {
        const glow = ctx.createRadialGradient(sunS[0], sunS[1], 2, sunS[0], sunS[1], 34);
        glow.addColorStop(0, 'rgba(255,236,150,0.95)'); glow.addColorStop(1, 'rgba(255,236,150,0)');
        ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(sunS[0], sunS[1], 34, 0, 2 * Math.PI); ctx.fill();
        ctx.fillStyle = '#ffd54f'; ctx.beginPath(); ctx.arc(sunS[0], sunS[1], 7, 0, 2 * Math.PI); ctx.fill();
        label(t('sky.body.Sun'), sunS[0] + 12, sunS[1] + 4, 0.85);
        hit('Sun', sunS[0], sunS[1], 14);
    }
}

// Lado nocturno de la Tierra: poligono bajo la linea del terminador.
let nightJD = NaN;
function updateNight(force) {
    if (!map.getSource || !map.getSource('night')) return;
    const show = space.on && clockFull() && window.ChronosSpace;
    map.setLayoutProperty('night-fill', 'visibility', show ? 'visible' : 'none');
    if (!show) return;
    if (!force && Math.abs(clock.jd - nightJD) * 86400 < 20) return;   // 20 s de rotacion terrestre = 0,08 grados
    nightJD = clock.jd;
    const f = spaceFrame(clock.jd); const sun = f.bodies[0];
    const v = new Float64Array(3); ChronosSpace.modelDirection(sun.ra, sun.dec, f.gast, v, 0);
    const lat = Math.asin(v[1]) * 180 / Math.PI; const lng = Math.atan2(v[0], v[2]) * 180 / Math.PI;
    map.getSource('night').setData({ type: 'Feature', properties: {}, geometry: ChronosSpace.nightPolygon(lat, lng) });
}

$('btn-space').addEventListener('click', () => {
    space.on = !space.on;
    $('btn-space').setAttribute('aria-pressed', String(space.on));
    savePrefs({ sp: space.on });
    scheduleSpace(); updateNight(true);
});

/* ------------------------------------------------------------------ */
/* Sucesos: nacimientos, muertes, obras, descubrimientos y hechos       */
/* ------------------------------------------------------------------ */
// Los datos son registros ChronosTerrae (data/events/): seed.json (con hora verificada) y un fichero por siglo (solo fecha).
// Que se dibuja lo decide sky/timed.js segun el instante del reloj y la escala del mapa; de los avisos se ocupa el reloj.
const KIND_COLORS = { birth: '#43a047', death: '#6d4c41', publication: '#1e88e5', composition: '#8e24aa', discovery: '#f9a825', extinction: '#e53935', event: '#fb8c00' };
const events = { counts: { status: {}, evidence: {} }, seed: [], shards: new Map(), index: undefined, loading: new Set(), all: [], timed: [], byId: new Map(), toasts: new Map(), open: false, timer: 0, shown: [] };
const evName = (f) => (f.properties.labels && f.properties.labels[lang]) || f.properties.name;
const evKind = (f) => f.properties.kind || 'event';

// Filtros de verificacion (mascara de bits, recordada en la cookie): el usuario decide que ver.
// Bits 1-8: nivel de revision (raw, community, reviewed, consensus). Bits 16/32/64: documental, reconstruccion o modelo, especulacion.
const VF_STATUS = ['raw', 'community', 'reviewed', 'consensus'];
const VF_EVIDENCE = { documentary: 16, reconstruction: 32, speculation: 64 };
const VF_GROUP = { measurement: 'documentary', documentary: 'documentary', artefact: 'documentary', reconstruction: 'reconstruction', model: 'reconstruction', speculation: 'speculation' };
const VF_DEFAULT = 15 | 16 | 32;     // todo salvo la especulacion, que se activa a proposito
let vfMask = prefs.vf !== undefined ? prefs.vf : VF_DEFAULT;
const vfPasses = (f) => {
    const sb = 1 << Math.max(0, VF_STATUS.indexOf(f.properties.status));
    return (vfMask & sb) !== 0 && (vfMask & VF_EVIDENCE[VF_GROUP[f.properties.evidence] || 'documentary']) !== 0;
};

function eventsRebuild() {
    const bulk = [];
    events.shards.forEach((feats) => bulk.push(...feats));
    // el suceso con hora verificada (semilla) sustituye a su gemelo masivo de solo fecha
    const all = [...events.seed, ...(window.ChronosTimed ? ChronosTimed.dedupeAgainst(events.seed, bulk) : bulk)];
    events.counts = { status: {}, evidence: {} };
    all.forEach((f) => {
        const s = f.properties.status; const g = VF_GROUP[f.properties.evidence] || 'documentary';
        events.counts.status[s] = (events.counts.status[s] || 0) + 1; events.counts.evidence[g] = (events.counts.evidence[g] || 0) + 1;
    });
    events.all = all.filter(vfPasses);
    events.byId = new Map(events.all.map((f) => [f.properties.id, f]));
    events.timed = events.all.filter((f) => window.ChronosTimed && ChronosTimed.isTimed(f));
}

async function eventsFetch(url) {
    const res = await fetch(url);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const parsed = JSON.parse(await res.text());
    if (!parsed || parsed.type !== 'FeatureCollection' && !parsed.shards) throw new Error('forma inesperada');
    return parsed;
}

// Carga lo que falta de los sucesos para los años [y0, y1] (un fichero por siglo: crece con el tiempo, no con la cantidad total).
async function eventsLoadRange(y0, y1) {
    if (!window.ChronosTimed) return false;
    let changed = false;
    if (!events.seed.length && !events.loading.has('seed')) {
        events.loading.add('seed');
        try { events.seed = (await eventsFetch('./data/events/seed.json')).features; changed = true; } catch (e) { console.warn('[EVENTS] seed', e.message); }
    }
    if (events.index === undefined && !events.loading.has('index')) {
        events.loading.add('index');
        try { events.index = (await eventsFetch('./data/events/index.json')).shards; } catch (e) { events.index = null; }
    }
    if (events.index) {
        const keys = ChronosTimed.shardKeys(y0, y1).filter((key) => events.index[key] && !events.shards.has(key) && !events.loading.has(key));
        await Promise.all(keys.map(async (key) => {
            events.loading.add(key);
            try { events.shards.set(key, (await eventsFetch('./data/events/' + events.index[key].file)).features); changed = true; } catch (e) { console.warn('[EVENTS]', key, e.message); }
        }));
    }
    if (changed) eventsRebuild();
    return changed;
}

async function eventsEnsureData() {
    if (!window.ChronosTimed || !clockFull()) return;
    const year = ChronosSky.jdToCalendar(clock.jd, 'auto').year;
    await eventsLoadRange(year - 1, year + 1);
    eventsRefresh();
}

// Anchura de la vista en metros (al paralelo del centro): es la "escala" con la que se decide que mostrar.
function viewMeters() {
    const lat = Math.max(-80, Math.min(80, map.getCenter().lat));
    return 40075016.686 * Math.cos(lat * Math.PI / 180) / (512 * Math.pow(2, map.getZoom())) * map.getContainer().clientWidth;
}

// Limitado, no "esperar a que pare": el reloj cambia cada 100 ms y un temporizador que se reinicia nunca llegaria a dispararse.
function eventsRefresh() {
    if (events.timer) return;
    events.timer = setTimeout(() => { events.timer = 0; eventsDraw(); }, 150);
}

function eventsDraw() {
    if (!window.ChronosTimed || !map.getSource || !map.getSource('events')) return;
    if (!clockFull() || !events.all.length) { map.getSource('events').setData(emptyFC()); events.shown = []; if (events.open) renderEventsPanel(); return; }
    const vm = viewMeters();
    const zoomed = map.getZoom() >= 3;
    const b = zoomed ? map.getBounds() : null;
    const sel = ChronosTimed.selectVisible(events.all, {
        jd: clock.jd, viewMeters: vm, max: 80, cellPx: 40, bounds: b ? [b.getWest(), b.getSouth(), b.getEast(), b.getNorth()] : null,
        project: (lng, lat) => { const p = map.project([lng, lat]); return [p.x, p.y]; }
    });
    events.shown = sel;
    map.getSource('events').setData({
        type: 'FeatureCollection',
        features: sel.map((f) => ({ type: 'Feature', geometry: f.geometry, properties: { id: f.properties.id, name: evName(f), kind: evKind(f), importance: f.properties.importance, status: f.properties.status } }))
    });
    if (events.open) renderEventsPanel();
}

function eventDateText(f) {
    const tm = f.properties.time;
    const cal = tm.calendar === 'julian' ? ' (' + t('clock.julian') + ')' : '';
    if (tm.instant) return tm.instant.clock_text + ' · ' + (tm.iso || '').slice(0, 10) + cal;
    return (tm.iso || '') + cal;
}

function eventRows(f) {
    const p = f.properties; const tm = p.time;
    const rows = [{ label: t('evidence'), badge: p.evidence }];
    rows.push({ label: t('events.kindLabel'), value: t('events.kind.' + evKind(f)) });
    rows.push({ label: t('events.when'), value: eventDateText(f) });
    if (tm.instant) {
        const basis = tm.instant.basis === 'utc' ? t('events.basisUtc') : fmt('events.basisLocal', { off: (tm.instant.utc_offset_minutes >= 0 ? '+' : '−') + Math.abs(tm.instant.utc_offset_minutes / 60) });
        rows.push({ label: t('events.timeBasis'), value: basis + ' · ±' + nf().format(tm.instant.uncertainty_s) + ' s' });
    } else if (['day', 'month', 'year'].includes(tm.precision)) rows.push({ label: t('events.timeOfDay'), value: t('events.noTime') });
    if (p.description && (p.description[lang] || p.description.en)) rows.push({ label: t('events.note'), value: p.description[lang] || p.description.en });
    rows.push({ label: t('events.status'), value: t('events.verif.st.' + p.status) });
    p.sources.forEach((s) => {
        const href = s.kind === 'wikidata' ? 'https://www.wikidata.org/wiki/' + s.id : s.kind === 'url' ? s.id : null;
        const row = { label: t('source'), value: s.kind === 'wikidata' ? 'Wikidata ' + s.id : s.id };
        if (href) row.href = href;
        rows.push(row);
        if (s.citation) rows.push({ label: t('events.citation'), value: s.citation });
    });
    return rows;
}
function showEvent(f) { showInfo(evName(f), eventRows(f)); }

function eventFocus(f) {
    if (f.geometry) map.flyTo({ center: f.geometry.coordinates, zoom: Math.max(map.getZoom(), 4.5), duration: 1400 });
    showEvent(f);
}

/* ---- panel de lista ---- */
function renderVerifFilters() {
    const box = $('events-verif-box');
    if (box.dataset.lang === lang && box.dataset.n === JSON.stringify(events.counts)) return;
    box.dataset.lang = lang; box.dataset.n = JSON.stringify(events.counts); box.textContent = '';
    const add = (label, bit, n) => {
        const input = el('input', { type: 'checkbox' }); input.checked = (vfMask & bit) !== 0;
        input.addEventListener('change', () => {
            vfMask = input.checked ? (vfMask | bit) : (vfMask & ~bit);
            savePrefs({ vf: vfMask }); eventsRebuild(); eventsRefresh(); renderEventsPanel();
        });
        box.appendChild(el('label', {}, [input, el('span', {}, [label + ' ', el('span', { class: 'vf-n', text: n === undefined ? '' : '(' + nf().format(n) + ')' })])]));
    };
    box.appendChild(el('div', { class: 'vf-sep', text: t('events.verif.status') }));
    VF_STATUS.forEach((s, i) => add(t('events.verif.st.' + s), 1 << i, (events.counts && events.counts.status[s]) || 0));
    box.appendChild(el('div', { class: 'vf-sep', text: t('events.verif.evidence') }));
    Object.entries(VF_EVIDENCE).forEach(([g, bit]) => add(t('events.verif.ev.' + g), bit, (events.counts && events.counts.evidence[g]) || 0));
    box.appendChild(el('div', { class: 'vf-sep', text: t('events.verif.help') }));
}

function renderEventsPanel() {
    renderVerifFilters();
    const list = $('events-list'); list.textContent = '';
    if (!clockFull()) { $('events-note').textContent = t('events.outOfRange'); return; }
    const status = events.index === null && !events.seed.length ? t('events.none') : '';
    const floor = ChronosTimed.importanceFloor(viewMeters());
    const half = 183;
    const items = events.all.filter((f) => {
        if (f.properties.importance < floor) return false;
        const sp = ChronosTimed.span(f);
        return sp.b >= clock.jd - half && sp.a <= clock.jd + half;
    }).map((f) => ({ f, d: Math.abs(ChronosTimed.span(f).a - clock.jd) })).sort((a, b) => a.d - b.d || b.f.properties.importance - a.f.properties.importance).slice(0, 40);
    items.forEach(({ f }) => {
        const li = el('li', { tabindex: '0', role: 'button' }, [
            el('span', { class: 'ev-dot', style: 'background:' + (KIND_COLORS[evKind(f)] || '#888') }),
            el('span', { class: 'ev-name', text: evName(f) }),
            el('span', { class: 'ev-when', text: eventDateText(f) + (f.geometry ? '' : ' · ' + t('events.noPlace')) })
        ]);
        const go = () => eventFocus(f);
        li.addEventListener('click', go);
        li.addEventListener('keydown', (e) => { if (e.key === 'Enter') go(); });
        list.appendChild(li);
    });
    $('events-note').textContent = status || (items.length ? fmt('events.shown', { n: items.length }) : t('events.empty'));
}

function setEventsOpen(open) {
    events.open = open;
    $('events').classList.toggle('open', open);
    $('btn-events').setAttribute('aria-pressed', String(open));
    if (open) { if (CHG.open) setChangesOpen(false); eventsEnsureData(); renderEventsPanel(); }
}
$('btn-events').addEventListener('click', () => setEventsOpen(!events.open));
$('events-close').addEventListener('click', () => setEventsOpen(false));

/* ------------------------------------------------------------------ */
/* Cambios del elemento centrado                                      */
/* ------------------------------------------------------------------ */
// Contrato de un proveedor de cambios (cada capa que cambia con el tiempo implementa uno; el panel no sabe de capas):
//   applies(focus)        -> bool: ¿esta capa tiene algo que decir del elemento centrado?
//   describe(ctx)         -> Promise<{ title, nodes:[DOM], interval:{from,to}|null, terms:{added,removed,changed} }>
//                            interval = años entre los que se produce el cambio (las fotografías, no un dia); terms = territorios
//                            o entidades que cambiaron (nombre + geometrias) para relacionar sucesos. La relacion es siempre declarada:
//                            documentada, de lugar, de nombre o solo de fecha (ver map/changes.js). Nunca se afirma una causa sin fuente.
// Los sucesos se piden por intervalo y por siglo (data/events/c<N>.json): el coste crece con el intervalo, no con el total de datos.
const CHANGE_PROVIDERS = [];
const CHG_MAX_YEARS = 1200;    // intervalo maximo cuyos sucesos se cargan (12 ficheros de siglo)
const nfYear = () => new Intl.NumberFormat(lang === 'es' ? 'es-ES' : 'en-GB', { maximumFractionDigits: 1, useGrouping: false });   // un año no lleva separador de millares
const chgYear = (y) => (y === null || y === undefined ? '' : y >= 1 ? nfYear().format(Math.round(y * 10) / 10) + ' ' + t('ce') : nfYear().format(Math.round((1 - y) * 10) / 10) + ' ' + t('bce'));
const chgFocus = () => (solarView && solarView.isOpen && solarView.state.focus) || 'Earth';
const chgBodyName = (id) => (id === 'Earth' ? t('changes.earth') : (t('solar.body.' + id) || id));
const chgP = (text, cls) => el('p', cls ? { class: cls, text } : { text });

function chgSnapshotData(year) {
    const entry = state.polities && state.polities.find((p) => p.year === year);
    if (!entry) return Promise.reject(new Error('sin instantanea ' + year));
    return getJSON(snapshotUrl({ p: entry }));
}

function chgNames(title, list, kind) {
    const d = el('details', { class: 'chg-grp' }, [el('summary', { text: title })]);
    const ul = el('ul', { class: 'chg-names' });
    list.slice(0, 40).forEach((x) => {
        const area = kind === 'changed' ? fmt('changes.km2', { a: nf().format(Math.round(x.areaA)), b: nf().format(Math.round(x.areaB)) }) : fmt('changes.km2one', { a: nf().format(Math.round(x.areaKm2)) });
        ul.appendChild(el('li', { text: x.name + ' · ' + area }));
    });
    if (list.length > 40) ul.appendChild(el('li', { text: fmt('changes.more', { n: list.length - 40 }) }));
    d.appendChild(ul); return d;
}

CHANGE_PROVIDERS.push({
    id: 'borders',
    applies: (focus) => focus === 'Earth',
    async describe() {
        const nodes = []; const b = state.borders;
        const none = { title: t('changes.bordersTitle'), nodes, interval: null, terms: { added: [], removed: [], changed: [] } };
        if (!b) { nodes.push(chgP(t('changes.noBorders'))); return none; }
        const years = state.polities ? state.polities.map((p) => p.year) : null;
        if (b.source === 'ne') {
            nodes.push(chgP(t('changes.ne')));
            const hb = CHG.prev && CHG.prev.source !== 'ne' ? CHG.prev.year : (years ? Math.max(...years.filter((y) => y < CFG.neFromYear)) : null);
            if (hb !== null) none.interval = { from: hb, to: CFG.neFromYear };
            return none;
        }
        if (!years) { nodes.push(chgP(t('changes.loading'))); return none; }
        const Y = b.year; const W = window.ChronosChanges.displayWindow(years, Y);
        nodes.push(chgP(fmt('changes.window', { y: chgYear(Y), from: W.from === null ? t('changes.open0') : chgYear(W.from), to: W.to === null ? t('changes.open1') : chgYear(W.to) })));
        const tracked = CHG.prev && CHG.prev.source !== 'ne' && CHG.prev.year !== Y && years.includes(CHG.prev.year) ? CHG.prev.year : null;
        const A = tracked !== null ? Math.min(tracked, Y) : W.prev; const B = tracked !== null ? Math.max(tracked, Y) : Y;
        if (A === null) { nodes.push(chgP(t('changes.first'))); return none; }
        const vars = { a: chgYear(A), b: chgYear(B), n: nfYear().format(Math.round((B - A) * 10) / 10) };
        nodes.push(el('div', { class: 'chg-warn', text: fmt(tracked !== null ? 'changes.stepTracked' : 'changes.step', vars) }));
        none.interval = { from: A, to: B };
        let fcA; let fcB;
        try { [fcA, fcB] = await Promise.all([chgSnapshotData(A), chgSnapshotData(B)]); } catch (e) { nodes.push(chgP(fmt('changes.loadFail', { y: chgYear(A) + '–' + chgYear(B), e: e.message }), 'chg-note')); return none; }
        const key = A + '|' + B;
        const diff = CHG.diffs.get(key) || (CHG.diffs.set(key, ChronosChanges.diffPolities(fcA, fcB)), CHG.diffs.get(key));
        none.terms = diff;
        nodes.push(el('h3', { text: fmt('changes.diffTitle', vars) }));
        if (!diff.added.length && !diff.removed.length && !diff.changed.length) nodes.push(chgP(t('changes.noneChanged')));
        if (diff.added.length) nodes.push(chgNames(fmt('changes.added', { n: diff.added.length }), diff.added, 'added'));
        if (diff.removed.length) nodes.push(chgNames(fmt('changes.removed', { n: diff.removed.length }), diff.removed, 'removed'));
        if (diff.changed.length) nodes.push(chgNames(fmt('changes.sizeChanged', { n: diff.changed.length }), diff.changed, 'changed'));
        nodes.push(chgP(fmt('changes.same', { n: diff.same }), 'chg-note'));
        nodes.push(chgP(t('changes.diffNote'), 'chg-note'));
        return none;
    }
});

CHANGE_PROVIDERS.push({
    id: 'relief',
    applies: (focus) => focus === 'Earth',
    async describe() {
        const nodes = [];
        const cut = formatYear(ybpToYear(NATURAL_MAX_YBP));
        nodes.push(chgP(fmt('changes.naturalUntil', { y: cut })));
        nodes.push(chgP(t(NAT.on ? 'changes.naturalShown' : 'changes.naturalHidden'), 'chg-note'));
        if (state.ybp >= CFG.deepTimeFrom) { nodes.push(chgP(fmt('changes.plates', { ma: effectiveMa(state.ybp) }))); nodes.push(chgP(t('changes.noGeo'), 'chg-note')); }
        return { title: t('changes.layersTitle'), nodes, interval: null, terms: { added: [], removed: [], changed: [] } };
    }
});

function chgEventItem(it, listed) {
    const f = it.f; const p = f.properties;
    const sum = el('summary', {}, [el('span', { class: 'ev-dot', style: 'background:' + (KIND_COLORS[evKind(f)] || '#888') + ';display:inline-block;margin-right:6px' }), el('b', { text: evName(f) }), el('span', { class: 'chg-when', text: eventDateText(f) })]);
    const body = el('div', { class: 'chg-ev-body' });
    const rows = [{ label: t('changes.relation'), value: t('changes.tierNote.' + it.tier) }];
    if (it.polities.length) rows.push({ label: t('changes.polities'), value: it.polities.join(', ') });
    const srcClasses = Array.isArray(p.classes) ? p.classes.map((c) => c.label || c.id).join(', ') : '';
    if (it.kindSource === 'wikidata') rows.push({ label: t('changes.sourcedKind'), value: (it.kind === 'other' ? '' : t('changes.kinds.' + it.kind) + ' — ') + srcClasses });
    else rows.push({ label: t('changes.deducedKind'), value: t('changes.kinds.' + it.kind) });
    const u = p.time.uncertainty_yr;
    rows.push({ label: t('changes.precision'), value: p.time.precision + ' · ' + (u < 1 ? fmt('changes.uncDays', { u: nf().format(Math.round(u * 365.25 * 10) / 10) }) : fmt('changes.unc', { u: nf().format(u) })) });
    rows.push(...eventRows(f));
    (Array.isArray(p.links) ? p.links : []).forEach((l) => {
        const lab = (l.target.label ? l.target.label + ' ' : '') + (l.target.kind === 'wikidata' ? l.target.id : l.target.id);
        const row = { label: t('changes.rel.' + l.rel), value: lab + (listed && l.target.kind === 'wikidata' && listed.has(l.target.id) ? ' ' + t('changes.alsoListed') : '') };
        if (l.target.kind === 'wikidata') row.href = 'https://www.wikidata.org/wiki/' + l.target.id;
        rows.push(row, { label: t('source'), value: (l.source.citation || l.source.id) });
    });
    fillRows(body, rows);
    const go = el('button', { class: 'btn chg-go', type: 'button', text: t('changes.open') });
    go.addEventListener('click', () => eventFocus(f));
    body.appendChild(go);
    return el('details', { class: 'chg-ev' }, [sum, body]);
}

async function chgEvents(iv, terms, token, { title, note, minImportance } = {}) {
    const frag = document.createDocumentFragment();
    const vars = { a: chgYear(iv.from), b: chgYear(iv.to) };
    frag.appendChild(el('h3', { text: title || fmt('changes.eventsTitle', vars) }));
    if (note) frag.appendChild(chgP(note, 'chg-note'));
    if (iv.to < 1) { frag.appendChild(chgP(t('changes.noEventsRange'))); return frag; }
    let y0 = Math.max(1, iv.from);
    if (iv.to - y0 > CHG_MAX_YEARS) { y0 = iv.to - CHG_MAX_YEARS; frag.appendChild(chgP(fmt('changes.capped', { n: CHG_MAX_YEARS }), 'chg-note')); }
    await eventsLoadRange(y0, iv.to);
    if (token !== CHG.token) return null;
    const R = ChronosChanges.relatedEvents(events.all, terms, iv.from, iv.to, minImportance === undefined ? {} : { minImportance });
    if (R.inInterval && R.withGeometry === 0) frag.appendChild(el('div', { class: 'chg-warn', text: fmt('changes.noPlace', { n: R.inInterval }) }));
    else if (R.inInterval) frag.appendChild(chgP(fmt('changes.somePlace', { k: R.withGeometry, n: R.inInterval }), 'chg-note'));
    if (!events.all.some((f) => Array.isArray(f.properties.links) && f.properties.links.length)) frag.appendChild(el('div', { class: 'chg-warn', text: t('changes.noLinks') }));
    const listed = new Set(R.items.map((it) => (/^wd\.(q\d+)\./.exec(it.f.properties.id) || [])[1]).filter(Boolean).map((q) => q.toUpperCase()));
    ChronosChanges.TIERS.forEach((tier) => {
        const group = R.items.filter((it) => it.tier === tier);
        if (!group.length) return;
        const d = el('details', { class: 'chg-grp', open: tier === 'documented' || tier === 'place' ? 'open' : undefined });
        if (!(tier === 'documented' || tier === 'place')) d.removeAttribute('open');
        d.appendChild(el('summary', {}, [el('b', { text: t('changes.tier.' + tier) + ' (' + R.total[tier] + ')' })]));
        d.appendChild(chgP(t('changes.tierNote.' + tier), 'chg-note'));
        group.forEach((it) => d.appendChild(chgEventItem(it, listed)));
        if (R.total[tier] > group.length) d.appendChild(chgP(fmt('changes.more', { n: R.total[tier] - group.length }), 'chg-note'));
        frag.appendChild(d);
    });
    frag.appendChild(chgP(t('changes.filters'), 'chg-note'));
    return frag;
}

async function chgRender() {
    if (!CHG.open) return;
    const token = ++CHG.token; const root = $('changes-body');
    const focus = chgFocus();
    const head = el('div', {}, [el('p', {}, [el('b', { text: t('changes.centred') + ': ' }), document.createTextNode(chgBodyName(focus))]),
        el('p', {}, [el('b', { text: t('changes.shownDate') + ': ' }), document.createTextNode(chgYear(ybpToYear(state.ybp)))])]);
    root.textContent = ''; root.appendChild(head);
    const providers = CHANGE_PROVIDERS.filter((pr) => pr.applies(focus));
    if (!providers.length) { root.appendChild(chgP(fmt('changes.noData', { body: chgBodyName(focus) }))); return; }
    const slots = providers.map((pr) => { const slot = el('div', {}, [chgP(t('changes.loading'), 'chg-note')]); root.appendChild(slot); return slot; });
    const terms = { added: [], removed: [], changed: [] }; let interval = null;
    for (let i = 0; i < providers.length; i++) {
        let res;
        try { res = await providers[i].describe({ focus }); } catch (e) { res = { title: providers[i].id, nodes: [chgP(e.message, 'chg-note')], interval: null, terms }; }
        if (token !== CHG.token) return;
        slots[i].textContent = ''; slots[i].appendChild(el('h3', { text: res.title })); res.nodes.forEach((n) => slots[i].appendChild(n));
        if (res.interval && !interval) { interval = res.interval; Object.assign(terms, res.terms); }
    }
    if (interval) {
        const slot = el('div', {}, [chgP(t('changes.loading'), 'chg-note')]); root.appendChild(slot);
        const frag = await chgEvents(interval, terms, token);
        if (frag && token === CHG.token) { slot.textContent = ''; slot.appendChild(frag); }
    }
    if (CHG.dates.length === 2 && CHG.dates[0] !== CHG.dates[1] && focus === 'Earth') {
        const a = Math.min(...CHG.dates); const b = Math.max(...CHG.dates); const span = chgJdYear(b) - chgJdYear(a);
        const slot = el('div', {}, [chgP(t('changes.loading'), 'chg-note')]); root.appendChild(slot);
        const frag = await chgEvents({ from: chgJdYear(a), to: chgJdYear(b) }, { added: [], removed: [], changed: [] }, token,
            { title: fmt('changes.datesTitle', { a: chgDateText(a), b: chgDateText(b) }), note: t('changes.datesNote'), minImportance: span <= 2 ? 0 : 0.5 });
        if (frag && token === CHG.token) { slot.textContent = ''; slot.appendChild(frag); }
    }
}

const chgDateText = (jd) => { const c = ChronosSky.jdToCalendar(jd, 'auto'); const m = new Date(2001, c.month - 1, 1).toLocaleString(lang === 'es' ? 'es-ES' : 'en-GB', { month: 'short' }); return c.day + ' ' + m + ' ' + formatYear(c.year) + (c.calendar === 'julian' ? ' (' + t('clock.julian') + ')' : ''); };
const chgJdYear = (jd) => CFG.present + (jd - 2433282.5) / 365.25;   // misma convencion que ChronosTimed.span (JD de 1950-01-01 = 2433282.5, año de 365,25 d)
// Las dos ultimas fechas en las que el reloj se quedo quieto (>= 0,5 s): lo que el usuario compara cuando salta de una a otra.
function chgTrackDate() {
    if (!clockUsable()) return;
    const jd = clock.jd;
    if (!CHG.cand || Math.abs(jd - CHG.cand.jd) > 1e-9) { CHG.cand = { jd, at: performance.now() }; return; }
    if (performance.now() - CHG.cand.at < 500) return;
    const last = CHG.dates[CHG.dates.length - 1];
    if (last === undefined || Math.abs(last - jd) > 1e-9) { CHG.dates.push(jd); if (CHG.dates.length > 2) CHG.dates.shift(); }
}
function chgKey() { return [chgFocus(), state.borders ? state.borders.year + ':' + (state.borders.source || 'hb') : '-', CHG.prev ? CHG.prev.year : '-', lang, state.ybp >= CFG.deepTimeFrom ? effectiveMa(state.ybp) : '-', NAT.on, CHG.dates.join(',')].join('|'); }
function chgRefresh() { if (!CHG.open) return; const k = chgKey(); if (k === CHG.key) return; CHG.key = k; chgRender(); }

function setChangesOpen(open) {
    CHG.open = open;
    $('changes').classList.toggle('open', open);
    $('btn-changes').setAttribute('aria-pressed', String(open));
    if (open) { if (events.open) setEventsOpen(false); CHG.key = chgKey(); chgRender(); }
}
$('btn-changes').addEventListener('click', () => setChangesOpen(!CHG.open));
$('changes-close').addEventListener('click', () => setChangesOpen(false));
setInterval(() => { chgTrackDate(); chgRefresh(); }, 350);   // barato: solo compara una clave; la pagina no avisa de cuando cambia el elemento centrado ni la instantanea

/* ---- avisos ---- */
function eventPhrase(f, form) {
    const k = evKind(f);
    return fmt('events.say.' + k + '.' + form, { n: evName(f) });
}

function toastText(rec) {
    const left = (rec.eventJD - clock.jd) * 86400;
    if (rec.phase === 'day') return fmt('events.today', { text: eventPhrase(rec.f, 'now') });
    if (left > 0.5) return fmt('events.in', { t: ChronosTimed.formatCountdown(left, lang), text: eventPhrase(rec.f, 'future') });
    if (left > -60) return fmt('events.now', { text: eventPhrase(rec.f, 'now') });
    return fmt('events.ago', { t: ChronosTimed.formatCountdown(-left, lang), text: eventPhrase(rec.f, 'past') });
}

function toastRemove(id) {
    const rec = events.toasts.get(id);
    if (rec) { rec.node.remove(); events.toasts.delete(id); }
}

function toastShow(f, phase, eventJD) {
    const id = f.properties.id;
    let rec = events.toasts.get(id);
    if (!rec) {
        while (events.toasts.size >= 4) toastRemove(events.toasts.keys().next().value);
        const node = el('div', { class: 'toast', role: 'status' }, [el('span', { class: 'toast-dot', style: 'background:' + (KIND_COLORS[evKind(f)] || '#888') }), el('span', { class: 'toast-text' }), el('button', { class: 'toast-x', type: 'button', 'aria-label': 'Close', text: '×' })]);
        rec = { f, node, phase, eventJD, born: performance.now() };
        node.querySelector('.toast-x').addEventListener('click', (e) => { e.stopPropagation(); toastRemove(id); });
        node.addEventListener('click', () => eventFocus(f));
        $('toasts').appendChild(node);
        events.toasts.set(id, rec);
    }
    rec.phase = phase; rec.eventJD = eventJD; rec.born = performance.now();
    rec.node.querySelector('.toast-text').textContent = toastText(rec);
}

// Se llama en cada cambio del reloj: refresca cuentas atras y retira los avisos viejos.
function toastsTick() {
    events.toasts.forEach((rec, id) => {
        const left = (rec.eventJD - clock.jd) * 86400;
        const stale = rec.phase === 'day' ? performance.now() - rec.born > 20000 : (left < -300 || left > 3600 || (rec.phase === 'jump' && left > 700));
        if (stale || !clockFull()) { toastRemove(id); return; }
        rec.node.querySelector('.toast-text').textContent = toastText(rec);
    });
}

// prev -> jd: avisos del recorrido continuo; al aterrizar tras un salto, cuenta atras si hay un suceso con hora cerca y,
// como mucho, tres sucesos del dia en que se cae (los mas notorios).
function eventsNotify(prev, jd) {
    if (!window.ChronosTimed || !Number.isFinite(prev) || !events.all.length || !(jd > prev)) return;
    const stepS = (jd - prev) * 86400;
    const continuous = stepS <= 7200;
    const pool = continuous && stepS < 3600 * 80 ? [...events.timed, ...events.all.filter((f) => { const a = ChronosTimed.span(f).a; return !ChronosTimed.isTimed(f) && f.properties.time.precision === 'day' && a > prev - 1 && a <= jd; })] : events.timed;
    ChronosTimed.notices(pool, prev, jd, { minImportance: clock.rate >= 86400 ? 0.85 : 0.5 }).forEach((n) => {
        if (n.phase === 'lead' && n.leadS === 10 && stepS > 30) return;
        toastShow(n.feature, n.phase === 'jump' ? 'jump' : n.phase, n.eventJD);
    });
    if (!continuous) {
        events.all.filter((f) => { const sp = ChronosTimed.span(f); return !sp.timed && f.properties.time.precision === 'day' && sp.a <= jd && jd < sp.b && f.properties.importance >= 0.75; })
            .sort((a, b) => b.properties.importance - a.properties.importance).slice(0, 3).forEach((f) => toastShow(f, 'day', ChronosTimed.span(f).a));
    }
}

/* Datos recientes del harvester (se muestran solo cerca del presente) */
async function loadLive() {
    try {
        const res = await fetch('./latest_harvest.json', { cache: 'no-store' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const parsed = JSON.parse(await res.text());
        if (!parsed || !Array.isArray(parsed.features)) throw new Error('no features');
        state.live = parsed;
        await mapReady;
        map.getSource('live').setData(parsed);
        map.setLayoutProperty('live-points', 'visibility', liveVisible(state.ybp) ? 'visible' : 'none');
    } catch (err) {
        state.live = null;
        console.warn('[LIVE]', err.message);
    }
}

/* Inicio */
initClock();
$('btn-space').setAttribute('aria-pressed', String(space.on));
$('btn-space').title = t('space.tip');
applyStrings();
applyTheme();
scheduleSpace();
setTime(state.ybp, { immediate: true, persist: false });
loadLive();
</script>
</body>
