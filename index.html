<!-- index.html -->
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChronosTerrae | Evolutionary Cartography</title>
    <meta name="description" content="Deep-time cartography: travel the Earth from 1,000 million years ago to today.">

    <script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css" rel="stylesheet" />

    <style>
        :root {
            --bg: #f3efe4;
            --panel: rgba(250, 246, 235, 0.92);
            --text: #2b2118;
            --muted: #6b5d4d;
            --accent: #8b5a2b;
            --ok: #2e7d32;
            --warn: #b7791f;
            --err: #c62828;
            --font: 'Georgia', serif;
            --font-ui: system-ui, -apple-system, 'Segoe UI', sans-serif;
            /* Plantilla de epoca (map/eras.js): estas variables las rellena el JS segun la fecha. Los valores de aqui son el aspecto neutro. */
            --h-weight: 700; --h-transform: none; --h-spacing: 0; --h-style: normal;
            --bw: 1px; --bstyle: solid; --radius: 8px; --btn-radius: 6px;
            --orn-tl: none; --orn-br: none; --orn-divider: none; --orn-texture: none; --orn-divider-h: 0px;
            --cursor-grab: grab; --cursor-point: pointer; --cursor-drag: grabbing;
        }
        body.dark {
            --bg: #101418;
            --panel: rgba(20, 24, 29, 0.92);
            --text: #e6e2d8;
            --muted: #9a9486;
            --accent: #d9a566;
        }

        html, body { width: 100%; height: 100%; margin: 0; }
        body {
            background: var(--bg); color: var(--text); font-family: var(--font-ui);
            overflow: hidden; transition: background 0.4s ease, color 0.4s ease;
        }

        /* El contenedor necesita alto explícito o colapsa a 0x0 y el mapa no se ve */
        #map { position: absolute; inset: 0; width: 100%; height: 100%; }

        .panel {
            background-color: var(--panel); color: var(--text);
            background-image: var(--orn-tl), var(--orn-br), var(--orn-texture);
            background-repeat: no-repeat, no-repeat, repeat; background-position: top 3px left 3px, bottom 3px right 3px, 0 0; background-size: 12px 12px, 12px 12px, 48px 48px;
            border: 1px solid var(--accent); border-radius: var(--radius);
            /* El borde ornamental de la epoca (doble, resaltado, grueso...) se pinta como contorno hacia dentro: no ocupa sitio, asi el tamano de los recuadros no depende de la epoca */
            outline: var(--bw) var(--bstyle) var(--accent); outline-offset: calc(var(--bw) * -1);
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.25);
            backdrop-filter: blur(8px);
        }

        /* Maquetacion: barra superior + dos columnas de recuadros (#dock-l, #dock-r) + linea de tiempo. Los recuadros viven en flujo
           (flex), nunca en coordenadas absolutas sueltas: asi no se solapan. --top-h y --bot-h los mide el JS (layoutMeasure). */
        #topbar { position: absolute; top: 14px; left: 14px; right: 14px; z-index: 20; display: flex; gap: 8px; align-items: flex-start; flex-wrap: wrap; pointer-events: none; }
        #topbar > * { pointer-events: auto; }
        #top-left { flex: 1 1 200px; min-width: 0; max-width: 390px; display: flex; gap: 6px; position: relative; }
        #search-sort { flex: none; pointer-events: auto; padding: 0 6px; border: 1px solid var(--accent); border-radius: 6px; background: var(--panel); color: var(--text); font: 600 12px var(--font-ui); max-width: 112px; }
        /* Lista del buscador: aparece al escribir; recorrerla lleva el mapa a cada resultado (giro breve y fundido a la fecha) */
        #search-list { position: absolute; top: calc(100% + 4px); left: 0; width: max(100%, 380px); max-width: calc(100vw - 28px); max-height: min(62vh, 480px); overflow: auto;
            margin: 0; padding: 4px; list-style: none; pointer-events: auto; background: var(--panel); color: var(--text); border: 1px solid var(--accent); border-radius: 8px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35); z-index: 30; font: 13px/1.3 var(--font-ui); }
        #search-list li { display: grid; grid-template-columns: 44px 1fr; gap: 9px; align-items: center; padding: 5px 7px; border-radius: 6px; cursor: pointer; min-height: 44px; }
        #search-list li[aria-selected="true"] { background: color-mix(in srgb, var(--accent) 22%, transparent); }
        /* Cada resultado con el diseño ENTERO de SU epoca (el creador, 2026-11-13: "deben estar siempre cada uno con el color, tipografia, etc.
           que les corresponda", no los de la epoca que marque la barra de tiempo). Sus variables (--bg, --text, --accent, --font...) se ponen en
           la propia fila (srchRender); sin epoca conocida, hereda las de la lista. */
        #search-list li[role=option] { background: var(--bg); color: var(--text); font-family: var(--font-ui); border-left: 4px solid var(--accent); border-radius: var(--btn-radius, 6px); margin: 3px 2px; }
        #search-list li[role=option]:hover { background: color-mix(in srgb, var(--accent) 14%, var(--bg)); }
        #search-list li[role=option][aria-selected="true"] { background: color-mix(in srgb, var(--accent) 24%, var(--bg)); box-shadow: 0 0 0 2px var(--accent); }
        #search-list li[role=option] .sr-name { font-family: var(--font); font-weight: var(--h-weight, 700); font-style: var(--h-style, normal); letter-spacing: var(--h-spacing, 0); text-transform: var(--h-transform, none); }
        #search-list .sr-row { display: flex; align-items: baseline; gap: 6px; min-width: 0; }
        #search-list li > div { min-width: 0; }      /* que el nombre se recorte (…) y la etiqueta de la epoca no se salga */
        #search-list .sr-row .sr-name { flex: 1 1 auto; min-width: 0; }
        #search-list .sr-era { flex: none; font: 600 10.5px/1.5 var(--font-ui); padding: 0 6px; border-radius: 9px; background: var(--accent); color: var(--bg); white-space: nowrap; max-width: 46%; overflow: hidden; text-overflow: ellipsis; text-transform: none; letter-spacing: 0; }
        #search-list .sr-alt { font-weight: 400; opacity: 0.8; }
        #search-list .sr-head { display: block; min-height: 0; padding: 6px 8px 2px; font: 600 11px var(--font-ui); text-transform: uppercase; letter-spacing: 0.04em; opacity: 0.75; cursor: default; border-top: 1px solid color-mix(in srgb, var(--text) 15%, transparent); margin-top: 4px; }
        #search-list li:not([role=option]):hover { background: none; }
        #search-list .sr-pic { width: 44px; height: 44px; border-radius: 6px; object-fit: cover; background: color-mix(in srgb, var(--text) 8%, transparent); display: block; }
        #search-list .sr-ico { width: 30px; height: 30px; margin: 7px; display: block; object-fit: contain; }
        #search-list .sr-name { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        #search-list .sr-name mark { background: none; color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }
        #search-list .sr-sub { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        #search-list .sr-msg { display: block; min-height: 0; padding: 8px 10px; color: var(--muted); cursor: default; }
        /* Fundido entre epocas: una FOTO de la escena tal como estaba (cielo + Tierra) tapa el cambio de fecha y se desvanece sobre la escena
           nueva. Es un fundido cruzado: nada se oscurece (el creador, 2026-11-12: "no me referia a opacar todo el mapa"; antes habia un velo
           oscuro). Los recuadros no van en la foto: cambian de color con su propia transicion (abajo). */
        #era-snap { position: absolute; inset: 0; width: 100%; height: 100%; display: block; z-index: 9; pointer-events: none; opacity: 0; visibility: hidden; }
        #era-snap.fading { transition: opacity 520ms cubic-bezier(0.33, 0, 0.2, 1); }
        /* Los colores de la epoca (recuadros, botones, textos) pasan de una a otra en vez de saltar */
        .panel, .btn, #search, #search-list, .menu-pop, #era-badge, #timeline, #slider, .custom-pop {
            transition: background-color 450ms ease, color 450ms ease, border-color 450ms ease, outline-color 450ms ease, box-shadow 450ms ease; }
        /* Fundido cruzado del aspecto de la epoca: solo los recuadros llevan nombre, y solo durante el cambio (body.vt) */
        :root { view-transition-name: none; }
        ::view-transition { pointer-events: none; }
        body.vt #timeline { view-transition-name: vt-timeline; }
        body.vt #top-right { view-transition-name: vt-top-right; }
        body.vt #search { view-transition-name: vt-search; }
        body.vt #search-list { view-transition-name: vt-search-list; }
        body.vt #dock-l { view-transition-name: vt-dock-l; }
        body.vt #dock-r { view-transition-name: vt-dock-r; }
        ::view-transition-group(*) { animation-duration: 600ms; animation-timing-function: ease-in-out; }
        ::view-transition-old(*), ::view-transition-new(*) { animation-duration: 600ms; animation-timing-function: ease-in-out; }
        @media (prefers-reduced-motion: reduce) { #era-snap { display: none; }
            .panel, .btn, #search, #search-list, .menu-pop, #era-badge, #timeline, #slider, .custom-pop { transition: none; } }
        #info figure.info-pic { margin: 2px 0 8px; }
        #info figure.info-pic img { display: block; max-width: 100%; max-height: 220px; border-radius: 6px; margin: 0 auto; background: color-mix(in srgb, var(--text) 8%, transparent); }
        #info figure.info-pic figcaption { font-size: 11px; color: var(--muted); margin-top: 4px; line-height: 1.35; }
        #top-right { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
        #dock { position: absolute; left: 14px; right: 14px; top: var(--top-h, 60px); bottom: var(--bot-h, 180px); z-index: 11; display: flex; justify-content: space-between; gap: 10px; pointer-events: none; }
        #dock-l, #dock-r { display: flex; flex-direction: column; gap: 8px; min-height: 0; min-width: 0; align-items: stretch; }
        #dock-l { flex: 0 1 372px; }
        #dock-r { flex: 0 1 330px; align-items: flex-end; }
        #dock-l > *, #dock-r > * { pointer-events: auto; flex: 0 1 auto; min-height: 0; box-sizing: border-box; width: 100%; }
        #dock-r > #toasts { pointer-events: none; flex: none; }
        #dock-l > #status { min-height: 3.2em; }
        #events, #changes, #sky, #settings, #info { min-height: 110px; }   /* al repartirse el hueco no se aplastan hasta desaparecer */
        @media (max-height: 520px) { #events, #changes, #sky, #settings, #info { min-height: 40px; } #slider-ruler { height: 9px; } #slider-ruler .lb { display: none; } }
        #dock-l > #undo-bar { flex: none; }
        /* Botones de zoom y brujula del mapa: justo encima de la linea de tiempo, a la derecha; la columna derecha les deja su sitio (--ctrl-h lo mide el JS) */
        .maplibregl-ctrl-bottom-right { bottom: var(--bot-h, 180px) !important; }
        .maplibregl-ctrl-bottom-right .maplibregl-ctrl { margin: 0 14px 0 0 !important; }
        .maplibregl-ctrl-bottom-right .maplibregl-ctrl + .maplibregl-ctrl { margin-top: 6px !important; }
        #dock-r { margin-bottom: var(--ctrl-h, 0px); }
        .menu { position: relative; }
        .menu-btn::after { content: ' \25BE'; font-size: 11px; }
        .menu-btn[aria-expanded="true"] { background: var(--accent); color: var(--bg); }
        .menu-pop { background: var(--bg); backdrop-filter: none; position: absolute; top: calc(100% + 6px); right: 0; min-width: 190px; padding: 6px; display: flex; flex-direction: column; gap: 3px; z-index: 30; }
        .menu-pop[hidden] { display: none; }
        .menu-pop .btn { text-align: left; border-color: transparent; background: transparent; padding: 9px 12px; white-space: nowrap; }
        .menu-pop .btn:hover, .menu-pop .btn:focus-visible { background: var(--accent); color: var(--bg); }
        .menu-pop .btn[aria-pressed]::before { content: '\2610  '; }
        .menu-pop .btn[aria-pressed="true"]::before { content: '\2611  '; }
        .menu-pop .btn[aria-pressed="false"] { opacity: 0.75; }
        .menu-pop .menu-sep { height: 1px; margin: 3px 4px; background: rgba(128, 128, 128, 0.35); }

        .btn {
            background: var(--panel); color: var(--text); border: 1px solid var(--accent); border-radius: var(--btn-radius);
            padding: 8px 11px; cursor: pointer; font: 600 13px var(--font-ui);
        }
        .btn:hover { background: var(--accent); color: var(--bg); }
        .btn:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

        #search {
            width: 260px; max-width: 100%; padding: 8px 12px; border: 1px solid var(--accent); border-radius: 6px;
            background: var(--panel); color: var(--text); font: 600 13px var(--font-ui);
        }

        #status {
            position: relative; margin-top: auto; max-height: 9em; overflow: auto; padding: 9px 14px 8px 16px;
            font-size: 12px; line-height: 1.4; border-left: 4px solid var(--muted); display: none;
        }
        #status.visible { display: block; }
        #status.ok { border-left-color: var(--ok); }
        #status.warn { border-left-color: var(--warn); }
        #status.error { border-left-color: var(--err); }

        #info {
            position: relative; overflow: auto; padding: 14px 16px; display: none;
        }
        #info h2 { margin: 0 0 6px; font: 700 18px var(--font); color: var(--accent); }
        #info .row { margin-top: 7px; font-size: 13px; line-height: 1.4; word-break: break-word; }
        #info .row.row-link { cursor: pointer; text-decoration: underline dotted; text-underline-offset: 3px; }
        #info .row b { color: var(--accent); }
        #info a { color: var(--accent); }
        #info .close { position: absolute; top: 6px; right: 8px; background: none; border: none; color: var(--muted); font-size: 18px; cursor: pointer; }

        .badge { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 11px; font-weight: 700; color: #fff; }
        .badge.measurement, .badge.documentary, .badge.artefact { background: #2e7d32; }
        .badge.model { background: #1565c0; }
        .badge.reconstruction { background: #b7791f; }
        .badge.speculation { background: #8e24aa; }

        #timeline { position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%); width: min(94%, 980px); padding: 12px 18px 8px; z-index: 10; box-sizing: border-box; }
        #time-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
        #time-label { font: 700 24px var(--font); min-width: 190px; }
        #time-sub { font-size: 12px; color: var(--muted); }
        #time-input { width: 130px; padding: 6px 9px; border: 1px solid var(--accent); border-radius: 6px; background: transparent; color: var(--text); font: 600 13px var(--font-ui); }
        #slider { width: 100%; margin: 8px 0 2px; accent-color: var(--accent); }
        /* Regla bajo el deslizador: marcas como las de una regla de calculo (1, 2 ... 9 por cada potencia de 10 de «hace X años»). Los pasos
           iguales de tiempo se apelotonan hacia la derecha: se ve que la barra NO es lineal. */
        #slider-ruler { position: relative; height: 22px; margin: -2px 0 2px; pointer-events: none; overflow: hidden; }
        #slider-ruler .tk { position: absolute; top: 0; width: 1px; height: 4px; background: var(--muted); opacity: 0.55; }
        #slider-ruler .tk.mj { height: 8px; width: 1.5px; opacity: 0.95; background: var(--text); }
        #slider-ruler .lb { position: absolute; top: 9px; transform: translateX(-50%); font: 600 9.5px/12px var(--font-ui); color: var(--muted); white-space: nowrap; }
        #slider-ruler .lb.edge-l { transform: none; } #slider-ruler .lb.edge-r { transform: translateX(-100%); }
        #step-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
        #key-step { padding: 2px 6px; border: 1px solid var(--accent); border-radius: 6px; background: transparent; color: var(--text); font: 600 12px var(--font-ui); }
        #key-step option, #page-step option { color: #222; }
        #page-step { padding: 2px 6px; border: 1px solid var(--accent); border-radius: 6px; background: transparent; color: var(--text); font: 600 12px var(--font-ui); height: 24px; box-sizing: border-box; }
        #page-label { margin-left: 14px; }
        /* Editor de valor personalizado: flota sobre la linea de tiempo (no cambia su tamano) */
        .custom-wrap { position: relative; display: inline-block; }
        .custom-pop { position: absolute; bottom: calc(100% + 6px); left: 0; z-index: 40; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; padding: 8px; width: max-content; max-width: min(320px, 90vw); background: var(--bg); }
        .custom-pop[hidden] { display: none; }
        .custom-pop input, .custom-pop select { padding: 3px 6px; border: 1px solid var(--accent); border-radius: 6px; background: transparent; color: var(--text); font: 600 12px var(--font-ui); }
        .custom-pop input { width: 7em; }
        .custom-pop input[aria-invalid="true"] { border-color: var(--err); }
        .custom-pop .custom-msg { flex-basis: 100%; font-size: 11px; color: var(--muted); }
        .custom-pop .custom-msg.warn { color: var(--err); }
        #step-hint.warn { color: var(--warn); }
        .kofi { background: #29abe0; color: #fff; text-decoration: none; padding: 6px 12px; border-radius: 6px; font: 700 13px var(--font-ui); }

        @media (max-width: 760px), (max-height: 520px) {
            #timeline { padding: 8px 12px 6px; }
            #time-label { font-size: 19px; min-width: 0; }
        }
        @media (max-height: 820px) { .toast:nth-child(n+3) { display: none; } }   /* con poca altura, como mucho dos avisos a la vez */
        @media (max-height: 520px) { .toast:nth-child(n+2) { display: none; } #status { max-height: 4.2em; } #time-sub, #clock-sub { display: none; } #time-label { font-size: 17px; } #clock-controls { margin-top: 0; } #slider { margin: 4px 0 0; } }
        @media (max-width: 760px) { .toast { padding: 6px 10px; font-size: 13px; } .toast:nth-child(n+2) { display: none; } #status { max-height: 5.6em; } #events, #changes, #sky, #settings, #info { min-height: 90px; } }
        #ev-hover { position: absolute; left: 0; top: 0; z-index: 4; pointer-events: none; padding: 1px 9px; border-radius: 11px; border: 1.5px solid #000; background: var(--ev, #888); color: #000;
            font: 700 12px/18px var(--font-ui); white-space: nowrap; max-width: 280px; overflow: hidden; text-overflow: ellipsis; box-shadow: 0 2px 6px rgba(0, 0, 0, 0.35); }
        [hidden] { display: none !important; }
        #space { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
        /* Sistema solar: continuacion del zoom del globo. El lienzo de detras es #space; el mapa (la Tierra) queda entre ese y este */
        #solar { position: absolute; inset: 0; z-index: 6; pointer-events: none; }
        #solar[hidden] { display: none; }
        #solar-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; pointer-events: auto; }
        #solar-canvas:active { cursor: grabbing; }
        #solar-chips { position: absolute; top: var(--top-h, 56px); left: 14px; z-index: 7; pointer-events: auto; display: flex; gap: 5px; flex-wrap: wrap; max-width: calc(100% - 28px); }
        #solar-chips { flex-wrap: nowrap !important; overflow-x: auto; padding-bottom: 4px; }   /* una sola fila que se desplaza: nunca invade la ficha de debajo */
        #solar-chips .btn { padding: 4px 9px; font-size: 12px; flex: none; }
        #solar-chips .btn.on { background: var(--accent); color: var(--bg); }
        #solar-info { overflow: auto; max-height: calc(100% - var(--top-h, 56px) - var(--bot-h, 180px) - 52px); position: absolute; top: calc(var(--top-h, 56px) + 44px); left: 14px; z-index: 7; pointer-events: auto; width: 290px; max-width: calc(100% - 28px); padding: 10px 14px 12px; box-sizing: border-box; }
        #solar-info h2 { margin: 0 0 4px; font: 700 18px var(--font); color: var(--accent); }
        #solar-info .solar-lines div { font-size: 12px; line-height: 1.45; margin-top: 3px; }
        #solar-zoom { width: 100%; margin: 10px 0 8px; accent-color: var(--accent); }
        #solar-back { padding: 4px 10px; font-size: 12px; }
        #solar-note { position: absolute; left: 14px; bottom: 214px; z-index: 7; max-width: 360px; padding: 8px 12px; font-size: 11.5px; line-height: 1.4; border-left: 4px solid #1565c0; }
        body.solar-on #space-note, body.solar-on #status, body.solar-on #info, body.solar-on #events, body.solar-on #changes, body.solar-on #sky { display: none !important; }   /* en la vista del sistema solar no pintan nada y dejarian hueco en las columnas */
        body.solar-on .maplibregl-canvas-container { transition: opacity .25s ease; }
        body.solar-on .maplibregl-ctrl-bottom-right { z-index: 8; }
        @media (max-width: 760px) { #solar-info { width: 250px; } #solar-note { display: none; } }
        #space-note:empty { display: none; }
        #space-note { position: relative; margin-top: auto; font-size: 11.5px; color: #9aa6c0; pointer-events: none !important; text-align: right; }
        .btn[aria-pressed="false"] { opacity: 0.6; }
        #clock { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
        #clock-time { font: 700 15px var(--font-ui); font-variant-numeric: tabular-nums; }
        #clock-sub { font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
        #clock-controls { display: flex; gap: 6px; align-items: center; margin-top: 2px; flex-wrap: wrap; }
        #clock-controls .btn { padding: 3px 10px; font-size: 12px; }
        #clock-rate { padding: 3px 6px; border: 1px solid var(--accent); border-radius: 6px; background: transparent; color: var(--text); font: 600 12px var(--font-ui); }
        #clock-rate option { color: #222; }
        #events { position: relative; overflow: auto; padding: 12px 14px 10px; display: none; }
        #events.open { display: block; }
        #events h2 { margin: 0 0 6px; font: 700 17px var(--font); color: var(--accent); padding-right: 22px; }
        #events .close { position: absolute; top: 6px; right: 8px; background: none; border: none; color: var(--muted); font-size: 18px; cursor: pointer; }
        #events-verif { margin: 6px 0 4px; font-size: 12.5px; }
        #events-verif summary { cursor: pointer; font-weight: 600; }
        #events-verif label { display: flex; gap: 7px; align-items: flex-start; padding: 2px 0; line-height: 1.3; }
        #events-verif .vf-n { color: var(--muted); }
        #events-verif .vf-sep { margin: 6px 0 2px; color: var(--muted); font-size: 11.5px; }

<script>
'use strict';

/** Pantalla estrecha (movil / tableta vertical): las columnas de recuadros pasan a una pila y solo hay una hoja abierta. Coincide con la mediaquery del CSS. */
const PHONE = window.matchMedia('(max-width: 760px)');

const COMPACT = window.matchMedia('(max-width: 760px), (max-height: 520px)');

/* ------------------------------------------------------------------ */
/* Configuración                                                      */
/* ------------------------------------------------------------------ */
const CFG = {
    gplates: 'https://gws.gplates.org/reconstruct/coastlines/',
    model: 'MERDITH2021',               // el servicio no devuelve el modelo: lo fijamos y lo mostramos nosotros
    hbCommit: 'da7a4b735ecef70aebdc9c73e409d8a2500d50f3',
    present: 1950,                       // convención BP: el "presente" es 1950
    nowYear: 2026,
    maxYbp: 1e9,                         // límite del modelo de placas (1000 Ma)
    sliderMax: 10000,
    deepTimeFrom: 1e6,                   // desde 1 Ma se muestra la edad en Ma
    paleoBase: './data/paleocoastlines/',   // archivo propio: PaleoMAP PaleoCoastlines (CC BY 4.0), 0-535 Ma
    paleoMaxDeltaMa: 10,                 // no se usa una loncha mas lejana que esto
    neFromYear: 2016, neUrl: './data/borders/ne-10m-countries.json',   // fronteras vigentes (Natural Earth 10m) desde este año
    bordersMaxYbp: 125000,               // las fronteras históricas empiezan en -123000
    throttleMs: 80,                      // costas: ligeras, se actualizan mientras se arrastra el slider
    bordersDebounceMs: 300,              // fronteras: archivos de 1-3,6 MB, se piden cuando el slider se detiene
    fetchTimeoutMs: 40000

CFG.hbBase = 'https://cdn.jsdelivr.net/gh/aourednik/historical-basemaps@' + CFG.hbCommit + '/';
// offset para que el extremo "ahora" (2026 = 1950 - (-76)) sea el final (derecha) del slider
const OFFSET = CFG.nowYear - CFG.present + 1;

/* ------------------------------------------------------------------ */
/* Preferencias (cookie propia, sin seguimiento)                      */
/* ------------------------------------------------------------------ */
// Una sola cookie "ct_prefs" con idioma, tema, instante, centro y zoom. Se valida campo a campo al
// leerla: una cookie manipulada o antigua nunca puede romper la web, solo se ignora lo que no sirva.
const PREF_COOKIE = 'ct_prefs';
const parsePrefs = (raw) => {
    const out = {};
    let p;
    try { p = JSON.parse(raw); } catch (err) { return out; }
    if (!p || typeof p !== 'object') return out;
    if (p.lang === 'es' || p.lang === 'en') out.lang = p.lang;
    if (p.dark === 0 || p.dark === 1) out.dark = p.dark === 1;
    if (typeof p.ybp === 'number' && Number.isFinite(p.ybp) && p.ybp >= 1 - OFFSET && p.ybp <= CFG.maxYbp) out.ybp = Math.round(p.ybp);
    if (Array.isArray(p.c) && p.c.length === 2 && p.c.every((n) => typeof n === 'number' && Number.isFinite(n)) && Math.abs(p.c[0]) <= 180 && Math.abs(p.c[1]) <= 85) out.c = [p.c[0], p.c[1]];
    if (typeof p.z === 'number' && p.z >= 0 && p.z <= 22) out.z = p.z;
    if (p.sp === 0 || p.sp === 1) out.sp = p.sp === 1;
    if (p.cc === 0 || p.cc === 1) out.cc = p.cc === 1;   // centrar al hacer clic
    if (p.bh === 0 || p.bh === 1) out.bh = p.bh === 1;   // fronteras historicas ocultas por el usuario (de cerca)
    if (p.rd === 0 || p.rd === 1) out.rd = p.rd === 1;   // capa de carreteras y ferrocarriles de hoy (apagada por defecto)
    if (p.bu === 0 || p.bu === 1) out.bu = p.bu === 1;   // capa de construcciones (encendida por defecto)
    if (p.so === 'new' || p.so === 'old' || p.so === 'rel') out.so = p.so;   // orden de los resultados del buscador
    if (typeof p.ks === 'string' && /^(?:[0-9A-Za-z]{1,5}|x[1-9][0-9]{0,8}[nhdwoy])$/.test(p.ks)) out.ks = p.ks;   // paso de las flechas (id, o personalizado 'x15n'; se valida al usarlo)
    // ultimo elemento elegido (ficha): pais/entidad por su nombre ('p'), suceso por su id ('e') o construccion por su id ('b'); texto corto y sin caracteres de control
    if (p.sel && typeof p.sel === 'object' && (p.sel.k === 'p' || p.sel.k === 'e' || p.sel.k === 'b') && typeof p.sel.v === 'string' && p.sel.v.length > 0 && p.sel.v.length <= 160 && !/[\u0000-\u001f\u007f]/.test(p.sel.v)) out.sel = { k: p.sel.k, v: p.sel.v };
    if (typeof p.kp === 'string' && /^(?:auto|[0-9A-Za-z]{1,5}|x[1-9][0-9]{0,8}[nhdwoy])$/.test(p.kp)) out.kp = p.kp;   // paso de RePag/AvPag ('auto' = x10 el de las flechas)
    if (Number.isInteger(p.ah) && p.ah >= 0 && p.ah <= 3) out.ah = p.ah;   // ocultar recuadros informativos solos: nivel 0 (nunca) a 3
    if (Number.isInteger(p.pp) && p.pp >= 0 && p.pp <= 31) out.pp = p.pp;   // recuadros «mostrar siempre» (mascara de bits)
    if (typeof p.pn === 'string' && p.pn.length <= 300 && /^[a-z0-9:,;-]*$/.test(p.pn)) out.pn = p.pn;   // posiciones de los recuadros (se valida pieza a pieza al usarlas)
    if (Number.isInteger(p.sl) && p.sl >= 0 && p.sl <= 7) out.sl = p.sl;   // capas del cielo: 1 lineas de constelaciones, 2 nombres de estrellas, 4 nombres de constelaciones
    if (p.ea === 0 || p.ea === 1 || p.ea === 2) out.ea = p.ea;   // ambientacion de epoca: 0 sin, 1 sutil, 2 completa (ChronosEras)
    if (p.ia === 0 || p.ia === 1 || p.ia === 2) out.ia = p.ia;   // animacion de iconos y saltos de tiempo: 0 apagada, 1 ahorro, 2 completa (antes 0/1: el 1 antiguo pasa a ahorro)
    if (Number.isInteger(p.et) && p.et >= 0 && p.et <= 16383) out.et = p.et;   // tipos de suceso OCULTOS por el usuario (mascara de bits, un bit por grupo de map/event-icons.js)
    if (Number.isInteger(p.vf) && p.vf >= 0 && p.vf <= 127) out.vf = p.vf;   // filtros de verificacion de sucesos (mascara de bits)
    if (typeof p.jd === 'number' && Number.isFinite(p.jd) && p.jd >= 900000 && p.jd <= 3000000) out.jd = p.jd;   // dia juliano UT del reloj
    if (p.tl === 0 || p.tl === 1) out.tl = p.tl;   // linea de tiempo: 1 desplegada (pasos, saltos, creditos); por defecto plegada
    if (Number.isInteger(p.pg) && p.pg >= 0 && p.pg <= 7) out.pg = p.pg;   // notas cerradas por el usuario que no deben volver solas (1 estado, 2 fondo espacial, 4 sistema solar)
    return out;
};
const readPrefs = () => {
    try {
        const hit = document.cookie.split('; ').find((c) => c.startsWith(PREF_COOKIE + '='));

    } catch (err) { return {}; }

// Acepta: 1789, 44 a.C., 44 BC, 117 d.C., 12 ka, 250 Ma. Un número negativo suelto se lee como a.C.
function parseTime(raw) {
    const s = String(raw || '').trim().toLowerCase().replace(/\./g, '').replace(',', '.').replace(/\s+/g, ' ');
    let m;
    if ((m = s.match(/^(-?\d+(?:\.\d+)?)\s*(ma|myr|mya)$/))) return Math.abs(parseFloat(m[1])) * 1e6;
    if ((m = s.match(/^(-?\d+(?:\.\d+)?)\s*(ka|kyr|kya)$/))) return Math.abs(parseFloat(m[1])) * 1e3;
    if ((m = s.match(/^(\d+)\s*(bc|bce|ac|a de c|antes de cristo)$/))) return yearToYbp(1 - parseInt(m[1], 10));
    if ((m = s.match(/^(\d+)\s*(ad|ce|dc|d de c)?$/))) return yearToYbp(parseInt(m[1], 10));
    if ((m = s.match(/^-(\d+)$/))) return yearToYbp(1 - parseInt(m[1], 10));
    return null;
}

const cache = new Map();     // url -> JSON ya descargado (no se vuelve a pedir en toda la sesión)
const pending = new Map();   // url -> descarga en curso sin señal de cancelación, compartida por quien la pida

// Una sola descarga por URL, la pida quien la pida (precarga o la fecha elegida). Cancelar al que ESPERA (el slider se movio) no cancela la
// descarga: termina, entra en la cache y la siguiente vez que se pida esa fecha es instantanea. Antes se cortaba a medias (se perdia lo
// bajado) y una precarga y una peticion con señal bajaban el mismo archivo dos veces.
function abortable(p, signal) {
    if (!signal) return p;
    return new Promise((resolve, reject) => {
        const stop = () => reject(new DOMException('Aborted', 'AbortError'));
        if (signal.aborted) return stop();
        signal.addEventListener('abort', stop, { once: true });
        p.then((v) => { signal.removeEventListener('abort', stop); resolve(v); }, (e) => { signal.removeEventListener('abort', stop); reject(e); });
    });

function getJSON(url, signal) {
    if (cache.has(url)) return Promise.resolve(cache.get(url));
    let p = pending.get(url);

        const opts = { signal: AbortSignal.timeout(CFG.fetchTimeoutMs) };
        if (url.startsWith(CFG.hbBase)) opts.cache = 'force-cache';
        p = (async () => {
            const res = await fetch(url, opts);
            if (!res.ok) throw new Error('HTTP ' + res.status);
            const data = JSON.parse(await res.text());
            cache.set(url, data);
            return data;
        })();
        pending.set(url, p);
        const done = () => pending.delete(url);
        p.then(done, done);
    }
    return abortable(p, signal);
}

async function loadLand(ybp, signal) {

    let paleoError = null;

        const manifest = await loadPaleoManifest(signal);

        manifest.ages.forEach((a) => { const d = Math.abs(a.age_ma - targetMa); if (!best || d < best.d) best = { a, d }; });
        if (best && best.d <= CFG.paleoMaxDeltaMa) {
            const data = await getJSON(CFG.paleoBase + best.a.file, signal);
            if (!data || !Array.isArray(data.features)) throw new Error('sin features');
            return { type: 'paleo', data, ma: best.a.age_ma, targetMa, delta: best.d };
        }
    } catch (err) {
        if (err && err.name === 'AbortError') throw err;
        paleoError = err;
    }

    const url = CFG.gplates + '?time=' + ma + (ma > 0 ? '&model=' + CFG.model : '');
    const data = await getJSON(url, signal);
    if (!data || !Array.isArray(data.features)) throw new Error('sin features');
    return { type: 'rigid', data, ma, deep, fallbackError: paleoError };
}

function hue(str) {
    let h = 0;
    for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) >>> 0;
    return h % 360;
}

function colorize(fc) {
    if (fc._colored) return fc;
    fc.features.forEach((f) => {
        const p = f.properties || (f.properties = {});
        const key = p.SUBJECTO || p.NAME;
        p._c = key ? 'hsl(' + hue(key) + ', 55%, 52%)' : '#8a8a8a';
        p._o = key ? 0.5 : 0.12;
    });
    fc._colored = true;
    return fc;
}

async function loadPolities(signal) {
    if (state.polities) return state.polities;
    const index = await getJSON(CFG.hbBase + 'index.json', signal);
    state.polities = index.years.map((y) => ({ year: y.year, file: y.filename, names: y.countries || [] }));
    return state.polities;
}

function nearestSnapshot(polities, year) {
    let best = null;
    polities.forEach((p) => { const d = Math.abs(p.year - year); if (!best || d < best.d) best = { p, d }; });
    return best;
}

// Instantánea más cercana, o null si no hay ninguna lo bastante próxima:
// no se muestra una instantánea muy lejana, sería inventar fronteras.
function pickSnapshot(ybp) {
    if (ybp > CFG.bordersMaxYbp || !state.polities) return null;
    const year = ybpToYear(ybp);
    const best = nearestSnapshot(state.polities, year);
    if (!best || best.d > Math.max(500, 0.25 * Math.abs(year))) return null;
    return best;
}

const snapshotUrl = (best) => CFG.hbBase + 'geojson/' + best.p.file;

// Desde 2016 se usan las fronteras vigentes de Natural Earth 10m (dominio publico, resolucion ~1,7 km, fuente y
// licencia en data/borders/manifest.json), mucho mas precisas que la compilacion historica; antes, esa compilacion.
const usesNE = (ybp) => ybpToYear(ybp) >= CFG.neFromYear;
const neBorders = (fc) => ({ data: colorize(fc), year: CFG.neFromYear, delta: 0, source: 'ne', meta: fc.meta });

// Fronteras ya en memoria: objeto o null (no corresponde mostrar ninguna). undefined = hay que descargar.
function bordersCached(ybp) {
    if (usesNE(ybp)) return cache.has(CFG.neUrl) ? neBorders(cache.get(CFG.neUrl)) : undefined;
    if (ybp > CFG.bordersMaxYbp) return null;
    if (!state.polities) return undefined;
    const best = pickSnapshot(ybp);
    if (!best) return null;
    const url = snapshotUrl(best);
    if (!cache.has(url)) return undefined;
    return { data: colorize(cache.get(url)), year: best.p.year, delta: best.d };
}

async function loadBorders(ybp, signal) {
    if (usesNE(ybp)) return neBorders(await getJSON(CFG.neUrl, signal));
    if (ybp > CFG.bordersMaxYbp) return null;
    await loadPolities(signal);
    const best = pickSnapshot(ybp);
    if (!best) return null;
    const data = colorize(await getJSON(snapshotUrl(best), signal));
    return { data, year: best.p.year, delta: best.d };
}

/* Detalle al acercar: geografía ACTUAL de OpenFreeMap (OpenStreetMap)  */
/* ------------------------------------------------------------------ */
// Las costas del modelo son gruesas (~15 000 puntos para todo el mundo). Al acercar se superpone el
// mapa vectorial de hoy, pero sin hacerlo pasar por reconstrucción de la época:
//   · hasta hoy y desde 1950: estilo completo (caminos, edificios no, rótulos, relieve);
//   · de hace 11 000 años a 1950: solo lo físico (agua, ríos, cobertura del suelo), sin obra humana;
//   · antes: nada, porque el nivel del mar y los hielos eran otros y ese mapa mentiría.
// El estilo se pide una sola vez y solo cuando hace falta. Si falla, se reintenta con espera creciente.
const DETAIL = {
    styleUrl: 'https://tiles.openfreemap.org/styles/liberty',
    zoomOn: 4.6, zoomOff: 4.2,        // histéresis: evita parpadeo en el umbral
    physicalMaxYbp: 11000,
    shown: null,                      // null | 'physical' | 'full'
    layers: [],                       // { id, role, physical, orig }
    built: false, building: null, error: null, failedAt: null, backoff: 15000, fadeTimer: null
};
const DETAIL_PHYSICAL_LAYERS = new Set(['water', 'waterway', 'landcover']);
const DETAIL_NOT_MODERN_WATER = ['!', ['in', ['get', 'class'], ['literal', ['dock', 'swimming_pool']]]];

function detailMode() {
    if (state.ybp > DETAIL.physicalMaxYbp) return null;
    if (map.getZoom() < (DETAIL.shown ? DETAIL.zoomOff : DETAIL.zoomOn)) return null;
    return state.ybp <= 0 ? 'full' : 'physical';
}

async function detailFetchStyle() {
    const res = await fetch(DETAIL.styleUrl);
    if (!res.ok) throw new Error('OpenFreeMap HTTP ' + res.status);
    const style = await res.json();
    if (!style || typeof style !== 'object' || !style.sources || !Array.isArray(style.layers)) throw new Error('estilo de OpenFreeMap con forma inesperada');
    return style;
}

function detailBuild(style) {
    if (style.glyphs) map.setGlyphs(style.glyphs);
    if (style.sprite) map.setSprite(style.sprite);
    Object.entries(style.sources).forEach(([name, src]) => map.addSource('ofm-' + name, src));
    // Rotulo con el nombre de parques y espacios protegidos (el estilo de OpenFreeMap dibuja el relleno y el contorno de rayas, pero
    // no su nombre): sin el, una zona de otro tono con borde de rayas se confunde con un territorio. Hereda fuente y halo de un rotulo existente.
    const proto = style.layers.find((l) => l.type === 'symbol' && l.source && l.layout && l.layout['text-font']);
    if (proto && !style.layers.some((l) => l.id === 'chronos_park_name')) {
        style.layers.push({
            id: 'chronos_park_name', type: 'symbol', source: proto.source, 'source-layer': 'park', minzoom: 9,
            filter: ['match', ['geometry-type'], ['MultiPolygon', 'Polygon'], true, false],
            layout: { 'text-field': ['coalesce', ['get', 'name:latin'], ['get', 'name']], 'text-font': proto.layout['text-font'], 'text-size': 12, 'text-max-width': 7, 'text-padding': 6 },
            paint: { 'text-color': '#3b6d3b', 'text-halo-color': (proto.paint && proto.paint['text-halo-color']) || '#ffffff', 'text-halo-width': 1.2 }
        });
    }
    // Nombre y altitud de picos y volcanes: el estilo de OpenFreeMap no rotula las teselas `mountain_peak`. Solo se ve con las fronteras apagadas (nombres de accidentes geograficos).
    if (proto && window.ChronosLabels && !style.layers.some((l) => l.id === 'chronos_peak_name')) style.layers.push(ChronosLabels.peakLayer(proto.source, proto.layout['text-font']));
    style.layers.forEach((l) => {
        if (l.type === 'fill-extrusion') return;               // edificios en 3D: pesados y de hoy
        const clone = { ...l, id: 'ofm-' + l.id, layout: { ...(l.layout || {}), visibility: 'none' } };
        if (l.source) clone.source = 'ofm-' + l.source;
        // Tierra y suelo van DEBAJO de las fronteras; agua, caminos y rotulos ENCIMA. Asi el agua real
        // tapa lo que el poligono grueso de una frontera invadia del mar (no se superponen los mapas).
        const below = l.type === 'background' || l.type === 'raster' || (l.type === 'fill' && ['landcover', 'landuse', 'park'].includes(l['source-layer']));
        map.addLayer(clone, below ? 'borders-fill' : 'borders-hl');
        const role = l.type === 'background' ? 'bg'
            : l['source-layer'] === 'water' && l.type === 'fill' ? 'water'
            : l['source-layer'] === 'waterway' && l.type === 'line' ? 'waterway'
            : l['source-layer'] === 'boundary' && l.type === 'line' ? 'boundary'
            : l.type === 'symbol' ? 'symbol' : l.type === 'fill' ? 'fill' : 'other';
        const physical = role === 'bg' || (DETAIL_PHYSICAL_LAYERS.has(l['source-layer']) && l.type !== 'symbol' && l.id !== 'waterway_tunnel');
        const orig = {};
        if (role === 'fill') orig['fill-opacity'] = map.getPaintProperty(clone.id, 'fill-opacity');
        if (role === 'symbol') { orig['text-color'] = map.getPaintProperty(clone.id, 'text-color'); orig['text-halo-color'] = map.getPaintProperty(clone.id, 'text-halo-color'); }
        DETAIL.layers.push({ id: clone.id, role, physical, orig, filter: l.filter || null, country: window.ChronosLabels ? ChronosLabels.isCountryLabel(l) : false,
            geo: role === 'symbol' && window.ChronosLabels ? ChronosLabels.geoNames(l) : null, onlyGeo: l.id === 'chronos_peak_name', geoApplied: false,
            road: Boolean(window.ChronosLabels && ChronosLabels.isRoadLayer(l)),     // calzadas, ferrocarril, caminos, flechas, nombres y escudos: los gobierna el boton Carreteras
            riverLabel: role === 'symbol' && l['source-layer'] === 'waterway', minzoom0: l.minzoom === undefined ? 0 : l.minzoom, maxzoom0: l.maxzoom === undefined ? 24 : l.maxzoom });
    });
    detailTheme();
}

// Mismo color de tierra y agua que el mapa grueso (no hay salto al cruzar el umbral); en oscuro se
// atenúan las superficies de uso del suelo y se aclaran los rótulos.
function detailTheme() {
    if (!DETAIL.built && !DETAIL.layers.length) return;
    const p = palette();
    DETAIL.layers.forEach((l) => {
        if (l.role === 'bg') map.setPaintProperty(l.id, 'background-color', p.land);
        else if (l.role === 'water') map.setPaintProperty(l.id, 'fill-color', p.ocean);
        else if (l.role === 'waterway') map.setPaintProperty(l.id, 'line-color', p.ocean);
        else if (l.role === 'fill') map.setPaintProperty(l.id, 'fill-opacity', state.dark ? 0.28 : l.orig['fill-opacity']);
        else if (l.role === 'symbol') {
            map.setPaintProperty(l.id, 'text-color', state.dark ? '#e6e2d8' : l.orig['text-color']);
            map.setPaintProperty(l.id, 'text-halo-color', state.dark ? '#1b2126' : l.orig['text-halo-color']);
        }
    });
}

function detailEnsure() {
    if (DETAIL.built) return Promise.resolve(true);
    if (DETAIL.building) return DETAIL.building;
    if (DETAIL.failedAt !== null && performance.now() - DETAIL.failedAt < DETAIL.backoff) return Promise.resolve(false);
    DETAIL.building = detailFetchStyle().then((style) => {
        detailBuild(style);
        DETAIL.built = true; DETAIL.error = null; DETAIL.failedAt = null; DETAIL.backoff = 15000;
        return true;
    }).catch((err) => {
        DETAIL.error = err; DETAIL.failedAt = performance.now(); DETAIL.backoff = Math.min(DETAIL.backoff * 2, 300000);
        console.warn('[DETAIL]', err.message);
        renderStatus();
        return false;
    }).finally(() => { DETAIL.building = null; });
    return DETAIL.building;
}

// El fondo de tierra solo se destapa cuando ya hay teselas de agua; si no, se vería tierra sobre el océano.
function detailFade() {
    const bgs = DETAIL.layers.filter((l) => l.role === 'bg');
    bgs.forEach((l) => map.setPaintProperty(l.id, 'background-opacity', 0));
    const reveal = () => { clearTimeout(DETAIL.fadeTimer); bgs.forEach((l) => map.setPaintProperty(l.id, 'background-opacity', 1)); };
    map.once('idle', reveal);
    DETAIL.fadeTimer = setTimeout(reveal, 3000);
}

// Las fronteras administrativas actuales de OpenStreetMap no se dibujan mientras haya fronteras historicas:
// serian dos mapas de fronteras superpuestos (y el actual no es el de la epoca).
function detailVisibility() {
    const mode = DETAIL.shown;
    DETAIL.layers.forEach((l) => {
        // Los nombres de pais del detalle son los de HOY: con los nombres propios a la vista (fronteras puestas) duplicarian, y en un mapa historico serian de otra epoca.
        const ownNames = l.country && LBL.ready && state.borders && !BR.cut;
        // Sin fronteras a la vista (apagadas, o la vista queda lejos): solo se nombran accidentes geograficos (map/labels.js geoNames); ningun pais, estado, ciudad, carretera ni POI.
        const geoOnly = BR.cut === true && l.role === 'symbol' && Boolean(l.geo);
        // Las carreteras (con sus nombres y escudos) son una capa aparte: las gobierna su boton, no la regla de nombres geograficos.
        const geoHidden = !l.road && l.role === 'symbol' && ((geoOnly && !l.geo.show) || (l.onlyGeo && !BR.cut));
        const roadHidden = l.road && !ROADS.on;
        map.setLayoutProperty(l.id, 'visibility', mode && (mode === 'full' || l.physical) && !(l.role === 'boundary' && state.borders) && !ownNames && !geoHidden && !roadHidden ? 'visible' : 'none');
        if (l.geo && l.geo.show && !l.road && l.geoApplied !== geoOnly) {
            map.setFilter(l.id, geoOnly ? l.geo.filter : l.filter); l.geoApplied = geoOnly;
            // Los rios con nombre ya vienen en las teselas desde z6 (comprobado con la sonda: Po, Brahmaputra...); el estilo los rotula desde z10. Sin fronteras, que se nombren desde z6.
            if (l.riverLabel) map.setLayerZoomRange(l.id, geoOnly ? Math.min(6, l.minzoom0) : l.minzoom0, l.maxzoom0);
        }
        // Antes de hoy no se dibujan dársenas ni piscinas: obras modernas (clases `dock` y `swimming_pool` del esquema de OpenFreeMap, comprobadas con la sonda).
        if (l.role === 'water') map.setFilter(l.id, mode === 'physical' ? (l.filter ? ['all', l.filter, DETAIL_NOT_MODERN_WATER] : DETAIL_NOT_MODERN_WATER) : (l.filter || null));
    });
}

/* ---- franja entre frontera y costa ---- */
// Los poligonos historicos estan dibujados con muy pocos puntos y quedan tierra adentro; con la costa real al
// fondo queda una franja sin color. Se colorea con el pais mas cercano (hasta GAP_DIST_M) y con el mismo tinte que
// el poligono: la costa la pone el mapa, no el poligono. El reparto entre vecinos junto a la costa es una aproximacion
// grafica, no un dato; se declara en el estado.
const GAP_DIST_M = 100000;       // fronteras historicas (toscas)
const GAP_DIST_NE_M = 20000;     // Natural Earth (1,7 km): solo rendijas frente a la costa del mapa
const GAP_MAX_SPAN_DEG = 200;    // vistas mas anchas (el globo entero): las franjas miden menos de un pixel
const GAP_CELL_PX = 1.5;         // tamano de celda objetivo en pixeles de pantalla (para que la costa no salga escalonada)
const GAP_CELLS_MIN = 200; const GAP_CELLS_MAX = 1100;
let gapSeq = 0;                   // el PNG se codifica fuera del hilo principal: solo vale el ultimo

    if (BR.off) return false;
    if (state.bordersLoading && bordersExpected()) return true;
    return GAP.dirty;
}
function naturalView() {
    if (!map.getLayer('natural-raster')) return;
    const on = Boolean(naturalWanted());
    if (on === NAT.on && NAT.applied) return;
    NAT.on = on; NAT.applied = true;
    map.setLayoutProperty('natural-raster', 'visibility', on ? 'visible' : 'none');
    ['natural-cap-n', 'natural-cap-s'].forEach((id) => { if (map.getLayer(id)) map.setLayoutProperty(id, 'visibility', on ? 'visible' : 'none'); });
    // La tierra del mapa base queda casi invisible (0,01: con 0 MapLibre deja de detectar clics) para seguir dando su ficha
    map.setPaintProperty('margin-fill', 'fill-opacity', on ? 0.01 : 1);
    map.setPaintProperty('land-fill', 'fill-opacity', on ? 0.01 : 1);
    map.setPaintProperty('land-line', 'line-opacity', on ? 0.25 : 1);
    renderCredits(); renderStatus();
}
map.on('error', (e) => {
    if (!e || e.sourceId !== 'natural' || NAT.failed) return;
    if (++NAT.errors >= 4) { NAT.failed = true; naturalView(); }   // varias teselas sin cargar: se vuelve al mapa de colores y se avisa
});
// Se mide sobre el lienzo: cambia con el zoom, pero tambien al mover (la latitud cambia el radio del globo), inclinar o redimensionar.
map.on('move', bordersView); map.on('resize', bordersView);
map.on('moveend', bordersView);
$('btn-borders').addEventListener('click', () => { BR.off = !BR.off; savePrefs({ bh: BR.off }); bordersView(); renderStatus(); });

function renderStatus() {
    const ybp = state.ybp;
    const messages = [];
    let level = 'ok';
    const L = state.landError ? null : state.land;
    if (state.landError) {
        level = 'warn';
        messages.push(fmt('landFail', { err: state.landError.message }));
    } else if (L) {
        if (L.type === 'paleo') {
            if (ybp < CFG.deepTimeFrom) messages.push(t('seaLevel'));
            else {
                const near = L.delta > 0 ? fmt('paleoNear', { t: nf().format(L.targetMa), d: nf().format(L.delta) }) : '';
                messages.push(fmt('paleoOk', { age: L.ma + ' Ma', near }));
            }
        } else {
            if (L.fallbackError) { level = 'warn'; messages.push(fmt('paleoFallback', { err: L.fallbackError.message })); }
            messages.push(L.deep ? fmt('landOk', { model: CFG.model, age: L.ma + ' Ma' }) : t('seaLevel'));
        }
    }
    if (state.bordersError) {
        level = 'warn';
        messages.push(fmt('bordersFail', { err: state.bordersError.message }));
    } else if (bordersStale()) {
        const shownY = BR.swap && GAP.year != null ? GAP.year : (state.borders && state.borders.data ? state.borders.year : null);   // la que SE VE, no la que viene
        messages.push(shownY !== null ? fmt('loadingBordersKeep', { y: formatYear(shownY) }) : t('loadingBorders'));
    } else if (state.borders) {
        const b = state.borders;
        if (b.source === 'ne') {
            messages.push(fmt('bordersNE', { km: nf().format(b.meta.segment_median_km) }));
            if (ybpToYear(state.ybp) < 2020) messages.push(t('neBackdate'));
            if (BR.far) messages.push(fmt('bordersFarNE', { p: Math.round(BORDER_MIN_COVER * 100) }));
            else if (BR.off) messages.push(t('bordersOff'));
        } else {
            messages.push(fmt('bordersSnapshot', { y: formatYear(b.year), d: b.delta === 0 ? t('exact') : fmt('apart', { n: nf().format(b.delta) }) }));
            const km = BR.resKm ? nf().format(Math.round(BR.resKm * 10) / 10) : '';
            if (BR.far) messages.push(fmt('bordersFar', { y: formatYear(b.year), km, p: Math.round(BORDER_MIN_COVER * 100) }));
            else if (BR.off) messages.push(t('bordersOff'));
            else if (BR.near) messages.push(fmt('bordersNear', { km }));
        }
    } else if (ybp <= CFG.bordersMaxYbp) {
        messages.push(t('noBorders'));
    }
    if (GAP.shown) messages.push(t(state.borders && state.borders.source === 'ne' ? 'gapNoteNE' : 'gapNote'));
    if (DETAIL.shown) messages.push(t(DETAIL.shown === 'full' ? (BR.cut ? 'detailGeo' : 'detailFull') : 'detailPhysical'));
    if (NAT.on) messages.push(t('naturalNote'));
    else if (NAT.failed) messages.push(t('naturalFail'));
    else if (DETAIL.error && detailMode()) { level = 'warn'; messages.push(fmt('detailFail', { err: DETAIL.error.message })); }
    // La nota de lo que se ve (costas, fronteras, Tierra natural...) ya no sale sola: esta en la «i» de la linea de tiempo (el creador,
    // 2026-11-13: "necesito que esto no aparezca si no se le pide"). Solo se muestra por su cuenta si es un AVISO (algo fallo o tarda).
    const sc = $('tl-scene'); sc.textContent = messages.join(' '); sc.classList.toggle('warn', level !== 'ok');
    if (messages.length && level !== 'ok') { setStatus(level, messages.join(' ')); STATUS_SCENE = true; }
    else if (STATUS_SCENE) { clearStatus(); STATUS_SCENE = false; }
    renderCredits();
}

/* Costas: ligeras (~300 KB) y se precargan, así que siguen al slider mientras se arrastra. */
async function updateScene({ immediate = false } = {}) {
    const token = ++sceneToken;
    await mapReady;
    if (token !== sceneToken) return;   // llegó otra petición mientras el mapa arrancaba
    const ybp = state.ybp;
    scheduleBorders(immediate);         // en paralelo: no esperan a las costas
    const slow = setTimeout(() => { if (token === sceneToken) { setStatus('warn', t('loadingLand')); STATUS_SCENE = true; } }, 350);
    try {
        const L = await loadLand(ybp);
        // Una respuesta de una petición ya superada se pinta igualmente (así se ve avanzar el mapa
        // mientras se arrastra), salvo que ya se haya pintado algo más reciente.
        if (token < appliedToken) return;
        appliedToken = token;
        state.landError = null;
        applyLand(L);
    } catch (err) {
        if (token < appliedToken) return;
        appliedToken = token;
        state.landError = err;
    } finally {
        clearTimeout(slow);
    }
    map.setLayoutProperty('live-points', 'visibility', liveVisible(ybp) ? 'visible' : 'none');
    if (!currentFocus && SEL.keepYbp !== ybp) hideInfo();   // el panel describía otra época (salvo la ficha recuperada al entrar, que es de esta)
    renderStatus();
    prefetchPaleo();
}

/* Fronteras: 1-3,6 MB por instantánea. Si ya están en memoria se aplican al instante;
   si hay que descargarlas, se espera a que el slider se detenga. Mientras tanto SE MANTIENE la instantánea anterior (con su imagen de
   franjas y sus nombres) y el estado lo dice: quitarla dejaba ver el mapa sin política entre dos mapas coloreados. Se sustituye de golpe
   al llegar la nueva; clic y resaltado quedan inactivos mientras tanto (serían de otra época). */
let bordersToken = 0;
let bordersCtl = null;
let bordersTimer = null;

function scheduleBorders(immediate) {
    clearTimeout(bordersTimer);
    if (bordersCached(state.ybp) !== undefined) {
        state.bordersLoading = false;
        runBorders();
        return;
    }
    // Hay que descargar: el mapa politico anterior (fronteras, color, nombres) SE QUEDA hasta que llegue el nuevo, y se sustituye de golpe.
    // Quitarlo dejaba ver 0,3-2 s el mapa sin politica (tierra lisa o relieve de NASA) entre dos mapas coloreados. El estado dice que se esta
    // enseñando la instantanea anterior y la ficha de un pais (clic, resaltado) se desactiva mientras tanto: seria de otra epoca.
    state.bordersLoading = true;
    setHoverKey(null);
    naturalView();
    renderStatus();
    bordersTimer = setTimeout(runBorders, immediate ? 0 : CFG.bordersDebounceMs);
}

async function runBorders() {
    const token = ++bordersToken;
    if (bordersCtl) bordersCtl.abort();
    bordersCtl = new AbortController();
    try {
        const b = await loadBorders(state.ybp, bordersCtl.signal);
        if (token !== bordersToken) return;
        state.bordersError = null;
        applyBorders(b);
    } catch (err) {
        if (token !== bordersToken || (err && err.name === 'AbortError')) return;
        state.bordersError = err;
        applyBorders(null);
    }
    state.bordersLoading = false;
    naturalView();   // si no llegaron fronteras (error, sin datos), la imagen que se retuvo vuelve
    if (currentFocus) { const f = currentFocus; currentFocus = null; focusPolity(f); } else selRestorePolity();
    renderStatus();
    prefetchNeighbours(state.borders);
}

/* Precarga en segundo plano (sin bloquear nada y respetando "ahorro de datos"). */
const saveData = () => Boolean(navigator.connection && navigator.connection.saveData);
const whenIdle = (fn) => (window.requestIdleCallback ? window.requestIdleCallback(fn, { timeout: 4000 }) : setTimeout(fn, 1500));
let paleoPrefetched = false;

// Las 81 lonchas de costas pesan unos 10 MB en total: tras la primera escena se bajan, de la más
// cercana a la época actual hacia las más lejanas, y el slider deja de esperar a la red.
function prefetchPaleo() {
    if (paleoPrefetched || saveData() || !state.paleo) return;
    paleoPrefetched = true;
    whenIdle(async () => {
        const target = Math.max(0, state.ybp / 1e6);
        const urls = state.paleo.ages.slice()
            .sort((x, y) => Math.abs(x.age_ma - target) - Math.abs(y.age_ma - target))
            .map((a) => CFG.paleoBase + a.file);
        let i = 0;
        const worker = async () => {
            while (i < urls.length) {
                try { await getJSON(urls[i++]); } catch (err) { /* se pedirá bajo demanda */ }
            }
        };
        await Promise.all([worker(), worker()]);
    });
}

// Las dos instantáneas vecinas de la que se está viendo (hay 54 de 1-3,6 MB: no se bajan todas).
function prefetchNeighbours(b) {
    if (!b || saveData() || !state.polities) return;
    const near = state.polities.filter((p) => p.year !== b.year)
        .sort((x, y) => Math.abs(x.year - b.year) - Math.abs(y.year - b.year)).slice(0, 4);
    whenIdle(() => near.forEach((p) => {
        const url = CFG.hbBase + 'geojson/' + p.file;
        if (!cache.has(url)) getJSON(url).catch(() => {});
    }));
}

let sceneTimer = null;
let lastScene = 0;
// Aplica el primer cambio de inmediato y, mientras se arrastra, como mucho una vez cada throttleMs
// con el valor más reciente (antes se esperaba a que el slider se parase).
function scheduleScene() {
    if (sceneTimer) return;   // ya hay una actualización en cola y leerá el valor más reciente
    const wait = Math.max(0, CFG.throttleMs - (performance.now() - lastScene));
    sceneTimer = setTimeout(() => { sceneTimer = null; lastScene = performance.now(); updateScene(); }, wait);
}

let prefTimer = null;
const timePrefs = () => ({ ybp: state.ybp, jd: clockUsable() ? Math.round(clock.jd * 86400) / 86400 : undefined });
const rememberTime = () => { clearTimeout(prefTimer); prefTimer = setTimeout(() => { prefTimer = null; savePrefs(timePrefs()); }, 400); };
window.addEventListener('pagehide', () => { clearTimeout(prefTimer); prefTimer = null; savePrefs(timePrefs()); });

function setTime(ybp, { fromSlider = false, immediate = false, persist = true, fromClock = false } = {}) {
    state.ybp = Math.min(Math.max(ybp, 1 - OFFSET), CFG.maxYbp);
    if (!fromClock) clockFromYear(ybpToYear(state.ybp));
    if (persist) rememberTime();
    if (!fromSlider) $('slider').value = ybpToSlider(state.ybp);
    if (document.activeElement !== $('time-input')) $('time-input').value = '';
    const f = formatTime(state.ybp);
    $('time-label').textContent = f.main;
    $('time-sub').textContent = f.sub; $('time-sub').title = f.sub;
    eraUpdate(ybpToYear(state.ybp));
    builtTimeApply();
    if (immediate) { clearTimeout(sceneTimer); sceneTimer = null; lastScene = performance.now(); updateScene({ immediate: true }); } else scheduleScene();
    if (!fromClock) clockChanged();
    detailApply();
}

/* ------------------------------------------------------------------ */
/* Selección y búsqueda                                               */
/* ------------------------------------------------------------------ */
function clearHighlight() {
    setHighlightKey(null);
}

function bboxOf(features) {
    let minX = 180, minY = 90, maxX = -180, maxY = -90;
    const walk = (c) => { if (typeof c[0] === 'number') { minX = Math.min(minX, c[0]); maxX = Math.max(maxX, c[0]); minY = Math.min(minY, c[1]); maxY = Math.max(maxY, c[1]); } else c.forEach(walk); };
    features.forEach((f) => f.geometry && walk(f.geometry.coordinates));
    return minX <= maxX ? [[minX, minY], [maxX, maxY]] : null;
}

/** Donde «esta» una entidad politica: el punto de su nombre en el mapa (dentro de su poligono mayor), o el centro de su extension. */
// Se mira el poligono mayor que no este en un casquete polar (|lat| < 66°): la Union de Kalmar incluye Groenlandia, que es su poligono mas
// grande, pero su sitio es Escandinavia. Si todos son polares (Groenlandia sola), el mayor.
function polityCenterOf(feats, name) {
    if (!feats.length) return null;
    try {
        if (window.ChronosLabels) {
            const parts = []; feats.forEach((f) => { const g = f.geometry; if (!g) return; (g.type === 'MultiPolygon' ? g.coordinates : g.type === 'Polygon' ? [g.coordinates] : []).forEach((c) => parts.push({ type: 'Feature', properties: { k: parts.length }, geometry: { type: 'Polygon', coordinates: c } })); });
            const ls = ChronosLabels.polityLabels({ type: 'FeatureCollection', features: parts }, (f) => 'p' + f.properties.k, () => name);   // uno por poligono, de mayor a menor
            const l = ls.find((x) => Math.abs(x.lat) < 66) || ls[0]; if (l) return [l.lng, l.lat];
        }
    } catch (e) { /* abajo */ }
    const box = bboxOf(feats); return box ? [(box[0][0] + box[1][0]) / 2, (box[0][1] + box[1][1]) / 2] : null;
}
/** Lo mismo, con el mapa de la fecha ybp (se carga si hace falta; queda en cache para cuando se cambie la fecha). */
async function polityCenterAt(name, ybp) {
    const b = await loadBorders(ybp); if (!b || !b.data) return null;
    return polityCenterOf(b.data.features.filter((f) => f.properties.NAME === name), name);
}
function focusPolity(name) {
    if (!state.borders) return;
    const feats = state.borders.data.features.filter((f) => f.properties.NAME === name);
    if (!feats.length) return;
    setHighlightKey(polityKey(feats[0].properties));
    // centrar sin acercar ni alejar (como el buscador): giro breve hasta donde va su nombre; si el buscador ya giro hasta alli, no se mueve
    const c = polityCenterOf(feats, name); const p = map.getCenter();
    if (c && (Math.abs(p.lng - c[0]) > 1e-4 || Math.abs(p.lat - c[1]) > 1e-4)) map.easeTo({ center: c, duration: SRCH_REDUCED() ? 0 : 700, easing: SRCH_EASE, essential: true });
    showPolity(feats[0].properties); SEL.keepYbp = state.ybp;     // la ficha es de esta fecha: lo que aun se este cargando de ella no la cierra
}

function showPolity(p) {
    if (state.borders && state.borders.source === 'ne') {
        const m = state.borders.meta;
        const rows = [{ label: t('evidence'), badge: 'documentary', note: t('neNote') }];
        if (p.SUBJECTO && p.SUBJECTO !== p.NAME) rows.push({ label: t('power'), value: p.SUBJECTO });
        if (p.TYPE) rows.push({ label: t('typeLabel'), value: p.TYPE });
        rows.push({ label: t('resolution'), value: '~' + nf().format(m.segment_median_km) + ' km (' + nf().format(m.segment_p90_km) + ' km p90)' });
        if (p.WIKIDATAID) rows.push({ label: 'Wikidata', value: p.WIKIDATAID, href: 'https://www.wikidata.org/wiki/' + p.WIKIDATAID });
        rows.push({ label: t('source'), value: 'Natural Earth 10m', href: 'https://www.naturalearthdata.com/' });
        rows.push({ label: t('license'), value: lang === 'es' ? 'Dominio público' : 'Public domain' });
        showInfo((lang === 'es' && p.NAME_ES) || p.NAME || t('unnamed'), rows);
        return;
    }
    const rows = [{ label: t('evidence'), badge: 'reconstruction', note: t('bordersNote') }];
    if (p.SUBJECTO && p.SUBJECTO !== p.NAME) rows.push({ label: t('power'), value: p.SUBJECTO });
    if (p.PARTOF) rows.push({ label: t('parent'), value: p.PARTOF });
    if (p.BORDERPRECISION) rows.push({ label: t('precision'), value: t('prec.' + p.BORDERPRECISION) || p.BORDERPRECISION });
    if (state.borders) rows.push({ label: t('snapshotLabel'), value: formatYear(state.borders.year) });
    rows.push({ label: t('source'), value: 'historical-basemaps', href: 'https://github.com/aourednik/historical-basemaps' });
    showInfo(p.NAME || t('unnamed'), rows);
}

function showCoast(props) {
    const L = state.land;
    if (L && L.type === 'paleo') {
        const isMargin = props && props.kind === 'margin';
        showInfo(isMargin ? t('paleoMargin') : (props && props.name) || t('paleoTitle'), [
            { label: t('evidence'), badge: 'reconstruction', note: isMargin ? t('paleoMarginNote') : t('paleoNote') },
            { label: t('slice'), value: L.ma + ' Ma' },
            { label: t('source'), value: 'PaleoMAP PaleoCoastlines (Kocsis & Scotese)', href: 'https://doi.org/10.5281/zenodo.7994000' },
            { label: t('license'), value: 'CC BY 4.0' }
        ]);
        return;
    }
    const ma = L && L.deep ? L.ma + ' Ma' : t('today');
    showInfo(t('coastTitle'), [
        { label: t('evidence'), badge: 'model', note: t('coastNote') },
        { label: t('model'), value: CFG.model },
        { label: t('age'), value: ma },
        { label: t('source'), value: 'GPlates Web Service', href: 'https://www.gplates.org/' }
    ]);
}

function showLive(p) {
    const rows = [{ label: t('evidence'), badge: 'documentary' }];
    rows.push({ label: t('tier'), value: p.tier || t('unknown') });
    rows.push({ label: t('event'), value: p.timestamp && p.timestamp !== 'Indeterminado' ? String(p.timestamp).slice(0, 10) : t('unknown') });
    if (p.harvest_date) rows.push({ label: t('harvested'), value: String(p.harvest_date).slice(0, 10) });
    const q = String(p.source || '').split(':')[1] || '';
    if (/^Q\d+$/.test(q)) rows.push({ label: t('source'), value: p.source, href: 'https://www.wikidata.org/wiki/' + q });
    showInfo(p.name || t('liveTitle'), rows);
}

// Remarcar al pasar: el contorno del pais bajo el cursor (solo sus fronteras terrestres, como el resaltado de la seleccion)
let hoverKey = null; let hoverRaf = 0; let hoverPt = null;
function setHoverKey(key) {
    if (key === hoverKey) return;
    hoverKey = key;
    if (map.getLayer('borders-hover')) map.setFilter('borders-hover', ['==', ['get', 'key'], key || '\u0000']);
}
function hoverUpdate() {
    hoverRaf = 0;
    const e = hoverPt; if (!e || !map.getLayer('borders-fill') || BR.cut || bordersStale() || pointInSky(e.x, e.y)) { setHoverKey(null); return; }
    const hit = map.queryRenderedFeatures(e, { layers: ['events-circle', 'live-points', 'borders-fill'] })[0];
    const key = hit && hit.layer.id === 'borders-fill' ? polityKey(hit.properties) : null;
    setHoverKey(key && key !== GAP.sel ? key : null);
}
map.on('mousemove', (e) => { hoverPt = e.point; if (!hoverRaf) hoverRaf = requestAnimationFrame(hoverUpdate); if (!EVH.raf) EVH.raf = requestAnimationFrame(evHoverUpdate); });
/* Suceso bajo el raton (solo con raton: en pantallas tactiles no hay «pasar por encima») */
const EVH = { id: null, raf: 0, coords: null };
const evColor = (icon) => { const c = ChronosEventIcons.COLORS[icon] || '#888888'; const st = evIconStyle(); return st && st.tint.amt > 0 ? ChronosEras.mix(c, st.tint.color, Math.min(st.tint.amt, 0.35)) : c; };
function evHoverSet(f) {
    const id = f ? f.properties.id : null; if (id === EVH.id) return;
    EVH.id = id; EVH.coords = f && f.geometry ? f.geometry.coordinates.slice() : null;
    const src = map.getSource('events-hover');
    if (src) src.setData(f ? { type: 'FeatureCollection', features: [{ type: 'Feature', geometry: f.geometry, properties: f.properties }] } : emptyFC());
    const chip = $('ev-hover');
    if (!f) { chip.hidden = true; return; }
    chip.textContent = f.properties.name || ''; chip.style.setProperty('--ev', evColor(f.properties.icon)); chip.hidden = !chip.textContent;
    evHoverPlace();
}
// La etiqueta va a la derecha del icono; si no cabe (movil, icono cerca del borde), a su izquierda; si tampoco (nombre largo en pantalla
// estrecha), debajo y centrada. Nunca encima del icono ni fuera de la pantalla (antes se salia por la derecha).
function chipPlace(chip, p, dx) {
    const w = chip.offsetWidth || 0; const W = map.getContainer().clientWidth;
    let x = p.x + dx; let y = p.y - 11;
    if (x + w > W - 6) {
        if (p.x - dx - w >= 6) x = p.x - dx - w;
        else { x = Math.max(6, Math.min(p.x - w / 2, W - 6 - w)); y = p.y + 16; }
    }
    chip.style.transform = 'translate(' + Math.round(x) + 'px,' + Math.round(y) + 'px)';
}
function evHoverPlace() {
    if (!EVH.coords) return; chipPlace($('ev-hover'), map.project(EVH.coords), 18);
}
function evHoverUpdate() {
    EVH.raf = 0;
    const e = hoverPt;
    if (!e || !map.getLayer('events-circle') || solarView.isOpen) { evHoverSet(null); if (typeof buHoverSet === 'function') buHoverSet(null); spotHover(null); return; }
    const ev = map.queryRenderedFeatures(e, { layers: ['events-circle'] })[0] || null;
    evHoverSet(ev);
    const bu = !ev && BUILT.on && map.getLayer('built-icons') ? map.queryRenderedFeatures(e, { layers: ChronosBuilt.LAYER_IDS })[0] || null : null;
    if (typeof buHoverSet === 'function') buHoverSet(bu);
    // pasar por un icono tambien atenua los demas (como al recorrer la lista del buscador)
    spotHover(ev ? ev.properties.id : bu ? bu.properties.id : null);
}
map.on('move', evHoverPlace);
// Al salir el raton del mapa se apaga lo que señalaba EL RATON. Si el raton no estaba en el mapa (p. ej. sobre la lista del buscador), la señal
// es la del destino del buscador y se queda: Chrome manda 'mouseleave' sueltos cuando cambia lo que hay bajo el puntero (fundido de epoca).
map.getCanvas().addEventListener('mouseleave', () => { const was = hoverPt; hoverPt = null; setHoverKey(null); spotHover(null); if (!was) return; evHoverSet(null); if (typeof buHoverSet === 'function') buHoverSet(null); });
map.on('dragstart', () => { hoverPt = null; setHoverKey(null); });

/* ------------------------------------------------------------------ */
/* Foco: un elemento a plena opacidad y los demas iconos atenuados        */
/* ------------------------------------------------------------------ */
// Al elegir (o pasar el raton por) un resultado del buscador, el resto de iconos de sucesos y construcciones baja de opacidad para que el
// elegido se vea solo. Cada capa registra aqui su opacidad base (spotSet) y el foco la multiplica: ['case', id == foco, 1, SPOT.dim].
// Con zoom, MapLibre exige ['zoom'] arriba del todo: el factor se mete en cada salida del step/interpolate, no alrededor.

async function runSearch(raw) {
    const q = raw.trim().toLowerCase();
    if (!q) return;
    try {
        const polities = await loadPolities();
        const hits = [];
        const matches = new Map();
        polities.forEach((p) => p.names.forEach((n) => {
            if (n && n.toLowerCase().includes(q)) { hits.push({ p, n }); matches.set(n, (matches.get(n) || 0) + 1); }
        }));
        if (hits.length) {
            // Mejor coincidencia: nombre exacto, si no el más corto
            const names = [...matches.keys()].sort((a, b) => (a.toLowerCase() === q ? -1 : b.toLowerCase() === q ? 1 : a.length - b.length));
            const name = names[0];
            const candidates = hits.filter((h) => h.n === name).map((h) => h.p);
            const here = ybpToYear(state.ybp);
            const best = candidates.reduce((a, b) => (Math.abs(a.year - here) <= Math.abs(b.year - here) ? a : b));
            setStatus('ok', fmt('found', { n: name, c: candidates.length, y: formatYear(best.year) }));

        setStatus('warn', fmt('bordersFail', { err: err.message }));
        return;

    if (live) {
        setTime(0 - (CFG.nowYear - CFG.present), { immediate: true });
        map.easeTo({ center: live.geometry.coordinates, duration: 700, essential: true });   // centrar sin cambiar el zoom
        showLive(live.properties);
        return;
    }
    setStatus('warn', fmt('noResults', { q: raw.trim() }));
}

    const c = map.getCenter().wrap();
    sky.lat = Math.round(Math.max(-90, Math.min(90, c.lat)) * 1000) / 1000;
    sky.lon = Math.round(c.lng * 1000) / 1000;
    if (document.activeElement !== $('sky-lat')) $('sky-lat').value = sky.lat;
    if (document.activeElement !== $('sky-lon')) $('sky-lon').value = sky.lon;

async function preLoad() {
    if (pre.state !== 'idle') return;
    pre.state = 'loading';
    try {
        const [stars, s3, ltpDoc, con] = await Promise.all([getJSON('./data/sky/stars.json'), getJSON('./data/sky/stars3d.json'), getJSON('./data/sky/ltp.json'), getJSON('./data/sky/constellations.json').catch(() => null)]);
        const cat = ChronosStars3D.buildCatalogue(stars, s3);
        const inst = ChronosPrehistory.create({ ltpTables: ltpDoc.tables, cat });
        const byHip = new Map(); for (let i = 0; i < cat.n; i++) byHip.set(cat.hip[i], i);
        const constellations = con && Array.isArray(con.constellations)
            ? con.constellations.map((c) => ({ id: c.id, la: c.la, en: c.en, es: c.es, lines: c.lines.map(([a, b]) => [byHip.get(a), byHip.get(b)]).filter(([a, b]) => a !== undefined && b !== undefined) })) : [];

// Las estrellas se mueven < 1" al dia: ra/dec/magnitud se recalculan como mucho una vez al dia de reloj; el angulo de rotacion (ERA), siempre.
function preFrame(jd) {
    if (pre.state !== 'ready') return null;
    if (!pre.res || Math.abs(jd - pre.fullJD) > 1) {

        const dt = (time.tt - time.ut) * 86400;
        pre.res = pre.inst.at(jd, dt); pre.res.dtSeconds = dt; pre.view.mag.set(pre.res.mag); pre.fullJD = jd;

    pre.res.era = pre.inst.frame.era(jd - ChronosSky.J2000_JD);

// Error medido frente a Horizons en el anio muestreado mas cercano al que se esta viendo.
function skyAccuracyText(year) {
    const v = sky.validation;
    if (!v) return t('sky.noValidation');
    const years = [...new Set(v.cases.map((c) => c.year))];
    const y = years.reduce((a, b) => (Math.abs(b - year) < Math.abs(a - year) ? b : a));
    const at = v.cases.filter((c) => c.year === y);
    const max = (ids) => Math.max(...at.filter((c) => ids.includes(c.body)).map((c) => c.error_arcsec));
    const planets = ['Mercury', 'Venus', 'Mars', 'Jupiter', 'Saturn', 'Uranus', 'Neptune'];
    // segundos de arco, minutos de arco o grados segun el tamano del error
    const f = (n) => {
        if (!Number.isFinite(n)) return '?';
        if (n < 120) return nf().format(Math.round(n * 10) / 10) + '\u2033';
        if (n < 7200) return nf().format(Math.round(n / 6) / 10) + '\u2032';
        return nf().format(Math.round(n / 360) / 10) + '\u00b0';
    };
    return fmt('sky.accuracy', { y: formatYear(y), sun: f(max(['Sun'])), moon: f(max(['Moon'])), planet: f(max(planets)) });
}

function moonPhaseName(angle) {

    return t('sky.phase.' + k[Math.floor(((angle + 22.5) % 360) / 45)]);

function skyErrorText(e) {

        date: u.day + ' ' + monthName(u.month) + ' ' + formatYear(u.year), cal: t('sky.cal.' + u.calendar),
        ut: pad2(u.hour) + ':' + pad2(u.minute) + ':' + pad2(Math.floor(u.second)), dt: nf().format(Math.round(res.deltaTSeconds))

    sky.drawn = ChronosSkyView.draw($('sky-chart'), res, {

        const up = b.alt > 0;
        const label = t('sky.body.' + b.id) + (b.id === 'Moon' ? ' · ' + moonPhaseName(b.phaseAngle) + ' ' + Math.round(b.phaseFraction * 100) + ' %' : '');

            el('td', { text: compass(b.az) + ' ' + Math.round(b.az) + '°' }),
