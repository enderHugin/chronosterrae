<!-- index.html -->
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChronosTerrae | Evolutionary Cartography</title>
    <meta name="description" content="Deep-time cartography: travel the Earth from 1,000 million years ago to today.">

    <script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css" rel="stylesheet" />

    <style>
        :root {
            --bg: #f3efe4;
            --panel: rgba(250, 246, 235, 0.92);
            --text: #2b2118;
            --muted: #6b5d4d;
            --accent: #8b5a2b;
            --ok: #2e7d32;
            --warn: #b7791f;
            --err: #c62828;
            --font: 'Georgia', serif;
            --font-ui: system-ui, -apple-system, 'Segoe UI', sans-serif;
        }
        body.dark {
            --bg: #101418;
            --panel: rgba(20, 24, 29, 0.92);
            --text: #e6e2d8;
            --muted: #9a9486;
            --accent: #d9a566;
        }

        html, body { width: 100%; height: 100%; margin: 0; }
        body {
            background: var(--bg); color: var(--text); font-family: var(--font-ui);
            overflow: hidden; transition: background 0.4s ease, color 0.4s ease;
        }

        /* El contenedor necesita alto explícito o colapsa a 0x0 y el mapa no se ve */
        #map { position: absolute; inset: 0; width: 100%; height: 100%; }

        .panel {
            background: var(--panel); color: var(--text);
            border: 1px solid var(--accent); border-radius: 8px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.25);
            backdrop-filter: blur(8px);
        }

        #top-left { position: absolute; top: 14px; left: 14px; z-index: 10; display: flex; gap: 8px; flex-wrap: wrap; max-width: calc(100% - 200px); }
        #top-right { position: absolute; top: 14px; right: 14px; z-index: 10; display: flex; gap: 6px; }

        .btn {
            background: var(--panel); color: var(--text); border: 1px solid var(--accent); border-radius: 6px;
            padding: 8px 11px; cursor: pointer; font: 600 13px var(--font-ui);
        }
        .btn:hover { background: var(--accent); color: var(--bg); }
        .btn:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

        #search {
            width: 260px; max-width: 100%; padding: 8px 12px; border: 1px solid var(--accent); border-radius: 6px;
            background: var(--panel); color: var(--text); font: 600 13px var(--font-ui);
        }

        #status {
            position: absolute; left: 14px; bottom: 168px; z-index: 12; max-width: 360px; padding: 8px 12px;
            font-size: 12px; line-height: 1.4; border-left: 4px solid var(--muted); display: none;
        }
        #status.visible { display: block; }
        #status.ok { border-left-color: var(--ok); }
        #status.warn { border-left-color: var(--warn); }
        #status.error { border-left-color: var(--err); }

        #info {
            position: absolute; top: 60px; right: 14px; width: 310px; max-width: calc(100% - 28px);
            max-height: calc(100% - 260px); overflow: auto; padding: 14px 16px; z-index: 10; display: none;
        }
        #info h2 { margin: 0 0 6px; font: 700 18px var(--font); color: var(--accent); }
        #info .row { margin-top: 7px; font-size: 13px; line-height: 1.4; word-break: break-word; }
        #info .row b { color: var(--accent); }
        #info a { color: var(--accent); }
        #info .close { position: absolute; top: 6px; right: 8px; background: none; border: none; color: var(--muted); font-size: 18px; cursor: pointer; }

        .badge { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 11px; font-weight: 700; color: #fff; }
        .badge.measurement, .badge.documentary, .badge.artefact { background: #2e7d32; }
        .badge.model { background: #1565c0; }
        .badge.reconstruction { background: #b7791f; }
        .badge.speculation { background: #8e24aa; }

        #timeline { position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%); width: min(94%, 980px); padding: 12px 18px 8px; z-index: 10; box-sizing: border-box; }
        #time-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
        #time-label { font: 700 24px var(--font); min-width: 190px; }
        #time-sub { font-size: 12px; color: var(--muted); }
        #time-input { width: 130px; padding: 6px 9px; border: 1px solid var(--accent); border-radius: 6px; background: transparent; color: var(--text); font: 600 13px var(--font-ui); }
        #slider { width: 100%; margin: 8px 0 2px; accent-color: var(--accent); }
        #presets { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 4px; }
        #presets .btn { padding: 4px 9px; font-size: 12px; }
        #credits { font-size: 10.5px; color: var(--muted); line-height: 1.35; margin-top: 4px; }
        #credits a { color: var(--muted); }
        .kofi { background: #29abe0; color: #fff; text-decoration: none; padding: 6px 12px; border-radius: 6px; font: 700 13px var(--font-ui); }

        [hidden] { display: none !important; }
        #space { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
        /* Sistema solar: pantalla propia sobre el mapa (el mapa sigue debajo, oculto, y vuelve al salir) */
        #solar { position: absolute; inset: 0; z-index: 6; background: #03050b; }
        #solar[hidden] { display: none; }
        #solar-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
        #solar-canvas:active { cursor: grabbing; }
        #solar-chips { position: absolute; top: 56px; left: 14px; z-index: 7; display: flex; gap: 5px; flex-wrap: wrap; max-width: calc(100% - 28px); }
        #solar-chips .btn { padding: 4px 9px; font-size: 12px; }
        #solar-chips .btn.on { background: var(--accent); color: var(--bg); }
        #solar-info { position: absolute; top: 100px; left: 14px; z-index: 7; width: 290px; max-width: calc(100% - 28px); padding: 10px 14px 12px; box-sizing: border-box; }
        #solar-info h2 { margin: 0 0 4px; font: 700 18px var(--font); color: var(--accent); }
        #solar-info .solar-lines div { font-size: 12px; line-height: 1.45; margin-top: 3px; }
        #solar-zoom { width: 100%; margin: 10px 0 8px; accent-color: var(--accent); }
        #solar-back { padding: 4px 10px; font-size: 12px; }
        #solar-note { position: absolute; left: 14px; bottom: 168px; z-index: 7; max-width: 360px; padding: 8px 12px; font-size: 11.5px; line-height: 1.4; border-left: 4px solid #1565c0; }
        body.solar-on #map, body.solar-on #space, body.solar-on #space-note, body.solar-on #status, body.solar-on #info { visibility: hidden; pointer-events: none; }
        @media (max-width: 760px) { #solar-info { top: 130px; width: 250px; } #solar-note { display: none; } }
        #space-note { position: absolute; top: 56px; left: 50%; transform: translateX(-50%); z-index: 5; font-size: 11.5px; color: #9aa6c0; pointer-events: none; text-align: center; max-width: 80%; }
        .btn[aria-pressed="false"] { opacity: 0.6; }
        #clock { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
        #clock-time { font: 700 15px var(--font-ui); font-variant-numeric: tabular-nums; }
        #clock-sub { font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
        #clock-controls { display: flex; gap: 6px; align-items: center; margin-top: 2px; flex-wrap: wrap; }
        #clock-controls .btn { padding: 3px 10px; font-size: 12px; }
        #clock-rate { padding: 3px 6px; border: 1px solid var(--accent); border-radius: 6px; background: transparent; color: var(--text); font: 600 12px var(--font-ui); }
        #clock-rate option { color: #222; }
        #events { position: absolute; top: 60px; left: 14px; width: 344px; max-width: calc(100% - 28px); max-height: calc(100% - 300px); overflow: auto; padding: 12px 14px 10px; z-index: 11; display: none; box-sizing: border-box; }
        #events.open { display: block; }
        #events h2 { margin: 0 0 6px; font: 700 17px var(--font); color: var(--accent); padding-right: 22px; }
        #events .close { position: absolute; top: 6px; right: 8px; background: none; border: none; color: var(--muted); font-size: 18px; cursor: pointer; }
        #events-verif { margin: 6px 0 4px; font-size: 12.5px; }
        #events-verif summary { cursor: pointer; font-weight: 600; }
        #events-verif label { display: flex; gap: 7px; align-items: flex-start; padding: 2px 0; line-height: 1.3; }
        #events-verif .vf-n { color: var(--muted); }
        #events-verif .vf-sep { margin: 6px 0 2px; color: var(--muted); font-size: 11.5px; }
        #events-list { list-style: none; margin: 6px 0; padding: 0; }
        #events-list li { display: grid; grid-template-columns: 12px 1fr; gap: 0 8px; padding: 6px 4px; border-top: 1px solid rgba(128, 128, 128, 0.25); cursor: pointer; font-size: 13px; }
        #events-list li:hover, #events-list li:focus { background: rgba(128, 128, 128, 0.12); outline: none; }
        .ev-dot { width: 10px; height: 10px; border-radius: 50%; margin-top: 4px; grid-row: 1 / span 2; }
        .ev-name { font-weight: 600; }
        .ev-when { grid-column: 2; font-size: 11.5px; color: var(--muted); }
        #events-note { font-size: 11.5px; color: var(--muted); line-height: 1.4; }
        #toasts { position: absolute; top: 96px; left: 50%; transform: translateX(-50%); z-index: 13; display: flex; flex-direction: column; gap: 8px; width: min(92%, 520px); pointer-events: none; }
        .toast { pointer-events: auto; display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: var(--panel); color: var(--text); border: 1px solid var(--accent); border-radius: 8px; box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3); cursor: pointer; font-size: 14px; line-height: 1.35; }
        .toast-dot { width: 12px; height: 12px; border-radius: 50%; flex: none; }
        .toast-text { flex: 1; font-variant-numeric: tabular-nums; }
        .toast-x { background: none; border: none; color: var(--muted); font-size: 18px; cursor: pointer; }
        #sky { position: absolute; top: 60px; left: 14px; width: 344px; max-width: calc(100% - 28px); max-height: calc(100% - 300px); overflow: auto; padding: 12px 14px 10px; z-index: 11; display: none; box-sizing: border-box; }
        #sky.open { display: block; }
        #sky h2 { margin: 0 0 6px; font: 700 17px var(--font); color: var(--accent); padding-right: 22px; }
        #sky .close { position: absolute; top: 6px; right: 8px; background: none; border: none; color: var(--muted); font-size: 18px; cursor: pointer; }
        #sky-chart { width: 100%; aspect-ratio: 1; display: block; color: var(--text); cursor: crosshair; }
        #sky-when { font-size: 12px; color: var(--muted); margin: 4px 0 8px; line-height: 1.35; }
        #sky-range, #sky-error { font-size: 12px; line-height: 1.4; margin: 6px 0; }
        #sky-error { color: var(--err); }
        .sky-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 10px; font-size: 11.5px; margin-top: 6px; }
        .sky-grid label { display: flex; flex-direction: column; gap: 2px; color: var(--muted); }
        .sky-grid select, .sky-grid input[type="number"], .sky-grid input[type="time"] { padding: 4px 6px; border: 1px solid var(--accent); border-radius: 5px; background: transparent; color: var(--text); font: 600 13px var(--font-ui); width: 100%; box-sizing: border-box; }
        .sky-grid select option { color: #222; }
        .sky-grid .wide { grid-column: 1 / -1; }
        .sky-grid .check { flex-direction: row; align-items: center; gap: 6px; }
        .sky-actions { display: flex; gap: 8px; align-items: center; margin-top: 8px; flex-wrap: wrap; }
        .sky-actions .btn { padding: 4px 10px; font-size: 12px; }
        .sky-toggles { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; }
        #sky-twilight { font-size: 12px; margin-top: 8px; }
        #sky-list { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 6px; }
        #sky-list th { text-align: left; color: var(--muted); font-weight: 600; padding: 2px 4px; }
        #sky-list td { padding: 2px 4px; border-top: 1px solid rgba(128, 128, 128, 0.25); }
        #sky-list tr.down { opacity: 0.55; }
        #sky-note, #sky-accuracy, #sky-stars-note { font-size: 11px; color: var(--muted); line-height: 1.4; margin-top: 6px; }

        @media (max-width: 640px) {
            #sky { top: 108px; right: 14px; width: auto; max-height: calc(100% - 330px); }
            #top-left { max-width: 100%; top: 56px; }
            #time-label { font-size: 19px; min-width: 0; }
            #info { top: 108px; max-height: calc(100% - 330px); }
            #status { bottom: 222px; }
        }
    </style>
</head>
<body>

    <canvas id="space" aria-hidden="true"></canvas>
    <div id="map"></div>
    <div id="space-note" role="status"></div>
    <div id="solar" hidden></div>

    <div id="top-left">
        <input id="search" type="search" data-i18n-placeholder="searchPlaceholder" aria-label="Search" autocomplete="off">
    </div>

    <div id="top-right">
        <button class="btn" id="btn-events" type="button" aria-pressed="false" data-i18n="events.button"></button>
        <button class="btn" id="btn-space" type="button" aria-pressed="true" data-i18n="space.button"></button>
        <button class="btn" id="btn-solar" type="button" aria-pressed="false" data-i18n="solar.button"></button>
        <button class="btn" id="btn-sky" type="button" data-i18n="sky.button"></button>
        <button class="btn" id="btn-lang" type="button">EN / ES</button>
        <button class="btn" id="btn-theme" type="button">Dark</button>
    </div>

    <div id="events" class="panel" role="region" aria-label="Events">
        <button class="close" id="events-close" type="button" aria-label="Close">&times;</button>
        <h2 data-i18n="events.title"></h2>
        <details id="events-verif" open><summary data-i18n="events.verif.title"></summary><div id="events-verif-box"></div></details>
        <ul id="events-list"></ul>
        <div id="events-note"></div>
    </div>

    <div id="toasts" aria-live="polite"></div>

    <div id="sky" class="panel" role="region" aria-label="Sky">
        <button class="close" id="sky-close" type="button" aria-label="Close">&times;</button>
        <h2 data-i18n="sky.title"></h2>
        <div id="sky-range"></div>
        <div id="sky-body">
            <canvas id="sky-chart" width="320" height="320"></canvas>
            <div id="sky-when"></div>
            <div id="sky-error"></div>
            <div class="sky-grid">
                <label><span data-i18n="sky.month"></span><select id="sky-month"></select></label>
                <label><span data-i18n="sky.day"></span><input id="sky-day" type="number" min="1" max="31" step="1"></label>
                <label><span data-i18n="sky.time"></span><input id="sky-time" type="time"></label>
                <label><span data-i18n="sky.calendar"></span>
                    <select id="sky-cal">
                        <option value="auto" data-i18n="sky.cal.auto"></option>
                        <option value="julian" data-i18n="sky.cal.julian"></option>
                        <option value="gregorian" data-i18n="sky.cal.gregorian"></option>
                    </select></label>
                <label class="check wide"><input id="sky-follow" type="checkbox" checked><span data-i18n="sky.follow"></span></label>
                <label><span data-i18n="sky.lat"></span><input id="sky-lat" type="number" min="-90" max="90" step="0.1"></label>
                <label><span data-i18n="sky.lon"></span><input id="sky-lon" type="number" min="-180" max="180" step="0.1"></label>
            </div>
            <div class="sky-actions">
                <button class="btn" id="sky-now" type="button" data-i18n="sky.now"></button>
                <span class="sky-toggles">
                    <label><input id="sky-t-stars" type="checkbox" checked> <span data-i18n="sky.stars"></span></label>
                    <label><input id="sky-t-names" type="checkbox" checked> <span data-i18n="sky.names"></span></label>
                    <label><input id="sky-t-lines" type="checkbox" checked> <span data-i18n="sky.lines"></span></label>
                    <label><input id="sky-t-day" type="checkbox"> <span data-i18n="sky.dayStars"></span></label>
                </span>
            </div>
            <div id="sky-twilight"></div>
            <table id="sky-list"><thead><tr><th></th><th data-i18n="sky.colAlt"></th><th data-i18n="sky.colAz"></th><th data-i18n="sky.colMag"></th><th></th></tr></thead><tbody id="sky-rows"></tbody></table>
            <div id="sky-stars-note"></div>
            <div id="sky-note"><span class="badge model" data-i18n="sky.model"></span> <span data-i18n="sky.note"></span></div>
            <div id="sky-accuracy"></div>
            <div id="sky-caption" data-i18n="sky.caption" style="font-size:11px;color:var(--muted);margin-top:6px"></div>
        </div>
    </div>

    <div id="info" class="panel" role="region" aria-live="polite">
        <button class="close" id="info-close" type="button" aria-label="Close">×</button>
        <h2 id="info-title"></h2>
        <div id="info-body"></div>
    </div>

    <div id="status" class="panel" role="status"></div>

    <div id="timeline" class="panel">
        <div id="time-row">
            <div>
                <div id="time-label">--</div>
                <div id="time-sub"></div>
            </div>
            <div id="clock" hidden>
                <div id="clock-time"></div>
                <div id="clock-sub"></div>
                <div id="clock-controls">
                    <button class="btn" id="clock-play" type="button"></button>
                    <select id="clock-rate"></select>
                    <button class="btn" id="clock-now" type="button" data-i18n="clock.now"></button>
                </div>
            </div>
            <input id="time-input" type="text" data-i18n-placeholder="timePlaceholder" aria-label="Go to a date" autocomplete="off">
            <a class="kofi" href="https://ko-fi.com/jaimeluisolguinmesina" target="_blank" rel="noopener" data-i18n="donate"></a>
        </div>
        <input id="slider" type="range" min="0" max="10000" value="0" step="1" aria-label="Time" dir="ltr">
        <div id="presets"></div>
        <div id="credits"></div>
    </div>

    <noscript>ChronosTerrae needs JavaScript.</noscript>

<script src="./vendor/astronomy-engine/astronomy.browser.min.js"></script>
<script src="./sky/sky.js"></script>
<script src="./sky/ltp.js"></script>
<script src="./sky/stars3d.js"></script>
<script src="./sky/prehistory.js"></script>
<script src="./sky/space.js"></script>
<script src="./sky/timed.js"></script>
<script src="./map/borders-gap.js"></script>
<script src="./map/borders-inner.js"></script>
<script src="./sky/sky-view.js"></script>
<script src="./sky/solar.js"></script>
<script src="./solar/solar-view.js"></script>
<script>
'use strict';

/* ------------------------------------------------------------------ */
/* Configuración                                                      */
/* ------------------------------------------------------------------ */
const CFG = {
    gplates: 'https://gws.gplates.org/reconstruct/coastlines/',
    model: 'MERDITH2021',               // el servicio no devuelve el modelo: lo fijamos y lo mostramos nosotros
    hbCommit: 'da7a4b735ecef70aebdc9c73e409d8a2500d50f3',
    present: 1950,                       // convención BP: el "presente" es 1950
    nowYear: 2026,
    maxYbp: 1e9,                         // límite del modelo de placas (1000 Ma)
    sliderMax: 10000,
    deepTimeFrom: 1e6,                   // desde 1 Ma se muestra la edad en Ma
    paleoBase: './data/paleocoastlines/',   // archivo propio: PaleoMAP PaleoCoastlines (CC BY 4.0), 0-535 Ma
    paleoMaxDeltaMa: 10,                 // no se usa una loncha mas lejana que esto
    neFromYear: 2016, neUrl: './data/borders/ne-10m-countries.json',   // fronteras vigentes (Natural Earth 10m) desde este año
    bordersMaxYbp: 125000,               // las fronteras históricas empiezan en -123000
    throttleMs: 80,                      // costas: ligeras, se actualizan mientras se arrastra el slider
    bordersDebounceMs: 300,              // fronteras: archivos de 1-3,6 MB, se piden cuando el slider se detiene
    fetchTimeoutMs: 40000
};
CFG.hbBase = 'https://cdn.jsdelivr.net/gh/aourednik/historical-basemaps@' + CFG.hbCommit + '/';
// offset para que el extremo "ahora" (2026 = 1950 - (-76)) sea el final (derecha) del slider
const OFFSET = CFG.nowYear - CFG.present + 1;

/* ------------------------------------------------------------------ */
/* Preferencias (cookie propia, sin seguimiento)                      */
/* ------------------------------------------------------------------ */
// Una sola cookie "ct_prefs" con idioma, tema, instante, centro y zoom. Se valida campo a campo al
// leerla: una cookie manipulada o antigua nunca puede romper la web, solo se ignora lo que no sirva.
const PREF_COOKIE = 'ct_prefs';
const parsePrefs = (raw) => {
    const out = {};
    let p;
    try { p = JSON.parse(raw); } catch (err) { return out; }
    if (!p || typeof p !== 'object') return out;
    if (p.lang === 'es' || p.lang === 'en') out.lang = p.lang;
    if (p.dark === 0 || p.dark === 1) out.dark = p.dark === 1;
    if (typeof p.ybp === 'number' && Number.isFinite(p.ybp) && p.ybp >= 1 - OFFSET && p.ybp <= CFG.maxYbp) out.ybp = Math.round(p.ybp);
    if (Array.isArray(p.c) && p.c.length === 2 && p.c.every((n) => typeof n === 'number' && Number.isFinite(n)) && Math.abs(p.c[0]) <= 180 && Math.abs(p.c[1]) <= 85) out.c = [p.c[0], p.c[1]];
    if (typeof p.z === 'number' && p.z >= 0 && p.z <= 22) out.z = p.z;
    if (p.sp === 0 || p.sp === 1) out.sp = p.sp === 1;
    if (Number.isInteger(p.vf) && p.vf >= 0 && p.vf <= 127) out.vf = p.vf;   // filtros de verificacion de sucesos (mascara de bits)
    if (typeof p.jd === 'number' && Number.isFinite(p.jd) && p.jd >= 900000 && p.jd <= 3000000) out.jd = p.jd;   // dia juliano UT del reloj
    return out;
};
const readPrefs = () => {
    try {
        const hit = document.cookie.split('; ').find((c) => c.startsWith(PREF_COOKIE + '='));
        return hit ? parsePrefs(decodeURIComponent(hit.slice(PREF_COOKIE.length + 1))) : {};
    } catch (err) { return {}; }
};
const prefs = readPrefs();
const savePrefs = (patch) => {
    Object.assign(prefs, patch);
    const raw = { lang: prefs.lang, dark: prefs.dark === undefined ? undefined : (prefs.dark ? 1 : 0), ybp: prefs.ybp, c: prefs.c, z: prefs.z, sp: prefs.sp === undefined ? undefined : (prefs.sp ? 1 : 0), jd: prefs.jd, vf: prefs.vf };
    try {
        document.cookie = PREF_COOKIE + '=' + encodeURIComponent(JSON.stringify(raw))
            + '; path=' + location.pathname.replace(/[^/]*$/, '') + '; max-age=31536000; SameSite=Lax'
            + (location.protocol === 'https:' ? '; Secure' : '');
    } catch (err) { /* sin cookies: la web funciona igual, solo que no recuerda */ }
};

                time: 'The time is proleptic UT: the sky is the one for the Earth\'s rotation (ERA) at that exact instant. ΔT = {dt} s ({days} days) is a theoretical extrapolation here: one day of error in ΔT equals ~1° of hour angle, so the real season of this date is not claimed.'
            }
        }
    }
};
let lang = prefs.lang || ((navigator.language || 'en').toLowerCase().startsWith('es') ? 'es' : 'en');
const t = (key) => key.split('.').reduce((o, k) => (o ? o[k] : undefined), i18n[lang]);
const fmt = (key, vars) => String(t(key)).replace(/\{(\w+)\}/g, (_, k) => (vars && vars[k] !== undefined ? vars[k] : ''));

/* ------------------------------------------------------------------ */
/* Tiempo: escala logarítmica de "ahora" a 1000 Ma                     */
/* ------------------------------------------------------------------ */
// Izquierda = el pasado más remoto (1000 Ma), derecha = hoy. El valor del slider crece hacia el presente.
const sliderToYbp = (s) => Math.round(Math.pow(CFG.maxYbp + OFFSET, (CFG.sliderMax - s) / CFG.sliderMax) - OFFSET);
const ybpToSlider = (ybp) => {
    const clamped = Math.min(Math.max(ybp, 1 - OFFSET), CFG.maxYbp);
    return CFG.sliderMax - Math.round(Math.log(clamped + OFFSET) / Math.log(CFG.maxYbp + OFFSET) * CFG.sliderMax);
};
const ybpToYear = (ybp) => CFG.present - ybp;   // año astronómico (el 0 existe)
const yearToYbp = (year) => CFG.present - year;
const effectiveMa = (ybp) => Math.min(CFG.maxYbp / 1e6, Math.max(1, Math.round(ybp / 1e6)));

const formatYear = (year) => (year >= 1 ? year + ' ' + t('ce') : (1 - year) + ' ' + t('bce'));
const nf = () => new Intl.NumberFormat(lang === 'es' ? 'es-ES' : 'en-GB', { maximumFractionDigits: 1 });

function formatTime(ybp) {
    if (ybp >= CFG.deepTimeFrom) return { main: effectiveMa(ybp) + ' Ma', sub: '' };
    if (ybp > 11000) return { main: nf().format(ybp / 1000) + ' ka', sub: fmt('yearsAgo', { n: nf().format(ybp) }) + ' · ' + fmt('approxYear', { y: formatYear(ybpToYear(ybp)) }) };
    return { main: formatYear(ybpToYear(ybp)), sub: '' };
}

// Acepta: 1789, 44 a.C., 44 BC, 117 d.C., 12 ka, 250 Ma. Un número negativo suelto se lee como a.C.
function parseTime(raw) {
    const s = String(raw || '').trim().toLowerCase().replace(/\./g, '').replace(',', '.').replace(/\s+/g, ' ');
    let m;
    if ((m = s.match(/^(-?\d+(?:\.\d+)?)\s*(ma|myr|mya)$/))) return Math.abs(parseFloat(m[1])) * 1e6;
    if ((m = s.match(/^(-?\d+(?:\.\d+)?)\s*(ka|kyr|kya)$/))) return Math.abs(parseFloat(m[1])) * 1e3;
    if ((m = s.match(/^(\d+)\s*(bc|bce|ac|a de c|antes de cristo)$/))) return yearToYbp(1 - parseInt(m[1], 10));
    if ((m = s.match(/^(\d+)\s*(ad|ce|dc|d de c)?$/))) return yearToYbp(parseInt(m[1], 10));
    if ((m = s.match(/^-(\d+)$/))) return yearToYbp(1 - parseInt(m[1], 10));
    return null;
}

/* ------------------------------------------------------------------ */
/* Carga de datos                                                     */
/* ------------------------------------------------------------------ */
const cache = new Map();     // url -> JSON ya descargado (no se vuelve a pedir en toda la sesión)
const pending = new Map();   // url -> descarga en curso sin señal de cancelación, compartida por quien la pida

function getJSON(url, signal) {
    if (cache.has(url)) return Promise.resolve(cache.get(url));
    if (!signal && pending.has(url)) return pending.get(url);
    const timeout = AbortSignal.timeout(CFG.fetchTimeoutMs);
    const p = (async () => {
        const res = await fetch(url, { signal: signal ? AbortSignal.any([signal, timeout]) : timeout });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = JSON.parse(await res.text());
        cache.set(url, data);
        return data;
    })();
    if (!signal) {
        pending.set(url, p);
        const done = () => pending.delete(url);
        p.then(done, done);
    }
    return p;
}

const emptyFC = () => ({ type: 'FeatureCollection', features: [] });

async function loadPaleoManifest(signal) {
    if (state.paleo) return state.paleo;
    const m = await getJSON(CFG.paleoBase + 'manifest.json', signal);
    if (!m || !Array.isArray(m.ages) || !m.ages.length) throw new Error('manifiesto sin edades');
    state.paleo = m;
    return m;
}

// 1) Costas paleogeograficas reales (archivo propio). 2) Si no hay loncha cercana o falla,
// contornos rigidos de GPlates: siempre rotulados como tales.
async function loadLand(ybp, signal) {
    const targetMa = Math.max(0, ybp / 1e6);
    let paleoError = null;
    try {
        const manifest = await loadPaleoManifest(signal);
        let best = null;
        manifest.ages.forEach((a) => { const d = Math.abs(a.age_ma - targetMa); if (!best || d < best.d) best = { a, d }; });
        if (best && best.d <= CFG.paleoMaxDeltaMa) {
            const data = await getJSON(CFG.paleoBase + best.a.file, signal);
            if (!data || !Array.isArray(data.features)) throw new Error('sin features');
            return { type: 'paleo', data, ma: best.a.age_ma, targetMa, delta: best.d };
        }
    } catch (err) {
        if (err && err.name === 'AbortError') throw err;
        paleoError = err;
    }
    const deep = ybp >= CFG.deepTimeFrom;
    const ma = deep ? effectiveMa(ybp) : 0;
    // Mismas formas de URL que se comprobaron con la sonda: ma=0 sin modelo, el resto con modelo.
    const url = CFG.gplates + '?time=' + ma + (ma > 0 ? '&model=' + CFG.model : '');
    const data = await getJSON(url, signal);
    if (!data || !Array.isArray(data.features)) throw new Error('sin features');
    return { type: 'rigid', data, ma, deep, fallbackError: paleoError };
}

function hue(str) {
    let h = 0;
    for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) >>> 0;
    return h % 360;
}

function colorize(fc) {
    if (fc._colored) return fc;
    fc.features.forEach((f) => {
        const p = f.properties || (f.properties = {});
        const key = p.SUBJECTO || p.NAME;
        p._c = key ? 'hsl(' + hue(key) + ', 55%, 52%)' : '#8a8a8a';
        p._o = key ? 0.5 : 0.12;
    });
    fc._colored = true;
    return fc;
}

async function loadPolities(signal) {
    if (state.polities) return state.polities;
    const index = await getJSON(CFG.hbBase + 'index.json', signal);
    state.polities = index.years.map((y) => ({ year: y.year, file: y.filename, names: y.countries || [] }));
    return state.polities;
}

function nearestSnapshot(polities, year) {
    let best = null;
    polities.forEach((p) => { const d = Math.abs(p.year - year); if (!best || d < best.d) best = { p, d }; });
    return best;
}

// Instantánea más cercana, o null si no hay ninguna lo bastante próxima:
// no se muestra una instantánea muy lejana, sería inventar fronteras.
function pickSnapshot(ybp) {
    if (ybp > CFG.bordersMaxYbp || !state.polities) return null;
    const year = ybpToYear(ybp);
    const best = nearestSnapshot(state.polities, year);
    if (!best || best.d > Math.max(500, 0.25 * Math.abs(year))) return null;
    return best;
}

const snapshotUrl = (best) => CFG.hbBase + 'geojson/' + best.p.file;

// Desde 2016 se usan las fronteras vigentes de Natural Earth 10m (dominio publico, resolucion ~1,7 km, fuente y
// licencia en data/borders/manifest.json), mucho mas precisas que la compilacion historica; antes, esa compilacion.
const usesNE = (ybp) => ybpToYear(ybp) >= CFG.neFromYear;
const neBorders = (fc) => ({ data: colorize(fc), year: CFG.neFromYear, delta: 0, source: 'ne', meta: fc.meta });

// Fronteras ya en memoria: objeto o null (no corresponde mostrar ninguna). undefined = hay que descargar.
function bordersCached(ybp) {
    if (usesNE(ybp)) return cache.has(CFG.neUrl) ? neBorders(cache.get(CFG.neUrl)) : undefined;
    if (ybp > CFG.bordersMaxYbp) return null;
    if (!state.polities) return undefined;
    const best = pickSnapshot(ybp);
    if (!best) return null;
    const url = snapshotUrl(best);
    if (!cache.has(url)) return undefined;
    return { data: colorize(cache.get(url)), year: best.p.year, delta: best.d };
}

async function loadBorders(ybp, signal) {
    if (usesNE(ybp)) return neBorders(await getJSON(CFG.neUrl, signal));
    if (ybp > CFG.bordersMaxYbp) return null;
    await loadPolities(signal);
    const best = pickSnapshot(ybp);
    if (!best) return null;
    const data = colorize(await getJSON(snapshotUrl(best), signal));
    return { data, year: best.p.year, delta: best.d };
}

/* ------------------------------------------------------------------ */
/* Detalle al acercar: geografía ACTUAL de OpenFreeMap (OpenStreetMap)  */
/* ------------------------------------------------------------------ */
// Las costas del modelo son gruesas (~15 000 puntos para todo el mundo). Al acercar se superpone el
// mapa vectorial de hoy, pero sin hacerlo pasar por reconstrucción de la época:
//   · hasta hoy y desde 1950: estilo completo (caminos, edificios no, rótulos, relieve);
//   · de hace 11 000 años a 1950: solo lo físico (agua, ríos, cobertura del suelo), sin obra humana;
//   · antes: nada, porque el nivel del mar y los hielos eran otros y ese mapa mentiría.
// El estilo se pide una sola vez y solo cuando hace falta. Si falla, se reintenta con espera creciente.
const DETAIL = {
    styleUrl: 'https://tiles.openfreemap.org/styles/liberty',
    zoomOn: 4.6, zoomOff: 4.2,        // histéresis: evita parpadeo en el umbral
    physicalMaxYbp: 11000,
    shown: null,                      // null | 'physical' | 'full'
    layers: [],                       // { id, role, physical, orig }
    built: false, building: null, error: null, failedAt: null, backoff: 15000, fadeTimer: null
};
const DETAIL_PHYSICAL_LAYERS = new Set(['water', 'waterway', 'landcover']);
const DETAIL_NOT_MODERN_WATER = ['!', ['in', ['get', 'class'], ['literal', ['dock', 'swimming_pool']]]];

function detailMode() {
    if (state.ybp > DETAIL.physicalMaxYbp) return null;
    if (map.getZoom() < (DETAIL.shown ? DETAIL.zoomOff : DETAIL.zoomOn)) return null;
    return state.ybp <= 0 ? 'full' : 'physical';
}

async function detailFetchStyle() {
    const res = await fetch(DETAIL.styleUrl);
    if (!res.ok) throw new Error('OpenFreeMap HTTP ' + res.status);
    const style = await res.json();
    if (!style || typeof style !== 'object' || !style.sources || !Array.isArray(style.layers)) throw new Error('estilo de OpenFreeMap con forma inesperada');
    return style;
}

function detailBuild(style) {
    if (style.glyphs) map.setGlyphs(style.glyphs);
    if (style.sprite) map.setSprite(style.sprite);
    Object.entries(style.sources).forEach(([name, src]) => map.addSource('ofm-' + name, src));
    // Rotulo con el nombre de parques y espacios protegidos (el estilo de OpenFreeMap dibuja el relleno y el contorno de rayas, pero
    // no su nombre): sin el, una zona de otro tono con borde de rayas se confunde con un territorio. Hereda fuente y halo de un rotulo existente.
    const proto = style.layers.find((l) => l.type === 'symbol' && l.source && l.layout && l.layout['text-font']);
    if (proto && !style.layers.some((l) => l.id === 'chronos_park_name')) {
        style.layers.push({
            id: 'chronos_park_name', type: 'symbol', source: proto.source, 'source-layer': 'park', minzoom: 9,
            filter: ['match', ['geometry-type'], ['MultiPolygon', 'Polygon'], true, false],
            layout: { 'text-field': ['coalesce', ['get', 'name:latin'], ['get', 'name']], 'text-font': proto.layout['text-font'], 'text-size': 12, 'text-max-width': 7, 'text-padding': 6 },
            paint: { 'text-color': '#3b6d3b', 'text-halo-color': (proto.paint && proto.paint['text-halo-color']) || '#ffffff', 'text-halo-width': 1.2 }
        });
    }
    style.layers.forEach((l) => {
        if (l.type === 'fill-extrusion') return;               // edificios en 3D: pesados y de hoy
        const clone = { ...l, id: 'ofm-' + l.id, layout: { ...(l.layout || {}), visibility: 'none' } };
        if (l.source) clone.source = 'ofm-' + l.source;
        // Tierra y suelo van DEBAJO de las fronteras; agua, caminos y rotulos ENCIMA. Asi el agua real
        // tapa lo que el poligono grueso de una frontera invadia del mar (no se superponen los mapas).
        const below = l.type === 'background' || l.type === 'raster' || (l.type === 'fill' && ['landcover', 'landuse', 'park'].includes(l['source-layer']));
        map.addLayer(clone, below ? 'borders-fill' : 'borders-hl');
        const role = l.type === 'background' ? 'bg'
            : l['source-layer'] === 'water' && l.type === 'fill' ? 'water'
            : l['source-layer'] === 'waterway' && l.type === 'line' ? 'waterway'
            : l['source-layer'] === 'boundary' && l.type === 'line' ? 'boundary'
            : l.type === 'symbol' ? 'symbol' : l.type === 'fill' ? 'fill' : 'other';
        const physical = role === 'bg' || (DETAIL_PHYSICAL_LAYERS.has(l['source-layer']) && l.type !== 'symbol' && l.id !== 'waterway_tunnel');
        const orig = {};
        if (role === 'fill') orig['fill-opacity'] = map.getPaintProperty(clone.id, 'fill-opacity');
        if (role === 'symbol') { orig['text-color'] = map.getPaintProperty(clone.id, 'text-color'); orig['text-halo-color'] = map.getPaintProperty(clone.id, 'text-halo-color'); }
        DETAIL.layers.push({ id: clone.id, role, physical, orig, filter: l.filter || null });
    });
    detailTheme();
}

// Mismo color de tierra y agua que el mapa grueso (no hay salto al cruzar el umbral); en oscuro se
// atenúan las superficies de uso del suelo y se aclaran los rótulos.
function detailTheme() {
    if (!DETAIL.built && !DETAIL.layers.length) return;
    const p = palette();
    DETAIL.layers.forEach((l) => {
        if (l.role === 'bg') map.setPaintProperty(l.id, 'background-color', p.land);
        else if (l.role === 'water') map.setPaintProperty(l.id, 'fill-color', p.ocean);
        else if (l.role === 'waterway') map.setPaintProperty(l.id, 'line-color', p.ocean);
        else if (l.role === 'fill') map.setPaintProperty(l.id, 'fill-opacity', state.dark ? 0.28 : l.orig['fill-opacity']);
        else if (l.role === 'symbol') {
            map.setPaintProperty(l.id, 'text-color', state.dark ? '#e6e2d8' : l.orig['text-color']);
            map.setPaintProperty(l.id, 'text-halo-color', state.dark ? '#1b2126' : l.orig['text-halo-color']);
        }
    });
}

function detailEnsure() {
    if (DETAIL.built) return Promise.resolve(true);
    if (DETAIL.building) return DETAIL.building;
    if (DETAIL.failedAt !== null && performance.now() - DETAIL.failedAt < DETAIL.backoff) return Promise.resolve(false);
    DETAIL.building = detailFetchStyle().then((style) => {
        detailBuild(style);
        DETAIL.built = true; DETAIL.error = null; DETAIL.failedAt = null; DETAIL.backoff = 15000;
        return true;
    }).catch((err) => {
        DETAIL.error = err; DETAIL.failedAt = performance.now(); DETAIL.backoff = Math.min(DETAIL.backoff * 2, 300000);
        console.warn('[DETAIL]', err.message);
        renderStatus();
        return false;
    }).finally(() => { DETAIL.building = null; });
    return DETAIL.building;
}

// El fondo de tierra solo se destapa cuando ya hay teselas de agua; si no, se vería tierra sobre el océano.
function detailFade() {
    const bgs = DETAIL.layers.filter((l) => l.role === 'bg');
    bgs.forEach((l) => map.setPaintProperty(l.id, 'background-opacity', 0));
    const reveal = () => { clearTimeout(DETAIL.fadeTimer); bgs.forEach((l) => map.setPaintProperty(l.id, 'background-opacity', 1)); };
    map.once('idle', reveal);
    DETAIL.fadeTimer = setTimeout(reveal, 3000);
}

// Las fronteras administrativas actuales de OpenStreetMap no se dibujan mientras haya fronteras historicas:
// serian dos mapas de fronteras superpuestos (y el actual no es el de la epoca).
function detailVisibility() {
    const mode = DETAIL.shown;
    DETAIL.layers.forEach((l) => {
        map.setLayoutProperty(l.id, 'visibility', mode && (mode === 'full' || l.physical) && !(l.role === 'boundary' && state.borders) ? 'visible' : 'none');
        // Antes de hoy no se dibujan dársenas ni piscinas: obras modernas (clases `dock` y `swimming_pool` del esquema de OpenFreeMap, comprobadas con la sonda).
        if (l.role === 'water') map.setFilter(l.id, mode === 'physical' ? (l.filter ? ['all', l.filter, DETAIL_NOT_MODERN_WATER] : DETAIL_NOT_MODERN_WATER) : (l.filter || null));
    });
}

/* ---- franja entre frontera y costa ---- */
// Los poligonos historicos estan dibujados con muy pocos puntos y quedan tierra adentro; con la costa real al
// fondo queda una franja sin color. Se colorea con el pais mas cercano (hasta GAP_DIST_M) y con el mismo tinte que
// el poligono: la costa la pone el mapa, no el poligono. El reparto entre vecinos junto a la costa es una aproximacion
// grafica, no un dato; se declara en el estado.
const GAP_DIST_M = 100000;       // fronteras historicas (toscas)
const GAP_DIST_NE_M = 20000;     // Natural Earth (1,7 km): solo rendijas frente a la costa del mapa
const GAP_MAX_SPAN_DEG = 200;    // vistas mas anchas (el globo entero): las franjas miden menos de un pixel
const GAP_CELL_PX = 1.5;         // tamano de celda objetivo en pixeles de pantalla (para que la costa no salga escalonada)
const GAP_CELLS_MIN = 200; const GAP_CELLS_MAX = 1100;
let gapSeq = 0;                   // el PNG se codifica fuera del hilo principal: solo vale el ultimo
const GAP = { timer: 0, shown: false, ctx: null, sel: null, url: null };
function gapColor(css) {
    if (!GAP.ctx) { const c = document.createElement('canvas'); c.width = c.height = 1; GAP.ctx = c.getContext('2d', { willReadFrequently: true }); }
    GAP.ctx.clearRect(0, 0, 1, 1); GAP.ctx.fillStyle = css; GAP.ctx.fillRect(0, 0, 1, 1);
    const d = GAP.ctx.getImageData(0, 0, 1, 1).data; return [d[0], d[1], d[2]];
}
function gapRefresh() {
    clearTimeout(GAP.timer);
    GAP.timer = setTimeout(gapDraw, 220);
}
// Mientras la imagen pinta todo el territorio, el relleno vectorial queda casi invisible (0,01: con 0 MapLibre deja de detectar clics).
// Pais resaltado: sus fronteras TERRESTRES en rojo (nunca el contorno tosco que da al mar) y su territorio algo mas opaco.
const polityKey = (props) => (props && (props.SUBJECTO || props.NAME)) || null;
function gapFillPaint() {
    if (!map.getLayer('borders-fill')) return;
    const base = ['get', '_o'];
    const tinted = GAP.sel ? ['case', ['==', ['coalesce', ['get', 'SUBJECTO'], ['get', 'NAME']], GAP.sel], ['min', 1, ['+', base, 0.3]], base] : base;
    map.setPaintProperty('borders-fill', 'fill-opacity', GAP.shown ? 0.01 : tinted);
}
function setHighlightKey(key) {
    GAP.sel = key || null;
    if (map.getLayer('borders-hl')) map.setFilter('borders-hl', ['==', ['get', 'key'], key || '\u0000']);
    gapFillPaint();
    if (GAP.shown) gapRefresh();
}
function gapHide() { gapSeq++; if (GAP.shown) { map.setLayoutProperty('gap-raster', 'visibility', 'none'); GAP.shown = false; gapFillPaint(); renderStatus(); } }
function gapDraw() {
    if (!map.getLayer('gap-raster') || !window.ChronosGap) return;
    const b = state.borders;
    const want = Boolean(b && b.data && b.data.features.length);
    if (!want) { gapHide(); return; }
    // Con el detalle de OpenStreetMap el agua va por encima y ya pone la costa; sin el, la costa la pone la tierra del mapa base.
    const L = DETAIL.shown ? null : (state.landError ? null : state.land);
    if (!DETAIL.shown && !(L && L.data && L.data.features)) { gapHide(); return; }
    const capM = b.source === 'ne' ? GAP_DIST_NE_M : GAP_DIST_M;
    const bd = map.getBounds(); const padDeg = capM / 111000 * 1.2;
    const view = [Math.max(-180, bd.getWest()), Math.max(-84, bd.getSouth()), Math.min(180, bd.getEast()), Math.min(84, bd.getNorth())];
    if (view[2] - view[0] > GAP_MAX_SPAN_DEG) { gapHide(); return; }
    const degPerPx = 360 / (512 * Math.pow(2, map.getZoom()));
    // La rejilla cubre la VISTA (mas un 5 %) con celdas de ~1,5 px: al acercar la resolucion SUBE. Lo que cae mas alla, hasta el tope
    // de franja, lo resuelve una rejilla gruesa aparte (ver ChronosGap.classify, padM/coarseCells).
    const viewWm = (view[2] - view[0]) * 111320 * Math.cos((view[1] + view[3]) / 2 * Math.PI / 180);
    const maxCells = Math.round(Math.max(GAP_CELLS_MIN, Math.min(GAP_CELLS_MAX, (view[2] - view[0]) / (GAP_CELL_PX * degPerPx))));
    const padM = Math.min(capM, 0.05 * viewWm);
    const groups = new Map();
    for (const f of b.data.features) {
        if (!f.geometry) continue;
        const polys = f.geometry.type === 'MultiPolygon' ? f.geometry.coordinates : f.geometry.type === 'Polygon' ? [f.geometry.coordinates] : [];
        const key = (f.properties && (f.properties.SUBJECTO || f.properties.NAME)) || '?';
        for (const poly of polys) {
            if (!poly._bb) { let a = 180, c = 90, d = -180, e = -90; poly[0].forEach(([x, y]) => { a = Math.min(a, x); d = Math.max(d, x); c = Math.min(c, y); e = Math.max(e, y); }); poly._bb = [a, c, d, e]; }
            const bb = poly._bb;
            if (bb[2] < view[0] - padDeg || bb[0] > view[2] + padDeg || bb[3] < view[1] - padDeg || bb[1] > view[3] + padDeg) continue;
            if (!groups.has(key)) groups.set(key, { key, css: f.properties._c, alpha: Math.min(255, Math.round(255 * ((f.properties._o == null ? 0.5 : f.properties._o) + (GAP.sel === key ? 0.3 : 0)))), polys: [] });
            groups.get(key).polys.push(poly);
        }
    }
    const list = [...groups.values()];
    if (!list.length) { gapHide(); return; }
    let landPolys = null;
    if (L) {
        landPolys = [];
        for (const f of L.data.features) {
            if (!f.geometry || (f.properties && f.properties.kind === 'margin')) continue;
            const polys = f.geometry.type === 'MultiPolygon' ? f.geometry.coordinates : f.geometry.type === 'Polygon' ? [f.geometry.coordinates] : [];
            for (const poly of polys) {
                if (!poly._bb) { let a = 180, c = 90, d = -180, e = -90; poly[0].forEach(([x, y]) => { a = Math.min(a, x); d = Math.max(d, x); c = Math.min(c, y); e = Math.max(e, y); }); poly._bb = [a, c, d, e]; }
                const bb = poly._bb;
                if (bb[2] < view[0] - padDeg || bb[0] > view[2] + padDeg || bb[3] < view[1] - padDeg || bb[1] > view[3] + padDeg) continue;
                landPolys.push(poly);
            }
        }
        if (!landPolys.length) { gapHide(); return; }
    }
    const res = ChronosGap.classify(list, view, { distM: capM, padM, maxCells, coarseCells: 640, resolve: 'nearest', land: landPolys });
    const { cols, rows } = res.grid;
    const cv = document.createElement('canvas'); cv.width = cols; cv.height = rows;
    const cx = cv.getContext('2d'); const img = cx.createImageData(cols, rows);
    const rgb = list.map((g) => gapColor(g.css || '#8a8a8a'));
    let filled = 0;
    for (let i = 0; i < res.cls.length; i++) {
        const c = res.owner[i] || res.cls[i]; if (!c) continue;   // dentro de un poligono: el suyo; fuera: el mas cercano
        const o = i * 4; const k = rgb[c - 1];
        img.data[o] = k[0]; img.data[o + 1] = k[1]; img.data[o + 2] = k[2]; img.data[o + 3] = list[c - 1].alpha; filled++;
    }
    cx.putImageData(img, 0, 0);
    if (!filled) { gapHide(); return; }
    const seq = ++gapSeq;
    cv.toBlob((blob) => {
        if (!blob || seq !== gapSeq) return;     // llego tarde: ya hay una vista mas nueva en camino
        const url = URL.createObjectURL(blob);
        const old = GAP.url; GAP.url = url;
        map.getSource('gap').updateImage({ url, coordinates: res.grid.corners });
        const was = GAP.shown; GAP.shown = true;
        map.setLayoutProperty('gap-raster', 'visibility', 'visible');
        gapFillPaint();
        if (was !== GAP.shown) renderStatus();
        if (old) setTimeout(() => URL.revokeObjectURL(old), 4000);
    }, 'image/png');
}
map.on('moveend', gapRefresh);

async function detailApply() {
    if (!map.getLayer('borders-fill')) return;
    let mode = detailMode();
    if (mode && !DETAIL.built) {
        if (!(await detailEnsure())) return;
        mode = detailMode();
    }
    if (mode === DETAIL.shown) return;
    const was = DETAIL.shown;
    DETAIL.shown = mode;
    detailVisibility();
    ['margin-fill', 'land-fill', 'land-line'].forEach((id) => map.setLayoutProperty(id, 'visibility', mode ? 'none' : 'visible'));
    if (mode && !was) detailFade();
    gapRefresh();
    renderStatus();
}
map.on('zoom', detailApply);
map.on('moveend', detailApply);

function applyTheme() {
    document.body.classList.toggle('dark', state.dark);
    $('btn-theme').textContent = state.dark ? 'Light' : 'Dark';
    if (!map.getLayer('land-fill')) return;
    const p = palette();
    map.setPaintProperty('ocean', 'background-color', p.ocean);
    map.setPaintProperty('margin-fill', 'fill-color', p.shelf);
    map.setPaintProperty('land-fill', 'fill-color', p.land);
    map.setPaintProperty('land-line', 'line-color', p.landLine);
    map.setPaintProperty('borders-line', 'line-color', p.line);
    detailTheme();
}

/* ------------------------------------------------------------------ */
/* Escena: se recompone al cambiar el tiempo                          */
/* ------------------------------------------------------------------ */
let sceneToken = 0;       // numera las peticiones de escena
let appliedToken = 0;     // la más reciente que ya se ha pintado

// Los datos recientes son de ahora: pintarlos en otra época sería un anacronismo.
const liveVisible = (ybp) => Boolean(state.live) && Math.abs(ybp - -(CFG.nowYear - CFG.present)) <= 5;

// Solo se reenvía una capa al mapa si cambia de verdad: arrastrar el slider recorre muchos valores
// que caen en la misma loncha y volver a trocear el GeoJSON cada vez era el grueso del retraso.
function applyLand(L) {
    state.land = L;
    if (state.landData === L.data) return;
    map.getSource('land').setData(L.data);
    state.landData = L.data;
    if (typeof gapRefresh === 'function') gapRefresh();
}

// Un poligono que da al mar es una costa tosca (la buena la pone el mapa): solo se dibujan los tramos que comparte con otro pais.
function innerOf(fc) {
    if (!fc || !window.ChronosInner) return emptyFC();
    if (!fc._inner) fc._inner = ChronosInner.innerBorders(fc, (f) => (f.properties && (f.properties.SUBJECTO || f.properties.NAME)) || '?', 1.5);
    return fc._inner;
}
function applyBorders(b) {
    state.borders = b;
    const data = b ? b.data : null;
    if (state.bordersData === data) return;
    map.getSource('borders').setData(data || emptyFC());
    map.getSource('borders-inner').setData(innerOf(data));
    state.bordersData = data;
    if (DETAIL.built) detailVisibility();
    gapRefresh();
}

function renderStatus() {
    const ybp = state.ybp;
    const messages = [];
    let level = 'ok';
    const L = state.landError ? null : state.land;
    if (state.landError) {
        level = 'warn';
        messages.push(fmt('landFail', { err: state.landError.message }));
    } else if (L) {
        if (L.type === 'paleo') {
            if (ybp < CFG.deepTimeFrom) messages.push(t('seaLevel'));
            else {
                const near = L.delta > 0 ? fmt('paleoNear', { t: nf().format(L.targetMa), d: nf().format(L.delta) }) : '';
                messages.push(fmt('paleoOk', { age: L.ma + ' Ma', near }));
            }
        } else {
            if (L.fallbackError) { level = 'warn'; messages.push(fmt('paleoFallback', { err: L.fallbackError.message })); }
            messages.push(L.deep ? fmt('landOk', { model: CFG.model, age: L.ma + ' Ma' }) : t('seaLevel'));
        }
    }
    if (state.bordersError) {
        level = 'warn';
        messages.push(fmt('bordersFail', { err: state.bordersError.message }));
    } else if (state.bordersLoading) {
        messages.push(t('loadingBorders'));
    } else if (state.borders) {
        const b = state.borders;
        if (b.source === 'ne') {
            messages.push(fmt('bordersNE', { km: nf().format(b.meta.segment_median_km) }));
            if (ybpToYear(state.ybp) < 2020) messages.push(t('neBackdate'));
        } else messages.push(fmt('bordersSnapshot', { y: formatYear(b.year), d: b.delta === 0 ? t('exact') : fmt('apart', { n: nf().format(b.delta) }) }));
    } else if (ybp <= CFG.bordersMaxYbp) {
        messages.push(t('noBorders'));
    }
    if (GAP.shown) messages.push(t(state.borders && state.borders.source === 'ne' ? 'gapNoteNE' : 'gapNote'));
    if (DETAIL.shown) messages.push(t(DETAIL.shown === 'full' ? 'detailFull' : 'detailPhysical'));
    else if (DETAIL.error && detailMode()) { level = 'warn'; messages.push(fmt('detailFail', { err: DETAIL.error.message })); }
    if (messages.length) setStatus(level, messages.join(' '));
    renderCredits();
}

/* Costas: ligeras (~300 KB) y se precargan, así que siguen al slider mientras se arrastra. */
async function updateScene({ immediate = false } = {}) {
    const token = ++sceneToken;
    await mapReady;
    if (token !== sceneToken) return;   // llegó otra petición mientras el mapa arrancaba
    const ybp = state.ybp;
    scheduleBorders(immediate);         // en paralelo: no esperan a las costas
    const slow = setTimeout(() => { if (token === sceneToken) setStatus('warn', t('loadingLand')); }, 350);
    try {
        const L = await loadLand(ybp);
        // Una respuesta de una petición ya superada se pinta igualmente (así se ve avanzar el mapa
        // mientras se arrastra), salvo que ya se haya pintado algo más reciente.
        if (token < appliedToken) return;
        appliedToken = token;
        state.landError = null;
        applyLand(L);
    } catch (err) {
        if (token < appliedToken) return;
        appliedToken = token;
        state.landError = err;
    } finally {
        clearTimeout(slow);
    }
    map.setLayoutProperty('live-points', 'visibility', liveVisible(ybp) ? 'visible' : 'none');
    if (!currentFocus) hideInfo();   // el panel describía otra época
    renderStatus();
    prefetchPaleo();
}

/* Fronteras: 1-3,6 MB por instantánea. Si ya están en memoria se aplican al instante;
   si hay que descargarlas, se espera a que el slider se detenga. Mientras tanto no se deja en
   pantalla la instantánea de otra época. */
let bordersToken = 0;
let bordersCtl = null;
let bordersTimer = null;

function scheduleBorders(immediate) {
    clearTimeout(bordersTimer);
    if (bordersCached(state.ybp) !== undefined) {
        state.bordersLoading = false;
        runBorders();
        return;
    }
    if (state.borders) applyBorders(null);
    state.bordersLoading = true;
    bordersTimer = setTimeout(runBorders, immediate ? 0 : CFG.bordersDebounceMs);
}

async function runBorders() {
    const token = ++bordersToken;
    if (bordersCtl) bordersCtl.abort();
    bordersCtl = new AbortController();
    try {
        const b = await loadBorders(state.ybp, bordersCtl.signal);
        if (token !== bordersToken) return;
        state.bordersError = null;
        applyBorders(b);
    } catch (err) {
        if (token !== bordersToken || (err && err.name === 'AbortError')) return;
        state.bordersError = err;
        applyBorders(null);
    }
    state.bordersLoading = false;
    if (currentFocus) { const f = currentFocus; currentFocus = null; focusPolity(f); }
    renderStatus();
    prefetchNeighbours(state.borders);
}

/* Precarga en segundo plano (sin bloquear nada y respetando "ahorro de datos"). */
const saveData = () => Boolean(navigator.connection && navigator.connection.saveData);
const whenIdle = (fn) => (window.requestIdleCallback ? window.requestIdleCallback(fn, { timeout: 4000 }) : setTimeout(fn, 1500));
let paleoPrefetched = false;

// Las 81 lonchas de costas pesan unos 10 MB en total: tras la primera escena se bajan, de la más
// cercana a la época actual hacia las más lejanas, y el slider deja de esperar a la red.
function prefetchPaleo() {
    if (paleoPrefetched || saveData() || !state.paleo) return;
    paleoPrefetched = true;
    whenIdle(async () => {
        const target = Math.max(0, state.ybp / 1e6);
        const urls = state.paleo.ages.slice()
            .sort((x, y) => Math.abs(x.age_ma - target) - Math.abs(y.age_ma - target))
            .map((a) => CFG.paleoBase + a.file);
        let i = 0;
        const worker = async () => {
            while (i < urls.length) {
                try { await getJSON(urls[i++]); } catch (err) { /* se pedirá bajo demanda */ }
            }
        };
        await Promise.all([worker(), worker()]);
    });
}

// Las dos instantáneas vecinas de la que se está viendo (hay 54 de 1-3,6 MB: no se bajan todas).
function prefetchNeighbours(b) {
    if (!b || saveData() || !state.polities) return;
    const near = state.polities.filter((p) => p.year !== b.year)
        .sort((x, y) => Math.abs(x.year - b.year) - Math.abs(y.year - b.year)).slice(0, 2);
    whenIdle(() => near.forEach((p) => {
        const url = CFG.hbBase + 'geojson/' + p.file;
        if (!cache.has(url)) getJSON(url).catch(() => {});
    }));
}

let sceneTimer = null;
let lastScene = 0;
// Aplica el primer cambio de inmediato y, mientras se arrastra, como mucho una vez cada throttleMs
// con el valor más reciente (antes se esperaba a que el slider se parase).
function scheduleScene() {
    if (sceneTimer) return;   // ya hay una actualización en cola y leerá el valor más reciente
    const wait = Math.max(0, CFG.throttleMs - (performance.now() - lastScene));
    sceneTimer = setTimeout(() => { sceneTimer = null; lastScene = performance.now(); updateScene(); }, wait);
}

let prefTimer = null;
const timePrefs = () => ({ ybp: state.ybp, jd: clockUsable() ? Math.round(clock.jd * 86400) / 86400 : undefined });
const rememberTime = () => { clearTimeout(prefTimer); prefTimer = setTimeout(() => { prefTimer = null; savePrefs(timePrefs()); }, 400); };
window.addEventListener('pagehide', () => { clearTimeout(prefTimer); prefTimer = null; savePrefs(timePrefs()); });

function setTime(ybp, { fromSlider = false, immediate = false, persist = true, fromClock = false } = {}) {
    state.ybp = Math.min(Math.max(ybp, 1 - OFFSET), CFG.maxYbp);
    if (!fromClock) clockFromYear(ybpToYear(state.ybp));
    if (persist) rememberTime();
    if (!fromSlider) $('slider').value = ybpToSlider(state.ybp);
    if (document.activeElement !== $('time-input')) $('time-input').value = '';
    const f = formatTime(state.ybp);
    $('time-label').textContent = f.main;
    $('time-sub').textContent = f.sub;
    if (immediate) { clearTimeout(sceneTimer); sceneTimer = null; lastScene = performance.now(); updateScene({ immediate: true }); } else scheduleScene();
    if (!fromClock) clockChanged();
    detailApply();
}

/* ------------------------------------------------------------------ */
/* Selección y búsqueda                                               */
/* ------------------------------------------------------------------ */
function clearHighlight() {
    setHighlightKey(null);
}

function bboxOf(features) {
    let minX = 180, minY = 90, maxX = -180, maxY = -90;
    const walk = (c) => { if (typeof c[0] === 'number') { minX = Math.min(minX, c[0]); maxX = Math.max(maxX, c[0]); minY = Math.min(minY, c[1]); maxY = Math.max(maxY, c[1]); } else c.forEach(walk); };
    features.forEach((f) => f.geometry && walk(f.geometry.coordinates));
    return minX <= maxX ? [[minX, minY], [maxX, maxY]] : null;
}

function focusPolity(name) {
    if (!state.borders) return;
    const feats = state.borders.data.features.filter((f) => f.properties.NAME === name);
    if (!feats.length) return;
    setHighlightKey(polityKey(feats[0].properties));
    const box = bboxOf(feats);
    if (box) map.fitBounds(box, { padding: 120, maxZoom: 6, duration: 1400 });
    showPolity(feats[0].properties);
}

function showPolity(p) {
    if (state.borders && state.borders.source === 'ne') {
        const m = state.borders.meta;
        const rows = [{ label: t('evidence'), badge: 'documentary', note: t('neNote') }];
        if (p.SUBJECTO && p.SUBJECTO !== p.NAME) rows.push({ label: t('power'), value: p.SUBJECTO });
        if (p.TYPE) rows.push({ label: t('typeLabel'), value: p.TYPE });
        rows.push({ label: t('resolution'), value: '~' + nf().format(m.segment_median_km) + ' km (' + nf().format(m.segment_p90_km) + ' km p90)' });
        if (p.WIKIDATAID) rows.push({ label: 'Wikidata', value: p.WIKIDATAID, href: 'https://www.wikidata.org/wiki/' + p.WIKIDATAID });
        rows.push({ label: t('source'), value: 'Natural Earth 10m', href: 'https://www.naturalearthdata.com/' });
        rows.push({ label: t('license'), value: lang === 'es' ? 'Dominio público' : 'Public domain' });
        showInfo((lang === 'es' && p.NAME_ES) || p.NAME || t('unnamed'), rows);
        return;
    }
    const rows = [{ label: t('evidence'), badge: 'reconstruction', note: t('bordersNote') }];
    if (p.SUBJECTO && p.SUBJECTO !== p.NAME) rows.push({ label: t('power'), value: p.SUBJECTO });
    if (p.PARTOF) rows.push({ label: t('parent'), value: p.PARTOF });
    if (p.BORDERPRECISION) rows.push({ label: t('precision'), value: t('prec.' + p.BORDERPRECISION) || p.BORDERPRECISION });
    if (state.borders) rows.push({ label: t('snapshotLabel'), value: formatYear(state.borders.year) });
    rows.push({ label: t('source'), value: 'historical-basemaps', href: 'https://github.com/aourednik/historical-basemaps' });
    showInfo(p.NAME || t('unnamed'), rows);
}

function showCoast(props) {
    const L = state.land;
    if (L && L.type === 'paleo') {
        const isMargin = props && props.kind === 'margin';
        showInfo(isMargin ? t('paleoMargin') : (props && props.name) || t('paleoTitle'), [
            { label: t('evidence'), badge: 'reconstruction', note: isMargin ? t('paleoMarginNote') : t('paleoNote') },

async function runSearch(raw) {
    const q = raw.trim().toLowerCase();
    if (!q) return;
    try {
        const polities = await loadPolities();
        const hits = [];
        const matches = new Map();
        polities.forEach((p) => p.names.forEach((n) => {
            if (n && n.toLowerCase().includes(q)) { hits.push({ p, n }); matches.set(n, (matches.get(n) || 0) + 1); }
        }));
        if (hits.length) {
            // Mejor coincidencia: nombre exacto, si no el más corto
            const names = [...matches.keys()].sort((a, b) => (a.toLowerCase() === q ? -1 : b.toLowerCase() === q ? 1 : a.length - b.length));
            const name = names[0];
            const candidates = hits.filter((h) => h.n === name).map((h) => h.p);
            const here = ybpToYear(state.ybp);
            const best = candidates.reduce((a, b) => (Math.abs(a.year - here) <= Math.abs(b.year - here) ? a : b));
            setStatus('ok', fmt('found', { n: name, c: candidates.length, y: formatYear(best.year) }));
            currentFocus = name;
            setTime(yearToYbp(best.year), { immediate: true });
            return;
        }
    } catch (err) {
        setStatus('warn', fmt('bordersFail', { err: err.message }));
        return;
    }
    const live = state.live && state.live.features.find((f) => String(f.properties.name || '').toLowerCase().includes(q));
    if (live) {
        setTime(0 - (CFG.nowYear - CFG.present), { immediate: true });
        map.flyTo({ center: live.geometry.coordinates, zoom: 5 });
        showLive(live.properties);
        return;
    }
    setStatus('warn', fmt('noResults', { q: raw.trim() }));
}

async function skyLoadCatalog() {

    try {
        const [raw, con] = await Promise.all([getJSON('./data/sky/stars.json'), getJSON('./data/sky/constellations.json').catch(() => null)]);

async function skyLoadValidation() {

/* ---- Prehistoria: solo estrellas (-100.000 .. -2001). Datos y calculo en sky/prehistory.js (verificado en Node). ---- */
const pre = { state: 'idle', inst: null, view: null, res: null, fullJD: NaN, unknown: [], rvRms: 0, extraN: 0, catN: 0 };
const skyRange = () => (window.ChronosPrehistory && window.ChronosLtp && window.ChronosStars3D
    ? { minYear: ChronosPrehistory.WINDOW.minYear, maxYear: ChronosSky.WINDOW.maxYear } : ChronosSky.WINDOW);
const yearStarsOnly = (year) => skyRange().minYear < ChronosSky.WINDOW.minYear && year < ChronosSky.WINDOW.minYear && year >= skyRange().minYear;

async function preLoad() {
    if (pre.state !== 'idle') return;
    pre.state = 'loading';
    try {
        const [stars, s3, ltpDoc, con] = await Promise.all([getJSON('./data/sky/stars.json'), getJSON('./data/sky/stars3d.json'), getJSON('./data/sky/ltp.json'), getJSON('./data/sky/constellations.json').catch(() => null)]);
        const cat = ChronosStars3D.buildCatalogue(stars, s3);
        const inst = ChronosPrehistory.create({ ltpTables: ltpDoc.tables, cat });
        const byHip = new Map(); for (let i = 0; i < cat.n; i++) byHip.set(cat.hip[i], i);
        const constellations = con && Array.isArray(con.constellations)
            ? con.constellations.map((c) => ({ id: c.id, lines: c.lines.map(([a, b]) => [byHip.get(a), byHip.get(b)]).filter(([a, b]) => a !== undefined && b !== undefined) })) : [];
        pre.view = { n: cat.n, hip: cat.hip, bv: cat.bv, names: stars.names || {}, constellations, mag: new Float64Array(cat.n) };
        pre.inst = inst; pre.rvRms = s3.rv_rms_kms; pre.extraN = s3.extra.length; pre.catN = stars.stars.length;
        pre.unknown = []; for (let i = 0; i < cat.n; i++) if (inst.prep.hasPlx[i] && !inst.prep.rvKnown[i]) pre.unknown.push(i);
        pre.state = 'ready';
    } catch (err) { pre.state = 'missing'; console.warn('[PRE]', err.message); }
    scheduleSky(); scheduleSpace();
}

// Las estrellas se mueven < 1" al dia: ra/dec/magnitud se recalculan como mucho una vez al dia de reloj; el angulo de rotacion (ERA), siempre.
function preFrame(jd) {
    if (pre.state !== 'ready') return null;
    if (!pre.res || Math.abs(jd - pre.fullJD) > 1) {
        const time = new Astronomy.AstroTime(jd - ChronosSky.J2000_JD);
        const dt = (time.tt - time.ut) * 86400;
        pre.res = pre.inst.at(jd, dt); pre.res.dtSeconds = dt; pre.view.mag.set(pre.res.mag); pre.fullJD = jd;
    }
    pre.res.era = pre.inst.frame.era(jd - ChronosSky.J2000_JD);
    return pre.res;
}

const fmtAngle = (rad) => { const a = rad * 180 / Math.PI; return a < 1 ? nf().format(Math.round(a * 600) / 10) + '\u2032' : nf().format(Math.round(a * 10) / 10) + '\u00b0'; };

function updateSkyStarsOnly(jd) {
    if (pre.state === 'idle') preLoad();
    if (pre.state !== 'ready') { $('sky-range').textContent = t(pre.state === 'missing' ? 'sky.pre.missing' : 'sky.pre.loading'); $('sky-body').style.display = 'none'; return; }
    $('sky-body').style.display = '';
    const res = preFrame(jd); const view = pre.view;
    const hor = pre.inst.horizontal(res, sky.lat, sky.lon);
    const alt = Float64Array.from(hor.alt, (a) => a + Astronomy.Refraction('normal', a));
    const none = { alt: -90, az: 0, mag: 0, phaseFraction: 0 };
    const u = ChronosSky.jdToCalendar(jd, sky.calendar);
    $('sky-when').textContent = fmt('sky.when', { date: u.day + ' ' + monthName(u.month) + ' ' + formatYear(u.year), cal: t('sky.cal.' + u.calendar), ut: pad2(u.hour) + ':' + pad2(u.minute) + ':' + pad2(Math.floor(u.second)), dt: nf().format(Math.round(res.dtSeconds)) });
    sky.drawn = ChronosSkyView.draw($('sky-chart'), { twilight: 'night', sun: none, moon: none, planets: [], stars: { alt, az: hor.az } }, {
        catalog: sky.stars ? view : null, names: {}, cardinals: t('sky.cardinals'), showStars: sky.stars, showNames: sky.names, showLines: sky.lines, dayStars: true, lang
    });
    $('sky-twilight').textContent = t('sky.pre.banner');
    // las estrellas mas brillantes que estan sobre el horizonte
    const up = []; for (let i = 0; i < view.n; i++) if (alt[i] > 0 && view.mag[i] <= 6.5) up.push(i);
    up.sort((a, b) => view.mag[a] - view.mag[b]);
    const rows = $('sky-rows'); rows.textContent = '';
    up.slice(0, 8).forEach((i) => {
        const nm = view.names[view.hip[i]];
        rows.appendChild(el('tr', {}, [
            el('td', { text: nm ? ((lang === 'es' && nm[1]) || nm[0]) : 'HIP ' + view.hip[i] }),
            el('td', { text: nf().format(Math.round(alt[i] * 10) / 10) + '\u00b0' }),
            el('td', { text: compass(hor.az[i]) + ' ' + Math.round(hor.az[i]) + '\u00b0' }),
            el('td', { text: nf().format(Math.round(view.mag[i] * 10) / 10) }),
            el('td', { text: '' })
        ]));
    });
    let visible = 0; for (let i = 0; i < view.n; i++) if (view.mag[i] <= 6.5) visible++;
    $('sky-stars-note').textContent = fmt('sky.pre.stars', { v: nf().format(visible), n: nf().format(pre.catN), x: nf().format(pre.extraN) }) + (sky.lines ? ' ' + t('sky.pre.lines') : '');
    let worst = 0; for (const i of pre.unknown) if (view.mag[i] <= 6.5) worst = Math.max(worst, pre.inst.uncertainty(i, res.tYears, pre.rvRms));
    $('sky-accuracy').textContent = t('sky.pre.model') + ' ' + fmt('sky.pre.rv', { u: nf().format(pre.unknown.length), n: nf().format(view.n), s: nf().format(Math.round(pre.rvRms * 10) / 10), w: fmtAngle(worst) })
        + ' ' + fmt('sky.pre.time', { dt: nf().format(Math.round(res.dtSeconds)), days: nf().format(Math.round(res.dtSeconds / 864) / 100) });
}

// Error medido frente a Horizons en el anio muestreado mas cercano al que se esta viendo.
function skyAccuracyText(year) {
    const v = sky.validation;
    if (!v) return t('sky.noValidation');
    const years = [...new Set(v.cases.map((c) => c.year))];
    const y = years.reduce((a, b) => (Math.abs(b - year) < Math.abs(a - year) ? b : a));
    const at = v.cases.filter((c) => c.year === y);
    const max = (ids) => Math.max(...at.filter((c) => ids.includes(c.body)).map((c) => c.error_arcsec));
    const planets = ['Mercury', 'Venus', 'Mars', 'Jupiter', 'Saturn', 'Uranus', 'Neptune'];
    // segundos de arco, minutos de arco o grados segun el tamano del error
    const f = (n) => {
        if (!Number.isFinite(n)) return '?';
        if (n < 120) return nf().format(Math.round(n * 10) / 10) + '\u2033';
        if (n < 7200) return nf().format(Math.round(n / 6) / 10) + '\u2032';
        return nf().format(Math.round(n / 360) / 10) + '\u00b0';
    };
    return fmt('sky.accuracy', { y: formatYear(y), sun: f(max(['Sun'])), moon: f(max(['Moon'])), planet: f(max(planets)) });
}

function moonPhaseName(angle) {
    const k = ['new', 'waxingCrescent', 'firstQuarter', 'waxingGibbous', 'full', 'waningGibbous', 'lastQuarter', 'waningCrescent'];
    return t('sky.phase.' + k[Math.floor(((angle + 22.5) % 360) / 45)]);
}

function skyErrorText(e) {
    return (e && e.code && t('sky.err.' + e.code)) || (e && e.message) || '?';
}

function updateSky() {
    if (!sky.open) return;
    if (!sky.ready) { $('sky-range').textContent = t('sky.unavailable'); $('sky-body').style.display = 'none'; return; }
    const W = skyRange();
    const year = ybpToYear(state.ybp);
    const inRange = year >= W.minYear && year <= W.maxYear;
    $('sky-body').style.display = inRange ? '' : 'none';
    $('sky-range').textContent = inRange ? '' : fmt('sky.outOfRange', { a: formatYear(W.minYear), b: formatYear(W.maxYear) });
    if (!inRange) return;
    $('sky-error').textContent = '';
    if (!clockUsable()) clockFromYear(year);
    if (!clockUsable()) return;
    const jd = clock.jd;
    if (yearStarsOnly(ChronosSky.jdToCalendar(jd, 'auto').year)) { updateSkyStarsOnly(jd); return; }
    const res = ChronosSky.skyAt({ jd, lat: sky.lat, lon: sky.lon, catalog: sky.stars ? sky.catalog : null });

    const u = ChronosSky.jdToCalendar(jd, sky.calendar);
    $('sky-when').textContent = fmt('sky.when', {
        date: u.day + ' ' + monthName(u.month) + ' ' + formatYear(u.year), cal: t('sky.cal.' + u.calendar),
        ut: pad2(u.hour) + ':' + pad2(u.minute) + ':' + pad2(Math.floor(u.second)), dt: nf().format(Math.round(res.deltaTSeconds))
    });

    const names = {};
    ChronosSky.BODIES.forEach((id) => { names[id] = t('sky.body.' + id); });
    sky.drawn = ChronosSkyView.draw($('sky-chart'), res, {
        catalog: sky.stars ? sky.catalog : null, names, cardinals: t('sky.cardinals'),
        showStars: sky.stars, showNames: sky.names, showLines: sky.lines, dayStars: sky.dayStars, lang
    });

    $('sky-twilight').textContent = t('sky.tw.' + res.twilight);
    const rows = $('sky-rows');
    rows.textContent = '';
    [res.sun, res.moon, ...res.planets].forEach((b) => {
        const up = b.alt > 0;
        const label = t('sky.body.' + b.id) + (b.id === 'Moon' ? ' · ' + moonPhaseName(b.phaseAngle) + ' ' + Math.round(b.phaseFraction * 100) + ' %' : '');
        rows.appendChild(el('tr', { class: up ? '' : 'down' }, [
            el('td', { text: label }),
            el('td', { text: nf().format(Math.round(b.alt * 10) / 10) + '°' }),
            el('td', { text: compass(b.az) + ' ' + Math.round(b.az) + '°' }),
            el('td', { text: b.id === 'Sun' ? '' : nf().format(Math.round(b.mag * 10) / 10) }),
            el('td', { text: up ? '' : t('sky.down') })
        ]));
    });
    $('sky-stars-note').textContent = sky.stars && sky.catalogState === 'missing' ? t('sky.noStars') : '';
    $('sky-accuracy').textContent = skyAccuracyText(year);
}

function setSkyOpen(open) {
    sky.open = open;
    $('sky').classList.toggle('open', open);
    if (!open) return;
    if (events.open) setEventsOpen(false);
    if (!sky.ready) { updateSky(); return; }
    syncPlace();
    sky.started = true;
    skyFieldsFromClock();
    syncControls();
    skyLoadCatalog();
    skyLoadValidation();
    updateSky();
}

/* Sistema solar (pantalla propia: ver sky/solar.js y solar/solar-view.js)  */
/* ------------------------------------------------------------------ */
let solarAccuracy = null;
const solarView = ChronosSolarView.create({
    root: $('solar'),
    getJD: () => (clockUsable() ? clock.jd : NaN),
    getCatalog: () => sky.catalog || null,
    starColor: (bv) => ChronosSkyView.starColor(bv),
    t, fmt, lang: () => lang, nf,
    loadAccuracy: () => {
        if (!solarAccuracy) solarAccuracy = fetch('./data/sky/validation-helio.json').then((r) => (r.ok ? r.json() : null)).catch(() => null);
        return solarAccuracy;
    },
    onExit: () => setSolarOpen(false)
});
function setSolarOpen(open) {
