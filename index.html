<!-- index.html -->
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChronosTerrae | Evolutionary Cartography</title>
    
    <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />

    <style>
        :root {
            /* Tema Claro (Base) */
            --bg-color: #e6dabd;
            --ui-bg: rgba(230, 218, 189, 0.85);
            --text-color: #3e2723;
            --accent: #8b5a2b;
            --font-main: 'Georgia', serif;
            --map-filter: sepia(0.5) contrast(1.1) brightness(0.9);
        }

        body.modern-era {
            --bg-color: #d4e6f1;
            --ui-bg: rgba(255, 255, 255, 0.9);
            --text-color: #1a252f;
            --accent: #2980b9;
            --font-main: system-ui, sans-serif;
            --map-filter: saturate(1.2) contrast(1.05);
        }

        /* Variables Modo Oscuro Global */
        body.dark-mode {
            --bg-color: #121212;
            --ui-bg: rgba(18, 18, 18, 0.85);
            --text-color: #e0e0e0;
            --accent: #bb86fc;
            --map-filter: contrast(1.2) brightness(0.8);
        }

        html, body { width: 100%; height: 100%; }

        body {
            margin: 0; padding: 0;
            background-color: var(--bg-color);
            font-family: var(--font-main);
            color: var(--text-color);
            overflow: hidden;
            transition: all 0.8s ease;
        }

        /* FIX W1: sin alto explicito el contenedor colapsaba a 0x0 y el mapa no se veia */
        #map {
            position: absolute; inset: 0;
            width: 100%; height: 100%;
            transition: filter 0.8s ease;
        }

        .glass-panel {
            background: var(--ui-bg);
            backdrop-filter: blur(8px);
            border: 1px solid var(--accent);
            border-radius: 6px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: all 0.8s ease;
        }

        /* Panel Superior: Controles del Sistema */
        #system-controls {
            position: absolute; top: 20px; right: 20px; z-index: 10;
            display: flex; gap: 10px;
        }

        .sys-btn {
            background: var(--ui-bg); color: var(--text-color);
            border: 1px solid var(--accent); border-radius: 4px;
            padding: 8px 12px; cursor: pointer; font-family: sans-serif;
            font-weight: bold; backdrop-filter: blur(4px);
            transition: transform 0.2s ease;
        }
        .sys-btn:active { transform: scale(0.95); }

        /* Estado del sistema: nunca fallar en silencio */
        #system-status {
            position: absolute; left: 20px; bottom: 20px; z-index: 12;
            max-width: 340px; padding: 8px 12px;
            font-family: sans-serif; font-size: 12px; line-height: 1.4;
            border-left: 3px solid var(--accent);
            display: none;
        }
        #system-status.visible { display: block; }
        #system-status.state-ok { border-left-color: #2e7d32; }
        #system-status.state-warn { border-left-color: #e6a700; }
        #system-status.state-error { border-left-color: #c62828; }

        /* Controles Inferiores */
        #timeline-control {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            width: 85%; max-width: 900px; padding: 15px 25px; z-index: 10;
            display: flex; flex-direction: column; gap: 10px;
        }

        .top-bar { display: flex; justify-content: space-between; align-items: center; }
        #year-display { font-size: 24px; font-weight: bold; min-width: 200px; }
        
        #timeline {
            width: 100%; appearance: none; height: 6px;
            background: var(--text-color); opacity: 0.6; border-radius: 3px; outline: none;
        }
        #timeline::-webkit-slider-thumb {
            appearance: none; width: 20px; height: 20px;
            background: var(--accent); border-radius: 50%; cursor: pointer;
        }

        #era-ticks {
            display: flex; justify-content: space-between;
            font-family: sans-serif; font-size: 11px; opacity: 0.75;
        }

        /* Brújula SVG Dinámica */
        #compass {
            position: absolute; top: 20px; left: 20px; z-index: 10;
            width: 80px; height: 80px; transition: transform 1.2s ease-in-out;
            pointer-events: none;
        }

        /* Info Panel */
        #info-panel {
            position: absolute; top: 70px; right: 20px; width: 300px;
            padding: 20px; z-index: 10; display: none;
        }

        .info-row { margin-top: 8px; font-family: sans-serif; font-size: 13px; word-break: break-word; }
        .info-row b { color: var(--accent); }
        .info-row a { color: var(--accent); }

        .kofi-btn {
            background-color: #29abe0; color: white; padding: 8px 15px;
            text-decoration: none; border-radius: 4px; font-weight: bold; font-family: sans-serif;
            font-size: 14px; display: inline-flex; align-items: center; border: none;
        }
        .kofi-btn img { height: 16px; margin-right: 8px; }
    </style>
</head>
<body class="ancient-era">

    <div id="map"></div>

    <div id="compass">
        <svg viewBox="0 0 100 100">
            <circle cx="50" cy="50" r="46" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="4 4"/>
            <path d="M50 5 L60 50 L50 95 L40 50 Z" fill="currentColor" opacity="0.8"/>
            <text x="43" y="24" fill="var(--bg-color)" font-weight="bold" font-family="sans-serif">N</text>
        </svg>
    </div>

    <!-- Controles de Configuración -->
    <div id="search-container" style="position: absolute; top: 20px; left: 120px; z-index: 10;">
        <input type="text" id="universal-search" placeholder="Búsqueda espacio-temporal..." style="padding: 8px 15px; width: 280px; border-radius: 4px; border: 1px solid var(--accent); background: var(--ui-bg); color: var(--text-color); font-family: var(--font-main); font-weight: bold; backdrop-filter: blur(8px); box-shadow: 0 4px 15px rgba(0,0,0,0.2); outline: none; transition: all 0.3s ease;">
    </div>

    <div id="system-controls">
        <button class="sys-btn" id="btn-lang">EN / ES</button>
        <button class="sys-btn" id="btn-theme">🌙 / ☀️</button>
    </div>

    <div id="info-panel" class="glass-panel">
        <h2 id="entity-title" style="margin-top: 0; color: var(--accent);">--</h2>
        <div id="entity-data">--</div>
    </div>

    <div id="system-status" class="glass-panel"></div>

    <div id="timeline-control" class="glass-panel">
        <div class="top-bar">
            <div id="year-display">Year: -250,000,000</div>
            <a href="https://ko-fi.com/jaimeluisolguinmesina" target="_blank" rel="noopener" class="kofi-btn" id="ui-donate">
                <img src="https://storage.ko-fi.com/cdn/cup-border.png" alt="Ko-fi">
                <span id="donate-label">Support Project</span>
            </a>
        </div>
        <input type="range" id="timeline" min="0" max="2" value="0" step="1">
        <div id="era-ticks"></div>
    </div>

    <script>
        // Diccionario de Interfaz
        const i18n = {
            en: {
                donate: "Support Project",
                yearPrefix: "Year",
                clickPrompt: "Click a region on the map.",
                dataLabel: "Data",
                tierLabel: "Tier",
                eventLabel: "Event date",
                harvestLabel: "Harvested",
                sourceLabel: "Source",
                unknownDate: "Unknown",
                noResults: "No records found for that search.",
                liveOk: "Live intake loaded: {n} records.",
                liveBad: "Live intake unreadable: {err}",
                mapBad: "Map error: {err}"
            },
            es: {
                donate: "Financiar Proyecto",
                yearPrefix: "Año",
                clickPrompt: "Haz clic en una región en el mapa.",
                dataLabel: "Dato",
                tierLabel: "Capa",
                eventLabel: "Fecha del suceso",
                harvestLabel: "Cosechado",
                sourceLabel: "Fuente",
                unknownDate: "Desconocida",
                noResults: "Ningún registro coincide con esa búsqueda.",
                liveOk: "Ingesta viva cargada: {n} registros.",
                liveBad: "Ingesta viva ilegible: {err}",
                mapBad: "Error de mapa: {err}"
            }
        };

        // Base de Datos Semilla con Traducciones (Mock del Agente)
        const mockDatabase = {
            0: {
                yearStr: { es: "-250.000.000 (Pérmico)", en: "-250,000,000 (Permian)" },
                theme: 'ancient-era',
                data: {
                    type: "FeatureCollection",
                    features: [{
                        type: "Feature",
                        properties: { 
                            name: { es: "Supercontinente Pangea", en: "Pangaea Supercontinent" }, 
                            desc: { es: "Masa de tierra única antes de la deriva continental. Flora dominada por helechos.", en: "Single landmass before continental drift. Flora dominated by giant ferns." } 
                        },
                        geometry: { type: "Polygon", coordinates: [[[-40, -40], [40, -40], [60, 20], [10, 60], [-50, 40], [-40, -40]]] }
                    }]
                }
            },
            1: {
                yearStr: { es: "117 d.C.", en: "117 AD" },
                theme: 'ancient-era',
                data: {
                    type: "FeatureCollection",
                    features: [{
                        type: "Feature",
                        properties: { 
                            name: { es: "Imperio Romano", en: "Roman Empire" }, 
                            desc: { es: "Gobernante: Trajano. Población est.: 50-90 millones.", en: "Ruler: Trajan. Est. population: 50-90 million." } 
                        },
                        geometry: { type: "Polygon", coordinates: [[[-9, 38], [35, 31], [40, 41], [0, 52], [-9, 38]]] }
                    }]
                }
            },
            2: {
                yearStr: { es: "1945 d.C.", en: "1945 AD" },
                theme: 'modern-era',
                data: {
                    type: "FeatureCollection",
                    features: [{
                        type: "Feature",
                        properties: { 
                            name: { es: "República Francesa", en: "French Republic" }, 
                            desc: { es: "Inicio de la reconstrucción europea tras la guerra.", en: "Start of European post-war reconstruction." } 
                        },
                        geometry: { type: "Polygon", coordinates: [[[-4, 43], [7, 43], [8, 49], [-4, 49], [-4, 43]]] }
                    }]
                }
            }
        };

        let currentLang = 'en'; // Inglés por defecto para tráfico internacional
        let isDarkMode = false;
        let activePolygonProps = null;
        let liveData = null;

        const t = (key) => i18n[currentLang][key];
        const formatTemplate = (key, vars) => t(key).replace(/\{(\w+)\}/g, (_, k) => (vars[k] !== undefined ? vars[k] : ''));

        const getCssVar = (name, fallback) => {
            const value = getComputedStyle(document.body).getPropertyValue(name).trim();
            return value || fallback;
        };

        const getAccentColor = () => getCssVar('--accent', '#8b5a2b');

        const setStatus = (state, message) => {
            const el = document.getElementById('system-status');
            el.className = 'glass-panel visible state-' + state;
            el.textContent = message;
        };

        const formatDate = (value) => {
            if (!value || value === 'Indeterminado') return t('unknownDate');
            const parsed = new Date(value);
            if (isNaN(parsed.getTime())) return String(value);
            return parsed.toISOString().slice(0, 10);
        };

        const clearInfo = (content) => {
            const data = document.getElementById('entity-data');
            data.textContent = content;
        };

        const addInfoRow = (label, value) => {
            const data = document.getElementById('entity-data');
            const row = document.createElement('div');
            row.className = 'info-row';
            const strong = document.createElement('b');
            strong.textContent = label + ': ';
            row.appendChild(strong);
            row.appendChild(document.createTextNode(String(value)));
            data.appendChild(row);
            return row;
        };

        const mapStyles = {
            light: 'https://basemaps.cartocdn.com/gl/positron-gl-style/style.json',
            dark: 'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json'
        };

        const map = new maplibregl.Map({
            container: 'map',
            style: mapStyles.light,
            center: [10, 30], zoom: 2,
            renderWorldCopies: false
        });

        const applyAccentColor = () => {
            const color = getAccentColor();
            if (map.getLayer('chronos-fill')) map.setPaintProperty('chronos-fill', 'fill-color', color);
            if (map.getLayer('chronos-line')) map.setPaintProperty('chronos-line', 'line-color', color);
        };

        const renderChronosLayer = () => {
            const currentIndex = document.getElementById('timeline').value;
            const era = mockDatabase[currentIndex];
            if (!era) return;

            // FIX W1: MapLibre no resuelve var(--accent) en paint; hay que pasar un color literal
            if (!map.getSource('chronos-source')) {
                map.addSource('chronos-source', { type: 'geojson', data: era.data });
                map.addLayer({
                    id: 'chronos-fill', type: 'fill', source: 'chronos-source',
                    paint: { 'fill-color': getAccentColor(), 'fill-opacity': 0.3 }
                });
                map.addLayer({
                    id: 'chronos-line', type: 'line', source: 'chronos-source',
                    paint: { 'line-color': getAccentColor(), 'line-width': 2 }
                });
            } else {
                map.getSource('chronos-source').setData(era.data);
                applyAccentColor();
            }
        };

        // FIX W1: filtro por id explicito y verificacion de lo realmente oculto
        const purifyMapStyle = () => {
            const style = map.getStyle();
            if (!style || !style.layers) return [];
            const modernEra = document.body.classList.contains('modern-era');
            const hidden = [];

            style.layers.forEach(layer => {
                const id = layer.id || '';
                const isModernSovereignty = /admin|boundary/i.test(id);
                const isPlaceLabel = /place[-_]?label/i.test(id);
                const shouldHide = isModernSovereignty || (isPlaceLabel && !modernEra);
                if (shouldHide && map.getLayer(id)) {
                    map.setLayoutProperty(id, 'visibility', 'none');
                    hidden.push(id);
                }
            });

            console.log('[MAP] Capas deReferencia moderna ocultas: ' + hidden.length + (hidden.length ? ' -> ' + hidden.join(', ') : ''));
            return hidden;
        };

        const applyMapFilter = () => {
            document.getElementById('map').style.filter = getComputedStyle(document.body).getPropertyValue('--map-filter');
        };

        map.on('error', (e) => {
            const message = e && e.error ? e.error.message : 'desconocido';
            setStatus('error', formatTemplate('mapBad', { err: message }));
        });

        map.on('style.load', () => {
            try {
                purifyMapStyle();
                renderChronosLayer();
                applyMapFilter();
            } catch (err) {
                setStatus('error', formatTemplate('mapBad', { err: err.message }));
                throw err;
            }
        });

        map.on('click', 'chronos-fill', (e) => {
            activePolygonProps = e.features[0].properties;
            updateInfoPanel();
            document.getElementById('info-panel').style.display = 'block';
        });

        const renderEraTicks = () => {
            const container = document.getElementById('era-ticks');
            container.textContent = '';
            Object.keys(mockDatabase).forEach(key => {
                const span = document.createElement('span');
                span.textContent = mockDatabase[key].yearStr[currentLang];
                container.appendChild(span);
            });
        };

        const updateUIStrings = () => {
            document.documentElement.lang = currentLang;
            document.getElementById('donate-label').textContent = t('donate');

            const index = document.getElementById('timeline').value;
            const currentEra = mockDatabase[index];
            document.getElementById('year-display').innerText = `${t('yearPrefix')}: ${currentEra.yearStr[currentLang]}`;

            renderEraTicks();

            if (activePolygonProps) {
                updateInfoPanel();
            } else {
                document.getElementById('entity-title').innerText = '';
                clearInfo(t('clickPrompt'));
            }
        };

        const localize = (value) => {
            if (typeof value === 'string') {
                try { return JSON.parse(value); } catch (err) { return value; }
            }
            return value;
        };

        const updateInfoPanel = () => {
            if (!activePolygonProps) return;
            const data = document.getElementById('entity-data');
            data.textContent = '';

            try {
                const nameObj = localize(activePolygonProps.name) || {};
                const descObj = localize(activePolygonProps.desc) || {};
                document.getElementById('entity-title').innerText = nameObj[currentLang] || nameObj.en || '';

                addInfoRow(t('dataLabel'), descObj[currentLang] || descObj.en || t('unknownDate'));

                if (activePolygonProps.timestamp) addInfoRow(t('eventLabel'), formatDate(activePolygonProps.timestamp));
                if (activePolygonProps.harvest_date) addInfoRow(t('harvestLabel'), formatDate(activePolygonProps.harvest_date));
            } catch (err) {
                document.getElementById('entity-title').innerText = '—';
                clearInfo(t('unknownDate'));
            }
        };

        const applyEraTheme = () => {
            const index = document.getElementById('timeline').value;
            const currentEra = mockDatabase[index];
            document.body.className = isDarkMode ? `${currentEra.theme} dark-mode` : currentEra.theme;
        };

        // Controladores de Eventos
        document.getElementById('timeline').addEventListener('input', (e) => {
            applyEraTheme();
            document.getElementById('info-panel').style.display = 'none';
            activePolygonProps = null;

            renderChronosLayer();
            updateUIStrings();
            applyMapFilter();
            purifyMapStyle();
        });

        document.getElementById('btn-lang').addEventListener('click', () => {
            currentLang = currentLang === 'en' ? 'es' : 'en';
            updateUIStrings();
        });

        document.getElementById('btn-theme').addEventListener('click', () => {
            isDarkMode = !isDarkMode;
            applyEraTheme();
            map.setStyle(isDarkMode ? mapStyles.dark : mapStyles.light);
        });

        async function loadLiveAnomalies() {
            try {
                const response = await fetch('./latest_harvest.json', { cache: 'no-store' });
                if (!response.ok) throw new Error('HTTP ' + response.status);
                const parsed = JSON.parse(await response.text());
                if (!parsed || !Array.isArray(parsed.features)) throw new Error('sin array features');

                liveData = parsed;
                setStatus('ok', formatTemplate('liveOk', { n: parsed.features.length }));
            } catch (err) {
                liveData = null;
                setStatus('warn', formatTemplate('liveBad', { err: err.message }));
            }
        }

        const showLiveFeature = (feature) => {
            const props = feature.properties || {};
            const coords = feature.geometry && feature.geometry.coordinates;
            map.flyTo({ center: coords, zoom: 6 });

            if (map.getSource('search-source')) {
                map.getSource('search-source').setData(feature);
            } else {
                map.addSource('search-source', { type: 'geojson', data: feature });
                map.addLayer({
                    id: 'search-point', type: 'circle', source: 'search-source',
                    paint: {
                        'circle-radius': 10,
                        'circle-color': '#ff3333',
                        'circle-stroke-width': 2,
                        'circle-stroke-color': '#ffffff'
                    }
                });
            }

            document.getElementById('entity-title').innerText = props.name || '';
            const data = document.getElementById('entity-data');
            data.textContent = '';
            addInfoRow(t('tierLabel'), props.tier || t('unknownDate'));
            addInfoRow(t('eventLabel'), formatDate(props.timestamp));
            if (props.harvest_date) addInfoRow(t('harvestLabel'), formatDate(props.harvest_date));

            const entityId = String(props.source || '').split(':')[1] || '';
            if (/^Q\d+$/.test(entityId)) {
                const row = addInfoRow(t('sourceLabel'), props.source);
                const link = document.createElement('a');
                link.href = 'https://www.wikidata.org/wiki/' + entityId;
                link.target = '_blank';
                link.rel = 'noopener';
                link.textContent = props.source;
                row.textContent = '';
                const strong = document.createElement('b');
                strong.textContent = t('sourceLabel') + ': ';
                row.appendChild(strong);
                row.appendChild(link);
            } else {
                addInfoRow(t('sourceLabel'), props.source || t('unknownDate'));
            }

            document.getElementById('info-panel').style.display = 'block';
        };

        document.getElementById('universal-search').addEventListener('keydown', (e) => {
            if (e.key !== 'Enter') return;

            const query = e.target.value.toLowerCase().trim();
            if (!query) return;

            let found = false;

            for (const key in mockDatabase) {
                const era = mockDatabase[key];
                const feature = era.data.features.find(f => {
                    const name = (f.properties.name[currentLang] || f.properties.name.en || '').toLowerCase();
                    const desc = (f.properties.desc[currentLang] || f.properties.desc.en || '').toLowerCase();
                    return name.includes(query) || desc.includes(query);
                });
                if (feature) {
                    document.getElementById('timeline').value = key;
                    document.getElementById('timeline').dispatchEvent(new Event('input'));
                    const coords = feature.geometry.coordinates[0][0];
                    map.flyTo({ center: coords, zoom: 4 });
                    activePolygonProps = feature.properties;
                    updateInfoPanel();
                    document.getElementById('info-panel').style.display = 'block';
                    found = true;
                    break;
                }
            }

            if (!found && liveData && liveData.features) {
                const feature = liveData.features.find(f => {
                    const name = String(f.properties.name || '').toLowerCase();
                    const timestamp = String(f.properties.timestamp || '').toLowerCase();
                    return name.includes(query) || timestamp.includes(query);
                });
                if (feature) {
                    showLiveFeature(feature);
                    found = true;
                }
            }

            if (!found) setStatus('warn', t('noResults'));
        });

        // Inicialización
        updateUIStrings();
        loadLiveAnomalies();
    </script>
</body>
</html>
